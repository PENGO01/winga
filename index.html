<style>
/* Customer shop v2.1: image-first masonry, Temu-style categories, 4-tab bottom bar, striped sun. */
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.shop{background:var(--navy);color:var(--on-navy);padding:12px var(--gr) 14px var(--gl);padding-top:calc(12px + env(safe-area-inset-top,0px));position:relative;overflow:hidden}
header.shop .bar{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
header.shop .mark{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
header.shop .mark .t{font-size:18px}
header.shop .tag{color:var(--on-navy-dim);font-size:12.5px;margin-top:6px;position:relative;z-index:1}
.sticky{position:sticky;top:0;z-index:15;background:var(--paper);padding:10px var(--gr) 6px var(--gl);display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:0 6px 0 14px;height:42px;transition:height .15s}
.sbox.big{height:48px}
.sbox svg{width:18px;height:18px;color:var(--dim);flex:none}
.sbox input{border:0;outline:none;background:transparent;flex:1;min-width:0;padding:0}
.sbox .clr{border:0;background:var(--sunk);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;color:var(--dim)}
.sbox .clr svg{width:14px;height:14px}
.chips{scroll-behavior:smooth}
.chips .chip{padding:6px 12px;font-size:13px}
.subchips .chip{background:transparent;border-color:transparent;color:var(--dim);padding:4px 10px;font-size:12.5px}
.subchips .chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--sunk);color:var(--ink)}
main{padding:12px var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
/* masonry */
.mas{columns:2;column-gap:10px}
@media (min-width:620px){.mas{columns:3}}
.pc{break-inside:avoid;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block;width:100%;text-align:left;padding:0;color:inherit;position:relative}
.pc .im{display:block;width:100%;background:var(--sunk)}
.pc .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.pc .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .ds{font-weight:400;font-size:12px;color:var(--dim);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pr{display:flex;align-items:center;gap:6px;margin-top:2px}
.pc .pr b{font-family:var(--num);font-weight:600;font-size:15px}
.pc .pr .ask{font-size:12.5px;font-weight:600;color:var(--jua-text)}
.pc .pr .inc{color:var(--amber-brand);display:grid}
.pc .pr .inc svg{width:15px;height:15px}
.pc .ft{display:flex;align-items:center;gap:6px;margin-top:6px}
.pc .ft .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc .ft .sold{font-size:10.5px;color:var(--faint);white-space:nowrap}
/* bottom nav: ink bar, cyan = you are here, gold badge */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);border-top:1px solid #262626;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:#9A9A9A;position:relative}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--cyan);font-weight:600}
nav.tabs .bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--jua);color:#121212;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--num)}
/* categories tab */
.catv{display:grid;grid-template-columns:116px 1fr;min-height:calc(100vh - 200px);margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.rail{background:var(--sunk);display:flex;flex-direction:column}
.rail button{border:0;background:transparent;text-align:left;padding:15px 12px 15px 14px;font-size:13.5px;font-weight:500;color:var(--dim);border-left:3px solid transparent;line-height:1.25}
.rail button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;border-left-color:var(--jua)}
.subgrid{padding:14px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;align-content:start}
.subgrid h3{grid-column:1/-1;font-size:15px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.sc .c{width:62px;height:62px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.sc .c svg{width:28px;height:28px}
.sc:first-of-type .c{background:var(--jua);border-color:var(--jua);color:#121212}
/* product page */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--sunk);scrollbar-width:none;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;max-height:62vh;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.pp{font-family:var(--num);font-weight:600;font-size:24px}
.desc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;line-height:1.5}
/* three semi-equal action buttons */
.actbar{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;align-items:stretch}
.actbar.two{grid-template-columns:1fr 1.6fr}
.actbar .btn{border-radius:999px;min-height:48px;padding:8px 10px;font-size:14px;white-space:nowrap}
.actbar .btn.chat{background:#E3F6EA;color:#128C4A}
:root[data-theme="dark"] .actbar .btn.chat{background:#10301E;color:#3CC47E}
.actbar .btn.cartb{background:var(--jua);color:#121212}
/* qty sheet */
.qs{display:flex;gap:12px;align-items:center}
.qs img{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--sunk);flex:none}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.sumrow b{font-family:var(--num);font-size:18px}
/* cart */
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.ci .n{font-weight:600;line-height:1.25;font-size:14px}
.ci .p{font-family:var(--num);font-size:13px;color:var(--dim);margin:2px 0 6px}
.ci .note{font-size:12.5px;color:var(--dim);background:var(--sunk);border-radius:8px;padding:4px 8px;margin:2px 0 6px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ph{display:flex;align-items:center;gap:10px;padding-top:4px}
.ph h1{flex:1;font-size:22px}
/* me */
.mehead{background:var(--navy);color:var(--on-navy);margin:-12px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:22px var(--gr) 22px var(--gl);padding-top:calc(22px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;min-height:25vh}
.mehead .av{width:62px;height:62px;border-radius:50%;background:var(--jua);color:#121212;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;flex:none}
.mehead .nm{font-family:var(--display);font-weight:800;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehead .wa{color:var(--on-navy-dim);font-family:var(--num);font-size:13px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mehead .gear{width:42px;height:42px;border-radius:50%;border:0;background:#262626;color:#fff;display:grid;place-items:center;flex:none;align-self:center}
.mehead .gear svg{width:21px;height:21px}
.chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-size:11px;padding:2px 8px;font-family:var(--body)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-size:12.5px;font-weight:500;position:relative}
.tl .fi{width:46px;height:46px}.tl .fi svg{width:21px;height:21px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink)}
.mrow .fi{width:34px;height:34px}.mrow .fi svg{width:17px;height:17px}
.mrow .chev{width:18px;height:18px;color:var(--faint);margin-left:auto}
.mrow .val{margin-left:auto;color:var(--dim);font-size:13px}
.mrow.red{color:var(--red)}
.oi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.oi .th{display:flex}
.oi .th img{width:38px;height:38px;border-radius:9px;object-fit:cover;border:2px solid var(--card);margin-left:-10px;background:var(--sunk)}
.oi .th img:first-child{margin-left:0}
.res{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.res button:first-child{border-top:0}
.paybox{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.paybox .pv{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.paybox .pn{font-family:var(--num);font-weight:600;font-size:16px}
.howlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.howlist li{display:flex;align-items:center;gap:12px;font-weight:500}
.howlist b{width:32px;height:32px;border-radius:50%;background:var(--jua);color:#121212;display:grid;place-items:center;font-family:var(--num);flex:none}
.big-ok{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.big-ok .fi{width:64px;height:64px;background:var(--green-soft);color:var(--green)}
.big-ok .fi svg{width:30px;height:30px}
.guest{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 0 6px}
.guest .brandmark{width:72px;height:72px}
.gbtn{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.gbtn svg{width:18px;height:18px}
.dupbox{background:var(--jua-soft);border:1px solid var(--line-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dupbox .row .btn{flex:1;border-radius:999px}
.sendbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.sendbtn svg{width:19px;height:19px}
</style>
</head>

/* ---------------- basket (on this phone) ---------------- */
var CART=load("winga.cart.v2",[]);
function load(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function buyable(p){return p&&p.status==="active"&&p.price!=null;}
function cartItems(){return CART.map(function(c){return {c:c,p:byId(c.id)};}).filter(function(x){return buyable(x.p);});}
function cartCount(){return cartItems().reduce(function(s,x){return s+x.c.qty;},0);}
function inCart(id){return CART.find(function(c){return c.id===id;});}
function sum(items){var s=0;items.forEach(function(x){if(x.p.price!=null)s+=x.p.price*x.c.qty;});return s;}
function byId(id){return S.products.find(function(p){return p.id===id;});}
var MYORDERS=load("niagize.myorders",[]);

/* ---------------- shared bits ---------------- */
function stars(n){n=n||2;var s="";for(var i=1;i<=3;i++)s+=i<=n?"★":"<i>★</i>";return '<span class="stars" title="'+esc(t("rate_"+n))+'" aria-label="'+esc(t("rate_"+n))+'">'+s+'</span>';}
function priceHtml(p){return p.price!=null?'<b>TSh '+W.money(p.price)+'</b>':'<span class="ask">'+esc(t("noPrice"))+'</span>';}
function hbtns(){return '<button class="hbtn" data-act="shareShop" aria-label="'+esc(t("share"))+'">'+IC.share+'</button><button class="hbtn" data-act="lang" aria-label="'+esc(t("lang"))+'">'+(W.lang==="sw"?"SW":"EN")+'</button><button class="hbtn" data-act="theme" aria-label="'+esc(t("theme"))+'">'+(W.isDark()?IC.sun:IC.moon)+'</button><button class="hbtn" data-act="how" aria-label="'+esc(t("how_title"))+'">'+IC.bulb+'</button>';}
function chev(){return IC.chev.replace('<svg','<svg class="chev"');}
function card(p){
  var ic=inCart(p.id);
  return '<div class="pc"><button class="pcopen" data-act="open" data-id="'+p.id+'" style="all:unset;display:block;width:100%;cursor:pointer">'+
   '<img class="im" src="'+esc(p.thumbUrl)+'" alt="'+esc(p.name)+'" loading="lazy">'+
   '<div class="bd"><div class="nm">'+esc(p.name)+'</div>'+(p.description?'<div class="ds">'+esc(p.description)+'</div>':'')+
   '<div class="pr">'+priceHtml(p)+(ic?'<span class="inc" title="'+esc(t("inCart"))+'" aria-label="'+esc(t("inCart"))+'">'+IC.cart+'</span>':'')+'</div></div></button>'+
   '<div class="bd" style="padding-top:0"><div class="ft"><button class="fi sm wa" data-act="chat" data-id="'+p.id+'" aria-label="'+esc(t("chat"))+'">'+IC.wa+'</button>'+
   '<div class="mid">'+stars(p.rating)+(p.ordered?'<span class="sold">'+esc(t("sold_n",{n:p.ordered}))+'</span>':'')+'</div>'+
   (buyable(p)?'<button class="fi sm jua" data-act="qty" data-mode="cart" data-id="'+p.id+'" aria-label="'+esc(t("addCart"))+'">'+IC.cartPlus+'</button>':'<span style="width:32px"></span>')+'</div></div></div>';
}
function forYou(n){return '<hr class="sep"><div class="eyebrow">'+esc(t("me_for_you"))+'</div><div class="mas">'+S.products.slice(0,n).map(card).join("")+'</div>';}
function loader(){return '<div style="display:grid;place-items:center;padding:40px">'+W.SUN+'</div>';}

/* ---------------- tabs ---------------- */
function renderTabs(){
  var n=cartCount();
  $("#tabs").hidden=!S.loaded;
  $("#tabs").innerHTML='<div class="in">'+[["home",IC.home,t("nav_home")],["cats",IC.cats,t("nav_cats")],["cart",IC.cart,t("nav_cart")],["me",IC.me,t("nav_me")]].map(function(x){
    return '<button data-tab="'+x[0]+'" aria-current="'+(S.tab===x[0]?"page":"false")+'">'+x[1]+'<span>'+esc(x[2])+'</span>'+(x[0]==="cart"&&n?'<span class="bdg">'+n+'</span>':'')+'</button>';}).join("")+'</div>';
}
function render(){
  renderTabs();
  var a=$("#app");
  if(!S.loaded){a.innerHTML=W.splash("Niagize");return;}
  var head='<header class="shop"><div class="bar"><div class="mark">'+W.MARK+'<span class="t">'+esc(S.shop.name||"Niagize Kariakoo")+'</span>'+W.betaPill()+'</div>'+hbtns()+'</div><div class="tag">'+esc(t("tagline"))+'</div></header>';
  if(S.tab==="cats"){a.innerHTML=head+'<main>'+vCats()+'</main>';return;}
  if(S.tab==="cart"){a.innerHTML='<main style="padding-top:calc(14px + env(safe-area-inset-top,0px))">'+vCart()+'</main>';return;}
  if(S.tab==="me"){a.innerHTML='<main style="padding-top:calc(12px + env(safe-area-inset-top,0px))">'+vMe()+'</main>';return;}
  a.innerHTML=head+vSticky()+'<main><div class="ptr" id="ptr"></div>'+vHome()+'</main>';
  centerChips();
  var q=$("#q");if(q&&S.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);S.focusQ=false;}
}
/* keep the chosen category chip in view (e.g. Electronics hidden off to the side) */
function centerChips(){
  document.querySelectorAll(".sticky .chips").forEach(function(row){
    var on=row.querySelector('[aria-pressed="true"]');if(!on)return;
    var want=on.offsetLeft-(row.clientWidth-on.offsetWidth)/2;
    row.style.scrollBehavior="auto";row.scrollLeft=S["sl_"+row.dataset.row]||0;row.style.scrollBehavior="";
    requestAnimationFrame(function(){row.scrollLeft=Math.max(0,want);S["sl_"+row.dataset.row]=Math.max(0,want);});
  });
}
function vSticky(){
  var subs=S.cat!=="all"?W.subs(S.cat):[];
  return '<div class="sticky"><label class="sbox'+(S.searching?" big":"")+'">'+IC.search+'<input id="q" type="search" placeholder="'+esc(t("searchPh"))+'" value="'+esc(S.q)+'" autocomplete="off" enterkeyhint="search">'+(S.q?'<button class="clr" data-act="clearQ" aria-label="'+esc(t("del"))+'">'+IC.x+'</button>':'')+'</label>'+
   '<div class="chips" data-row="cat">'+['all'].concat(W.CATS).map(function(c){return '<button class="chip" data-act="cat" data-cat="'+c+'" aria-pressed="'+(S.cat===c)+'">'+esc(c==="all"?t("all"):W.catLabel(c))+'</button>';}).join("")+'</div>'+
   (subs.length?'<div class="chips subchips" data-row="sub">'+[""].concat(subs).map(function(s){return '<button class="chip" data-act="sub" data-sub="'+s+'" aria-pressed="'+(S.sub===s)+'">'+esc(s?W.catLabel(S.cat,s):t("all"))+'</button>';}).join("")+'</div>':'')+'</div>';
}
function filtered(){
  var list=S.products;
  if(S.cat!=="all")list=list.filter(function(p){return p.category===S.cat&&(!S.sub||p.subcategory===S.sub);});
  var q=S.q.trim();
  if(q&&fuse){var ids={};fuse.search(q).forEach(function(r){ids[r.item.id]=r.score;});list=list.filter(function(p){return p.id in ids;}).sort(function(a,b){return ids[a.id]-ids[b.id];});}
  else if(q){var ql=q.toLowerCase();list=list.filter(function(p){return [p.name,p.description,W.catLabel(p.category)].join(" ").toLowerCase().indexOf(ql)>=0;});}
  return list;
}
function vHome(){
  var h="";
  if(W.offline)h+='<div class="banner">'+esc(t("offline"))+'</div>';
  var list=filtered();
  if(!S.products.length)return h+'<div class="empty">'+esc(t("emptyShop"))+'</div>';
  if(!list.length)return h+'<div class="empty">'+esc(t("noMatch"))+'</div>';
  return h+'<div class="mas">'+list.map(card).join("")+'</div>';
}
function vCats(){
  var c=S.railCat;
  var rail='<div class="rail">'+W.CATS.map(function(k){return '<button data-act="rail" data-cat="'+k+'" aria-pressed="'+(c===k)+'">'+esc(W.catLabel(k))+'</button>';}).join("")+'</div>';
  function n(sub){return S.products.filter(function(x){return x.category===c&&(!sub||x.subcategory===sub);}).length;}
  var all=n("");
  var subs=W.subs(c).map(function(s){var k=n(s);
    return '<button class="sc" data-act="goSub" data-cat="'+c+'" data-sub="'+s+'"><span class="c">'+W.catIcon(c,s)+'</span>'+esc(W.catLabel(c,s))+(k?' <span class="muted small num">'+k+'</span>':'')+'</button>';}).join("");
  return '<div class="catv">'+rail+'<div class="subgrid"><h3>'+esc(W.catLabel(c))+'</h3><button class="sc" data-act="goSub" data-cat="'+c+'" data-sub=""><span class="c">'+W.catIcon(c)+'</span>'+esc(t("all"))+(all?' <span class="muted small num">'+all+'</span>':'')+'</button>'+subs+'</div></div>';
}
function noteHtml(n){return n?'<div class="note">'+IC.pen.replace('<svg','<svg style="width:12px;height:12px;vertical-align:-1px;margin-right:4px"')+esc(n)+'</div>':'';}
function vCart(){
  var items=cartItems();
  var h='<div class="ph"><h1>'+esc(t("cart_title"))+'</h1>'+(items.length?'<button class="btn sm ghost" data-act="clearCart" style="border-radius:999px">'+IC.trash+esc(t("cart_clear"))+'</button>':'')+'</div>';
  if(!items.length)return h+'<div class="empty">'+esc(t("cart_empty"))+'</div>'+forYou(10);
  h+='<div class="card">'+items.map(function(x){return '<div class="ci"><img src="'+esc(x.p.thumbUrl)+'" alt=""><div><div class="n">'+esc(x.p.name)+'</div><div class="p">TSh '+W.money(x.p.price)+'</div>'+noteHtml(x.c.note)+
    '<span class="qty"><button data-act="cq" data-id="'+x.p.id+'" data-d="-1" aria-label="-">−</button><b>'+x.c.qty+'</b><button data-act="cq" data-id="'+x.p.id+'" data-d="1" aria-label="+">+</button></span></div>'+
    '<button class="fi sm red" data-act="rmCart" data-id="'+x.p.id+'" aria-label="'+esc(t("del"))+'" style="align-self:start">'+IC.trash+'</button></div>';}).join("")+'</div>';
  h+='<hr class="sep">'+deliveryBlock()+addrBlock()+'<hr class="sep">'+totalLine(sum(items));
  h+='<button class="btn green block" data-act="send" style="border-radius:999px;min-height:52px"'+(W.waPhone(S.shop.whatsapp)?'':' disabled')+'>'+IC.wa+esc(t("cart_send"))+'</button>';
  return h;
}
/* the total is plain text: the price only changes on the seller's side after agreeing on WhatsApp */
function totalLine(s){return '<div class="sumline"><span>'+esc(t("cart_total"))+'</span><b>TSh '+W.money(s)+'</b></div><div class="hint" style="margin-top:-8px">+ '+esc(t("delivery"))+': '+esc(t("fee_tbd"))+'</div>';}
function deliveryBlock(){
  return '<div class="stack" style="gap:8px"><div class="eyebrow">'+esc(t("delivery"))+'</div><div class="seg2">'+["fasta","leo"].map(function(d){
    return '<label class="radio" data-on="'+(S.delivery===d)+'"><input type="radio" name="dl" value="'+d+'"'+(S.delivery===d?" checked":"")+' data-act="dl"><span class="rt">'+esc(t("del_"+d))+'</span></label>';}).join("")+'</div></div>';
}
function addrBlock(){
  if(!S.me||S.me.needsProfile)return "";

  if(!S.addrId)S.addrId=S.addrs[0].id;

}
function vMe(){
  if(!S.me){
    return '<div class="guest">'+W.sunSvg(true)+'<h2>'+esc(t("me_guest"))+'</h2><p class="muted" style="margin:0;max-width:32ch">'+esc(t("me_guest_s"))+'</p></div>'+
     '<button class="btn primary block" data-act="signin" style="border-radius:999px">'+esc(t("signin"))+'</button><button class="btn ghost block" data-act="signup" style="border-radius:999px">'+esc(t("signup"))+'</button>'+forYou(8);

/* ---------------- pages and sheets ---------------- */
var POP={qty:1,how:1,confirm:1};
function open(name,ctx){stack.push({n:name,c:ctx||{}});draw(true);}
function back(){stack.pop();if(!stack.length)try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}draw(false);}
function closeAll(){stack=[];draw(false);try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
function top(){return stack[stack.length-1];}
function draw(first){
  var r=$("#sheetRoot");if(!stack.length){r.innerHTML="";render();return;}
  var cur=top(),html=PAGES[cur.n](cur.c),pop=POP[cur.n];
  var under="";if(pop&&stack.length>1){var u=stack[stack.length-2];under='<div class="scrim page"><div class="sheet">'+PAGES[u.n](u.c)+'</div></div>';}
  r.innerHTML=under+'<div class="scrim'+(pop?(cur.n==="how"?" center":""):" page")+(first?" anim":"")+'" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  var g=$("#gal");if(g&&g.children.length>1)g.addEventListener("scroll",function(){var i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll("#dots i").forEach(function(d,j){d.className=j===i?"on":"";});},{passive:true});
}
function hd(title,extra){return '<div class="hd"><button class="iconbtn" data-act="back" aria-label="'+esc(t("back"))+'" style="margin-left:-8px">'+IC.back+'</button><h2>'+esc(title)+'</h2>'+(extra||"")+'</div>';}
function field(id,icon,ph,val,extra){return '<label class="ifield" id="w_'+id+'">'+icon+'<input id="'+id+'" placeholder="'+esc(ph)+'" value="'+esc(val||"")+'"'+(extra||"")+'></label>';}

 product:function(c){

  var tl=closed?'<div class="banner" style="background:var(--red-soft);border-color:transparent;color:var(--red)"><b>'+esc(t("st_cancelled"))+'</b>'+(o.cancel_reason?' · '+esc(o.cancel_reason):'')+'<div class="small" style="width:100%;color:var(--ink)">'+esc(t("o_closed"))+'</div></div>':'<div class="timeline">'+STEPS.map(function(s,i){var h=(o.history||[]).find(function(x){return x.s===s;});return '<div class="st'+(i<idx?" on":i===idx?" cur":"")+'"><span class="dot"></span><div><div class="tt">'+esc(t("st_"+s))+'</div>'+(h?'<div class="ss">'+esc(W.when(h.at))+'</div>':'')+'</div></div>';}).join("")+'</div>';
  var pays=(o.payments||[]).filter(function(p){return p.number;});
  return hd(t("o_title",{code:o.code}),'<span class="ost '+cur+'">'+esc(t("st_"+cur))+'</span>')+'<div class="bd">'+

function readAddr(){var c=top().c,a=c.a;var l=$("#ad_label");if(!l)return;a.label=l.value;a.line=$("#ad_line").value;a.landmark=$("#ad_land").value;a.accepted_terms=$("#ad_terms").checked;c.q=$("#ad_q").value;}

function addToCart(id,q,note){
  note=String(note||"").trim().slice(0,200);
  var c=inCart(id);
  if(c){c.qty=Math.min(99,c.qty+q);if(note&&c.note!==note)c.note=c.note?(c.note+"; "+note).slice(0,200):note;}
  else CART.push({id:id,qty:q,note:note||undefined});
  save("winga.cart.v2",CART);W.db.log("cart",id);
}
async function placeOrder(items){
  var w=null;try{w=window.open("","_blank");}catch(e){}   // open now (inside the tap) so iPhone doesn't block it
  try{
    var addr=S.me&&!S.me.needsProfile&&S.addrs.length?S.addrId:null;
    var r=await W.db.createOrder(items,S.delivery,addr,null,null);
    var link=W.adminUrl()+"o.html#"+r.code;   // handoff page: order at a glance, then into the Boss app
    var msg=t("wa_hello")+"\n"+t("wa_items",{code:r.code,n:r.count})+"\n"+link;
    var url=W.wa(S.shop.whatsapp,msg);
    if(w)w.location.href=url;
    MYORDERS.unshift(r.code);MYORDERS=MYORDERS.slice(0,30);save("niagize.myorders",MYORDERS);
    S.products.forEach(function(p){var it=items.find(function(i){return i.id===p.id;});if(it)p.ordered=(p.ordered||0)+it.qty;});
    stack=[];var ctx={fresh:true,waUrl:url,loading:true};open("order",ctx);
    try{history.replaceState(null,"","#o-"+r.code);}catch(e){}
    ctx.o=await W.db.getOrder(r.code);ctx.loading=false;draw(false);
    return true;
  }catch(e){if(w)try{w.close();}catch(_){}console.error(e);W.toast(t("error"));return false;}
}

/* stay signed in: keep the last known profile so a slow or offline network never looks like a log-out */
async function refreshMe(){
  try{S.me=await W.db.profile();}catch(e){S.me=load("niagize.me",null);return;}
  save("niagize.me",S.me);
  try{S.addrs=S.me&&!S.me.needsProfile?await W.db.addresses():[];}catch(e){}
  if(S.addrs.length&&!S.addrs.some(function(a){return a.id===S.addrId;}))S.addrId=S.addrs[0].id;
}
async function loadHistory(ctx){
  var cached=load("niagize.hist",null);if(cached){ctx.list=cached;ctx.more=true;draw(false);}
  var mine=[];
  try{
    if(S.me&&!S.me.needsProfile)mine=await W.db.myOrders();
    var have={};mine.forEach(function(o){have[o.code]=1;});
    var guest=MYORDERS.filter(function(c){return !have[c];}).slice(0,15);
    var got=await Promise.all(guest.map(function(c){return W.db.getOrder(c).catch(function(){return null;});}));
    mine=mine.concat(got.filter(Boolean)).sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
    save("niagize.hist",mine.slice(0,30));
  }catch(e){mine=cached||[];}
  ctx.list=mine;ctx.more=false;if(top()&&top().c===ctx)draw(false);
}

    case "sendNow":el.disabled=true;await placeOrder(cur.c.items);break;

    case "eye":var f=$("#"+el.dataset.for),show=f.type==="password";f.type=show?"text":"password";el.innerHTML=show?IC.eyeOff:IC.eye;break;
    case "signin":readAuth();var keep=(cur&&cur.n==="auth"&&cur.c.f)||{};stack=stack.filter(function(s){return s.n!=="auth";});open("auth",{mode:"signin",f:{user:keep.user||""}});break;
    case "signup":readAuth();var keep2=(cur&&cur.n==="auth"&&cur.c.f)||{};stack=stack.filter(function(s){return s.n!=="auth";});open("auth",{mode:"signup",f:keep2});break;
    case "google":await W.db.signInGoogle();break;
    case "complete":open("complete",{f:{name:(S.me&&S.me.full_name)||""}});break;
    case "forgot":readAuth();var fu=(cur&&cur.c.f&&cur.c.f.user)||"";window.open(W.wa(S.shop.whatsapp,t("forgot_msg",{u:fu||"…"})),"_blank","noopener");break;
    case "settings":open("settings");break;
    case "about":open("text",{title:t("set_about"),body:t("about_body")});break;
    case "terms":readAuth();if(cur&&cur.n==="addrForm")readAddr();open("text",{title:t("set_terms"),body:t("terms_body")});break;
    case "signout":await W.db.signOut();S.me=null;S.addrs=[];save("niagize.me",null);save("niagize.hist",null);closeAll();break;
    case "delAcc":open("confirm",{title:t("del_acc"),body:t("del_acc_s"),yes:t("yesDelAcc"),act:"delAccYes"});break;
    case "delAccYes":await W.db.account("delete");await W.db.signOut();S.me=null;S.addrs=[];save("niagize.me",null);save("niagize.hist",null);closeAll();break;
    case "saveContacts":
      var sw=$("#s_wa").value.trim(),se=$("#s_email").value.trim();
      if(W.waPhone(sw).length<12)return bad("s_err","w_s_wa",t("err_wa"));
      if(se&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(se))return bad("s_err","w_s_email",t("need_field",{f:t("email")}));
      try{await W.db.account("contacts",{whatsapp:sw,email:se});}catch(x){if(x.message==="duplicate")return bad("s_err","w_s_wa",t("err_dup"));throw x;}
      await refreshMe();W.toast(t("saved"));draw(false);break;
    case "history":var hctx={list:null};open("history",hctx);loadHistory(hctx);break;
    case "openOrder":openOrder(el.dataset.code);break;
    case "reorder":var hl=cur.c.list.find(function(o){return o.code===el.dataset.code;});hl.items.forEach(function(i){if(i.product_id&&buyable(byId(i.product_id)))addToCart(i.product_id,i.qty,i.note);});S.tab="cart";closeAll();break;
    case "copyTxt":W.copy(el.dataset.v);break;
    case "addrs":open("addrs");break;
    case "addrNew":open("addrForm",{a:{accepted_terms:false}});break;
    case "addrEdit":open("addrForm",{a:JSON.parse(JSON.stringify(S.addrs.find(function(x){return x.id===id;})))});break;
    case "addrDel":await W.db.deleteAddress(id);await refreshMe();draw(false);break;
    case "addrPick":readAddr();var r=cur.c.results[+el.dataset.i];cur.c.a.line=r.display_name;cur.c.a.lat=+r.lat;cur.c.a.lng=+r.lon;cur.c.results=null;draw(false);break;
    case "addrSave":readAddr();var ad=cur.c.a;
      if(!ad.line||!ad.line.trim())return bad("ad_err","w_ad_line",t("need_field",{f:t("addr_line").toLowerCase()}));
      if(!ad.accepted_terms)return bad("ad_err","w_ad_terms",t("err_terms"));
      var savedA=await W.db.saveAddress(ad);await refreshMe();S.addrId=savedA.id;W.toast(t("saved"));back();render();break;
  }}catch(err){console.error(err);W.toast(t("error"));}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.act==="dl"){S.delivery=el.value;if(stack.length)draw(false);else render();}
  if(el.dataset.act==="ad"){S.addrId=el.value;if(stack.length)draw(false);else render();}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){S.q=e.target.value;S.searching=true;S.focusQ=true;render();}
  if(e.target.closest&&e.target.closest(".ifield.bad"))e.target.closest(".ifield").classList.remove("bad");
  if(e.target.id==="ad_q"){var v=e.target.value;clearTimeout(searchT);if(v.trim().length<3)return;searchT=setTimeout(async function(){readAddr();var c=top().c;c.results=await geocode(v);draw(false);var i=$("#ad_q");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},650);}
});
document.addEventListener("focusin",function(e){if(e.target.id==="q"&&!S.searching){S.searching=true;var b=e.target.closest(".sbox");if(b)b.classList.add("big");}});
document.addEventListener("focusout",function(e){if(e.target.id==="q"&&!S.q){S.searching=false;var b=e.target.closest(".sbox");if(b)b.classList.remove("big");}});
document.addEventListener("submit",async function(e){
  var form=e.target.dataset.form;if(form!=="auth"&&form!=="complete")return;e.preventDefault();
  var c=top().c;if(c.busy)return;
  if(form==="complete"){
    var cf=c.f={name:$("#c_name").value.trim(),user:$("#c_user").value.trim().toLowerCase().replace(/^@/,""),wa:$("#c_wa").value.trim()};
    if(cf.name.length<2)return bad("c_err","w_c_name",t("err_name"));
    if(!/^[a-z0-9_.]{3,20}$/.test(cf.user))return bad("c_err","w_c_user",t("err_user"));
    if(W.waPhone(cf.wa).length<12)return bad("c_err","w_c_wa",t("err_wa"));
    c.busy=true;draw(false);
    try{await W.db.account("complete",{full_name:cf.name,username:cf.user,whatsapp:cf.wa});c.busy=false;await refreshMe();closeAll();S.tab="me";render();}
    catch(x){c.busy=false;draw(false);var cm=x.message;if(cm==="taken")bad("c_err","w_c_user",t("err_taken"));else if(cm==="duplicate")bad("c_err","w_c_wa",t("err_dup"));else bad("c_err",null,t("error"));}
    return;
  }
  readAuth();
  var up=c.mode==="signup",f=c.f,pass=$("#a_pass").value;
  c.dup=false;
  if(up){
    f.user=f.user.toLowerCase().replace(/^@/,"");
    if(f.name.length<2)return bad("a_err","w_a_name",t("err_name"));
    if(!/^[a-z0-9_.]{3,20}$/.test(f.user))return bad("a_err","w_a_user",t("err_user"));
    if(W.waPhone(f.wa).length<12)return bad("a_err","w_a_wa",t("err_wa"));
    if(f.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email))return bad("a_err","w_a_email",t("need_field",{f:t("email").toLowerCase()}));
    if(pass.length<6)return bad("a_err","w_a_pass",t("err_pass"));
    if(pass!==$("#a_pass2").value)return bad("a_err","w_a_pass2",t("err_pass2"));
    if(!$("#a_terms").checked)return bad("a_err","w_a_terms",t("err_terms"));
  }else{
    if(!f.user)return bad("a_err","w_a_user",t("need_field",{f:t("f_login").toLowerCase()}));
    if(!pass)return bad("a_err","w_a_pass",t("need_field",{f:t("f_secret").toLowerCase()}));
  }
  c.busy=true;draw(false);
  try{
    if(up)await W.db.account("signup",{username:f.user,password:pass,full_name:f.name,whatsapp:f.wa,email:f.email});
    else await W.db.signIn(f.user,pass);
    c.busy=false;await refreshMe();closeAll();S.tab="me";render();
  }catch(x){c.busy=false;var m=x.message;
    if(m==="duplicate"){c.dup=true;draw(false);return;}
    draw(false);
    if(m==="taken")bad("a_err","w_a_user",t("err_taken"));
    else if(m==="locked")bad("a_err",null,t("err_locked"));
    else if(m==="wrong")bad("a_err","w_a_pass",t("err_wrong",{n:(x.info&&x.info.left!=null)?x.info.left:"…"}));
    else if(m==="password")bad("a_err","w_a_pass",t("err_pass"));
    else bad("a_err",null,t("error"));}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&stack.length)back();});

/* ---------------- boot ---------------- */
async function fetchAll(){
  try{S.shop=await W.db.getShop()||{};}catch(e){S.shop={};}
  S.products=(await W.db.listProducts(false)).filter(function(p){return p.status==="active";});
  S.loaded=true;
  fuse=window.Fuse?new Fuse(S.products.map(function(p){return Object.assign({catLabel:W.catLabel(p.category)+" "+(p.subcategory?W.catLabel(p.category,p.subcategory):"")},p);}),{keys:["name","description","catLabel"],threshold:.38,ignoreLocation:true}):null;
  render();
}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,fetchAll);
W.watchNetwork(function(){fetchAll().catch(function(){});});
async function boot(){
  S.me=load("niagize.me",null);
  render();
  try{await fetchAll();}catch(e){console.error(e);W.errorScreen(boot);return;}
  await refreshMe();
  W.db.log("visit");
  var m=location.hash.match(/^#p-(.+)$/),o=location.hash.match(/^#o-(.+)$/);
  if(/[?&]go=me/.test(location.search)){S.tab="me";try{history.replaceState(null,"",location.pathname);}catch(_){}render();if(S.me&&S.me.needsProfile)open("complete",{f:{name:S.me.full_name||""}});}
  else if(m&&byId(m[1])){open("product",{id:m[1]});W.db.log("view",m[1]);}
  else if(o)openOrder(o[1]);
  else{var seen=W.ls("winga.how")==="1";if(!seen&&S.products.length){open("how");W.ls("winga.how","1");}}
}
boot();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
</script>

<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niagize Kariakoo</title>
<meta name="description" content="Bidhaa za Kariakoo, mlangoni kwako. Tafuta, agiza, pokea.">
<meta name="theme-color" content="#12283C">
<meta property="og:title" content="Niagize Kariakoo">
<meta property="og:description" content="Bidhaa za Kariakoo, mlangoni kwako.">
<meta property="og:image" content="docs/social-preview.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
/* Shop: image-first grid. Categories on top for the eyes, search at the bottom for the thumb. */
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.shop{background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:18px var(--gr) 18px var(--gl);padding-top:calc(18px + env(safe-area-inset-top,0px))}
header.shop::after{content:"";position:absolute;right:-60px;top:-80px;width:200px;height:200px;border-radius:50%;background:var(--jua);opacity:.2;pointer-events:none}
header.shop .mark{font-size:26px}
header.shop .tag{color:#C8D2DC;font-size:14px;margin-top:6px;max-width:34ch}
header.shop .tools{position:absolute;right:var(--gr);top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:1}
header.shop .tools .seg{background:rgba(255,255,255,.12)}
header.shop .tools .seg button{color:#C8D2DC}
header.shop .tools .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.cats{position:sticky;top:0;z-index:10;background:var(--paper);padding:10px var(--gr) 8px var(--gl);border-bottom:1px solid var(--line)}
main{padding:14px var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;position:relative}
.card .ph{position:relative;aspect-ratio:1/1;background:var(--sunk);max-width:100%}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:9px 11px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .n{font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .p{font-family:var(--num);font-weight:600;font-size:15.5px}
.card .ask{font-size:12.5px;font-weight:600;color:var(--jua-text)}
.badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:var(--jua);color:var(--ink)}
.card.sold .ph img{filter:grayscale(1) opacity(.55)}
.card.sold .badge{background:var(--ink);color:#fff}
.searchbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--paper) 70%,rgba(246,244,238,0));padding:14px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gl)}
.searchbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:0 14px;box-shadow:0 8px 24px rgba(18,40,60,.14)}
.searchbar input{border:0;outline:none;background:transparent;flex:1;min-width:0;padding:14px 0;font-size:16px}
.searchbar svg{width:20px;height:20px;color:var(--dim);flex:none}
.searchbar .cnt{font-size:12px;color:var(--faint);white-space:nowrap}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:var(--r);background:var(--sunk);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:center;background:var(--sunk);max-width:100%}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.pp{font-family:var(--num);font-weight:600;font-size:24px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how li{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.3}
.how li b{width:26px;height:26px;border-radius:50%;background:var(--jua);display:grid;place-items:center;font-family:var(--num);font-size:13px}
.how .x{align-self:flex-end;background:none;border:0;font-weight:600;font-size:13px;color:var(--dim);padding:4px 0}
.foot{text-align:center;color:var(--faint);font-size:12px;padding:22px 0 8px}
.foot b{color:var(--dim)}
</style>
</head>
<body>
<div class="app">
  <header class="shop">
    <div class="tools"><div class="seg" role="group" aria-label="Language"><button data-lang="sw">SW</button><button data-lang="en">EN</button></div></div>
    <div class="mark" id="shopName"><i></i><span>Niagize Kariakoo</span></div>
    <div class="tag" id="shopTag"></div>
  </header>
  <div class="cats"><div class="chips" id="cats" role="group" aria-label="Categories"></div></div>
  <main id="main" aria-live="polite"></main>
  <div class="foot" id="foot"></div>
</div>
<div class="searchbar"><label class="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off" enterkeyhint="search"><span class="cnt" id="cnt"></span></label></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script src="shared/config.js"></script>
<script src="shared/core.js"></script>
<script>
(function(){
"use strict";
var W=window.Winga,t=W.t,esc=W.esc,$=W.$;
var S={shop:{},products:[],cat:"all",q:"",loaded:false},fuse=null;
var IC={wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c.4 2 2.3 4.2 4.8 4.9l1.2-1.2 1.8.8-.3 1.6c-3.6.3-7.6-3.2-8-6.8l1.5-.4.9 1.8z"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'};

function catLabel(c){return t("cat_"+c);}
function renderChrome(){
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===W.lang));});
  $("#shopName span").textContent=S.shop.name||"Niagize Kariakoo";
  $("#shopTag").textContent=S.shop.tagline||"";
  $("#q").placeholder=t("searchPh");
  document.title=S.shop.name||"Niagize Kariakoo";
  var used={};S.products.forEach(function(p){used[p.category]=1;});
  var cats=["all"].concat(W.CATS.filter(function(c){return used[c];}));
  $("#cats").innerHTML=cats.map(function(c){return '<button class="chip" data-cat="'+c+'" aria-pressed="'+(S.cat===c)+'">'+esc(c==="all"?t("all"):catLabel(c))+'</button>';}).join("");
}
function howDismissed(){try{return localStorage.getItem("winga.how")==="1";}catch(e){return false;}}
function renderFoot(){var ig=(S.shop.instagram||"").replace(/^@/,"");$("#foot").innerHTML='<b>'+esc(S.shop.name||"Niagize Kariakoo")+'</b> · '+esc(t("place"))+(ig?' · <a href="https://instagram.com/'+esc(encodeURIComponent(ig))+'" target="_blank" rel="noopener" style="color:inherit">@'+esc(ig)+'</a>':'');}
function filtered(){
  var list=S.products;
  if(S.cat!=="all")list=list.filter(function(p){return p.category===S.cat;});
  var q=S.q.trim();
  if(q&&fuse){var ids={};fuse.search(q).forEach(function(r){ids[r.item.id]=r.score;});list=list.filter(function(p){return p.id in ids;}).sort(function(a,b){return ids[a.id]-ids[b.id];});}
  else if(q){var ql=q.toLowerCase();list=list.filter(function(p){return [p.name,p.description,t("cat_"+p.category),p.colors,p.sizes].join(" ").toLowerCase().indexOf(ql)>=0;});}
  // in stock first, newest first
  return list.slice().sort(function(a,b){return (a.status==="soldout")-(b.status==="soldout");});
}
function card(p){
  var sold=p.status==="soldout";
  var badge=sold?'<span class="badge">'+esc(t("soldout"))+'</span>':(W.isNew(p)?'<span class="badge">'+esc(t("isNew"))+'</span>':'');
  return '<button class="card'+(sold?" sold":"")+'" data-open="'+esc(p.id)+'"><div class="ph"><img loading="lazy" alt="'+esc(p.name)+'" src="'+esc(p.thumbUrl)+'">'+badge+'</div><div class="b"><div class="n">'+esc(p.name)+'</div>'+
    (p.price!=null?'<div class="p">TSh '+W.money(p.price)+'</div>':'<div class="ask">'+esc(t("askPrice"))+'</div>')+'</div></button>';
}
function render(){
  renderChrome();renderFoot();
  var m=$("#main"),h="";
  if(W.mode==="demo")h+='<div class="banner"><span class="pill sun">'+esc(t("example"))+'</span><span class="grow">'+esc(t("exampleBanner"))+'</span></div>';
  if(W.offline)h+='<div class="banner">'+esc(t("offline"))+'</div>';
  if(S.loaded&&S.products.length&&!howDismissed())h+='<section class="how" aria-label="'+esc(t("howTitle"))+'"><div class="eyebrow">'+esc(t("howTitle"))+'</div><ol><li><b>1</b>'+esc(t("how1"))+'</li><li><b>2</b>'+esc(t("how2"))+'</li><li><b>3</b>'+esc(t("how3"))+'</li></ol><button class="x" data-howok>'+esc(t("gotIt"))+'</button></section>';
  if(!S.loaded){h+='<div class="grid">'+[0,1,2,3,4,5].map(function(){return '<div class="card"><div class="ph skeleton"></div><div class="b"><div class="skeleton" style="height:14px;border-radius:6px"></div><div class="skeleton" style="height:14px;width:60%;border-radius:6px"></div></div></div>';}).join("")+'</div>';m.innerHTML=h;return;}
  var list=filtered();
  $("#cnt").textContent=t("count",{n:list.length});
  if(!S.products.length)h+='<div class="empty">'+esc(t("emptyShop"))+'</div>';
  else if(!list.length)h+='<div class="empty">'+esc(t("noMatch"))+'</div>';
  else h+='<div class="grid">'+list.map(card).join("")+'</div>';
  m.innerHTML=h;
}
function waLink(p){
  var url=W.shopUrl()+"#p-"+p.id;
  var text=t("waHello")+"\n*"+p.name+"*"+(p.price!=null?" · TSh "+W.money(p.price):"")+"\n"+url+"\n"+t("waAsk");
  var n=W.waPhone(S.shop.whatsapp);
  return "https://wa.me/"+(n||"")+"?text="+encodeURIComponent(text);
}
function openProduct(id){
  var p=S.products.find(function(x){return x.id===id;});if(!p)return;
  try{history.replaceState(null,"","#p-"+id);}catch(e){}
  var imgs=p.imageUrls.length?p.imageUrls:[p.thumbUrl];
  var b='<div class="gal" id="gal">'+imgs.map(function(u){return '<img alt="'+esc(p.name)+'" src="'+esc(u)+'">';}).join("")+'</div>'+
    (imgs.length>1?'<div class="dots" id="dots">'+imgs.map(function(_,i){return '<i class="'+(i?"":"on")+'"></i>';}).join("")+'</div>':'')+
    '<div><div class="eyebrow">'+esc(catLabel(p.category))+' · '+esc(t("added",{a:W.ago(p.created_at)}))+'</div><h2 style="font-size:22px;margin-top:4px">'+esc(p.name)+'</h2></div>'+
    (p.price!=null?'<div class="pp">TSh '+W.money(p.price)+'</div>':'<div class="pill sun" style="align-self:flex-start;font-size:13px">'+esc(t("askPrice"))+'</div>')+
    (p.status==="soldout"?'<div class="banner">'+esc(t("soldout"))+'</div>':'')+
    (p.sizes?'<div class="stack" style="gap:6px"><div class="eyebrow">'+esc(t("sizes"))+'</div><div class="opts">'+p.sizes.split(/[,;]/).map(function(s){return s.trim()?'<span class="opt">'+esc(s.trim())+'</span>':"";}).join("")+'</div></div>':'')+
    (p.colors?'<div class="stack" style="gap:6px"><div class="eyebrow">'+esc(t("colors"))+'</div><div class="opts">'+p.colors.split(/[,;]/).map(function(s){return s.trim()?'<span class="opt">'+esc(s.trim())+'</span>':"";}).join("")+'</div></div>':'')+
    (p.description?'<div class="stack" style="gap:6px"><div class="eyebrow">'+esc(t("details"))+'</div><div>'+esc(p.description)+'</div></div>':'');
  var f=(p.status!=="soldout"&&!W.waPhone(S.shop.whatsapp)?'<div class="hint" style="text-align:center">'+esc(t("notReady"))+'</div>':'')+'<div class="btns"><button class="btn ghost" data-share="'+esc(p.id)+'">'+IC.share+esc(t("share"))+'</button>'+
    (p.status==="soldout"?'<button class="btn green" disabled>'+IC.wa+esc(t("soldout"))+'</button>':!W.waPhone(S.shop.whatsapp)?'<button class="btn green" disabled title="'+esc(t("notReady"))+'">'+IC.wa+esc(t("orderWa"))+'</button>':'<a class="btn green" target="_blank" rel="noopener" data-ask="'+esc(p.id)+'" href="'+esc(waLink(p))+'">'+IC.wa+esc(t("orderWa"))+'</a>')+'</div>';
  $("#sheetRoot").innerHTML='<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(p.name)+'"><div class="hd"><h2 class="small muted" style="font-family:var(--body);font-weight:500">'+esc(S.shop.name||"Niagize Kariakoo")+'</h2><button class="iconbtn" data-close aria-label="'+esc(t("close"))+'">'+IC.x+'</button></div><div class="bd">'+b+'</div><div class="ft">'+f+'</div></div></div>';
  var g=$("#gal");if(g&&imgs.length>1)g.addEventListener("scroll",function(){var i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll("#dots i").forEach(function(d,j){d.className=j===i?"on":"";});},{passive:true});
}
function closeSheet(){$("#sheetRoot").innerHTML="";try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-open],[data-cat],[data-lang],[data-close],[data-scrim],[data-share],[data-ask],[data-howok]");if(!el)return;
  if("howok" in el.dataset){try{localStorage.setItem("winga.how","1");}catch(_){}render();return;}
  if(el.dataset.open){openProduct(el.dataset.open);return;}
  if(el.dataset.cat){S.cat=el.dataset.cat;render();return;}
  if(el.dataset.lang){W.setLang(el.dataset.lang);render();return;}
  if("close" in el.dataset){closeSheet();return;}
  if("scrim" in el.dataset){if(e.target===el)closeSheet();return;}
  if(el.dataset.ask){W.db.ask(el.dataset.ask);return;}
  if(el.dataset.share){var p=S.products.find(function(x){return x.id===el.dataset.share;});var url=W.shopUrl()+"#p-"+p.id;
    if(navigator.share){navigator.share({title:p.name,text:p.name+(p.price!=null?" · TSh "+W.money(p.price):""),url:url}).catch(function(){});}else W.copy(url);}
});
$("#q").addEventListener("input",function(e){S.q=e.target.value;render();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});

(async function boot(){
  render();
  try{S.shop=await W.db.getShop()||{};}catch(e){S.shop={};}
  try{S.products=await W.db.listProducts(false);}catch(e){S.products=[];}
  S.loaded=true;
  fuse=window.Fuse?new Fuse(S.products.map(function(p){return Object.assign({catLabel:t("cat_"+p.category)},p);}),{keys:["name","description","catLabel","colors","sizes"],threshold:.38,ignoreLocation:true}):null;
  render();
  var m=location.hash.match(/^#p-(.+)$/);if(m)openProduct(m[1]);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
})();
</script>
</body>
</html>

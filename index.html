<style>
/* Layout: one-thumb phone shell. Sticky header, scrolling body, bottom tab bar with a sun-yellow + button.
   Single bright theme on purpose: it must stay readable in direct Kariakoo sun. */
:root{
  --paper:#F6F4EE; --card:#FFFFFF; --sunk:#EFECE3; --line:#E1DDD1;
  --ink:#12283C; --dim:#5D6977; --faint:#8C96A1;
  --jua:#F6B41C; --jua-text:#8A5C00; --jua-soft:#FFF4D6;
  --private:#FFF8E6; --private-line:#F1DDA6;
  --green:#0D7F48; --green-soft:#E3F4EA; --red:#B8392A; --red-soft:#FBE7E3; --amber:#9A5B00; --amber-soft:#FFF0D2;
  --blue:#1F5C8F; --blue-soft:#E4EEF7;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --gut:max(16px, env(safe-area-inset-left, 0px));
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--jua);outline-offset:2px;border-radius:8px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;
  padding-block:12px;padding-left:var(--gut);padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;align-items:center;gap:12px;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-46px;width:120px;height:120px;border-radius:50%;background:var(--jua);opacity:.18;pointer-events:none}
.mark{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:8px}
.mark i{width:12px;height:12px;border-radius:50%;background:var(--jua);display:inline-block;box-shadow:0 0 0 4px rgba(246,180,28,.25)}
.top .sub{font-size:12px;color:#B8C4CF;margin-left:auto;text-align:right;line-height:1.2}
.iconbtn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;z-index:1}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.iconbtn svg{width:22px;height:22px}

main{flex:1;padding-block:14px 120px;padding-left:var(--gut);padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:26px;font-weight:800}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

.banner{background:var(--jua-soft);border:1px solid var(--private-line);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.banner b{color:var(--jua-text)}
.banner.warn{background:var(--red-soft);border-color:#F0C4BB}

/* Today hero */
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-30px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:var(--jua);opacity:.16}
.hero .eyebrow{color:#B8C4CF}
.hero .big{font-family:var(--num);font-weight:600;font-size:38px;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.hero .big small{font-size:16px;color:#B8C4CF;font-weight:500;margin-right:6px}
.hero .note{font-size:13px;color:#D6DEE6;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--num);font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--dim)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:#FBFAF6}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--dim);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill.draft{background:var(--sunk);color:var(--ink)}
.pill.paid{background:var(--blue-soft);color:var(--blue)}
.pill.onway{background:var(--jua-soft);color:var(--jua-text)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.cancel{background:var(--red-soft);color:var(--red)}
.pill.late{background:var(--red-soft);color:var(--red)}
.pill.soon{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--sunk);color:var(--dim)}
.pill.ex{background:var(--jua);color:var(--ink)}

/* Catalog grid */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:12px 0;flex:1;min-width:0;outline:none}
.search svg{width:18px;height:18px;color:var(--faint);flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--sunk);display:block;max-width:100%}
.card .b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .n{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .c{font-family:var(--num);font-weight:600;font-size:15px}
.card .meta{display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:12px;color:var(--dim);min-width:0}
.card .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* Buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:#fff}
.btn.sun{background:var(--jua);color:var(--ink)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.green{background:var(--green);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--dim)}
.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 12px;min-height:46px;outline:none}
.input:focus{border-color:var(--ink)}
.input.private{background:var(--private);border-color:var(--private-line)}
.input.money{font-family:var(--num);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-in{display:flex;gap:12px;align-items:center}
.photo-in img{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--sunk);border:1px solid var(--line)}
.photo-in label.btn{cursor:pointer}
.photo-in input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* Order editor */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stepper div{height:6px;border-radius:3px;background:var(--line)}
.stepper div.on{background:var(--ink)}
.stepper-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;color:var(--faint);margin-top:4px}
.stepper-l span.on{color:var(--ink);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:48px 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0;padding-top:0}
.line .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.line .nm button{background:none;border:0;color:var(--faint);padding:2px;min-width:32px;min-height:32px}
.line .nums{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin-top:6px;align-items:end}
.line .nums .input{min-height:40px;padding:8px 9px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;height:40px;overflow:hidden}
.qty button{border:0;background:var(--sunk);width:32px;height:100%;font-weight:700}
.qty span{min-width:30px;text-align:center;font-family:var(--num);font-weight:600}
.line .pf{font-size:12px;margin-top:5px;color:var(--dim)}
.line .pf b{font-family:var(--num)}
.mini{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}

.cockpit{background:var(--ink);color:#fff;border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 10px 30px rgba(18,40,60,.25)}
.cockpit div span{display:block;font-size:11px;color:#B8C4CF;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.cockpit div b{font-family:var(--num);font-size:17px;font-weight:600;letter-spacing:-.02em}
.cockpit .pr b{color:var(--jua);font-size:21px}
.cockpit .pr.neg b{color:#FF9C8C}
.sheet .cockpit{bottom:-18px;margin-top:4px}
.lock{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--blue-soft);color:var(--blue);padding:9px 12px;border-radius:11px}
.lock svg{width:16px;height:16px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;height:66px}
nav.tabs button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);height:100%}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button.tab[aria-current="page"] svg{color:var(--ink)}
.fab{width:58px;height:58px;border-radius:50%;background:var(--jua);border:4px solid var(--card);box-shadow:0 6px 18px rgba(18,40,60,.22);display:grid;place-items:center;margin:-26px auto 0;color:var(--ink)}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(18,40,60,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px var(--gut) 10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{flex:1}
.sheet .hd .iconbtn{color:var(--dim)}
.sheet .bd{overflow-y:auto;padding:14px var(--gut) 18px;display:flex;flex-direction:column;gap:12px}
.sheet .ft{padding:10px var(--gut) 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.confirm{background:var(--red-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.invoice-prev{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);max-width:100%}
.copybox{font-family:var(--num);font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;user-select:all;max-height:160px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sun-rule{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--jua) 0 30%,var(--line) 30%)}
@media (max-width:380px){.stats b{font-size:19px}.hero .big{font-size:32px}.cockpit b{font-size:15px}.cockpit .pr b{font-size:18px}}
</style>

    <div class="mark" aria-label="Winga"><i></i>Winga</div>

    </div>
  </nav>
</div>

/* ---------------- storage (IndexedDB, falls back to memory) ---------------- */
var Store=(function(){
  var db=null, mem={kv:{},img:{}}, ok=false;
  function open(){return new Promise(function(res){
    try{
      if(!("indexedDB" in window)){res(false);return;}
      var rq=indexedDB.open("winga",1);
      rq.onupgradeneeded=function(){var d=rq.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("img"))d.createObjectStore("img");};
      rq.onsuccess=function(){db=rq.result;ok=true;res(true);};
      rq.onerror=function(){res(false);};
      setTimeout(function(){res(ok);},2500);
    }catch(e){res(false);}
  });}
  function tx(store,mode,fn){return new Promise(function(res){
    if(!db){res(fn(null));return;}
    try{var t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);
      if(r&&"onsuccess" in r){r.onsuccess=function(){res(r.result);};r.onerror=function(){res(undefined);};}
      else{t.oncomplete=function(){res(r);};t.onerror=function(){res(undefined);};}
    }catch(e){res(undefined);}
  });}
  return {
    open:open, ok:function(){return ok;},
    get:function(st,k){if(!db)return Promise.resolve(mem[st][k]);return tx(st,"readonly",function(s){return s.get(k);});},
    put:function(st,k,v){if(!db){mem[st][k]=v;return Promise.resolve();}return tx(st,"readwrite",function(s){return s.put(v,k);});},
    del:function(st,k){if(!db){delete mem[st][k];return Promise.resolve();}return tx(st,"readwrite",function(s){return s.delete(k);});},
    clear:function(st){if(!db){mem[st]={};return Promise.resolve();}return tx(st,"readwrite",function(s){return s.clear();});},
    all:function(st){
      if(!db)return Promise.resolve(Object.assign({},mem[st]));
      return new Promise(function(res){
        try{var out={},c=db.transaction(st,"readonly").objectStore(st).openCursor();
          c.onsuccess=function(){var cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};
          c.onerror=function(){res(out);};
        }catch(e){res({});}
      });
    }
  };
})();

function dueChip(o){
  if(!o.deadline||o.status==="done"||o.status==="cancel")return "";
  var m=Math.round((o.deadline-Date.now())/6e4);
  if(m<0)return '<span class="pill late">'+esc(t("late"))+" "+esc(m>-60?t("inMin",{n:-m}):t("inHr",{n:Math.round(-m/60)}))+'</span>';
  if(m<60)return '<span class="pill soon">'+esc(t("inMin",{n:m}))+'</span>';
  return '<span class="pill ok">'+esc(t("due"))+" "+hhmm(o.deadline)+'</span>';
}
function stPill(s){return '<span class="pill '+s+'">'+esc(t("st_"+s))+'</span>';}
function orderRow(o){

    '<div class="row wrap" style="gap:6px;margin-top:6px">'+stPill(o.status)+dueChip(o)+'</div></div></button>';

/* ---------------- views ---------------- */
function vToday(){
  var done=S.orders.filter(function(o){return o.status==="done";});

  var p=doneToday.reduce(function(a,o){return a+totals(o).profit;},0);
  var coming=S.orders.filter(function(o){return o.status==="paid"||o.status==="onway";}).reduce(function(a,o){return a+totals(o).profit;},0);

  var stale=S.items.filter(function(i){return ageDays(i.date)>=3;}).length;
  var h='<div><div class="eyebrow">'+esc(t("hello"))+(S.settings.name?", "+esc(S.settings.name.replace(/\s*\(.*\)/,"")):"")+'</div></div>';
  h+='<section class="hero"><div class="eyebrow">'+esc(t("profitToday"))+'</div><div class="big num"><small>TSh</small>'+money(p)+'</div>'+
     (coming?'<div class="note">+ TSh <span class="num">'+money(coming)+'</span> '+esc(t("comingProfit"))+'</div>':'')+'</section>';

  var o={id:uid(),no:nextNo(),customer:"",phone:"",deadline:Date.now()+3*36e5,address:"",lines:[],nauli:0,status:"draft",created:Date.now(),note:""};

/* ---------------- invoice card ---------------- */
async function drawInvoice(o){
  var W=1080,P=64,lineH=150,T=totals(o),st=S.settings;
  var H=360+o.lines.length*lineH+(T.nauli?90:0)+420;
  var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
  try{await document.fonts.ready;}catch(e){}
  x.fillStyle="#F6F4EE";x.fillRect(0,0,W,H);
  // header
  x.fillStyle="#12283C";x.fillRect(0,0,W,250);
  x.fillStyle="rgba(246,180,28,.22)";x.beginPath();x.arc(W-60,40,170,0,7);x.fill();
  x.fillStyle="#F6B41C";x.beginPath();x.arc(P+12,P+26,12,0,7);x.fill();
  x.fillStyle="#fff";x.font="800 52px 'Bricolage Grotesque', sans-serif";x.fillText(st.name?st.name.replace(/\s*\(.*\)/,""):"Winga",P+40,P+44);
  x.fillStyle="#B8C4CF";x.font="500 28px 'IBM Plex Sans', sans-serif";x.fillText(t("invoiceTitle").toUpperCase()+"  #"+o.no,P,P+110);
  var dt=new Date();x.fillText(dt.toLocaleDateString("en-GB")+"  "+hhmm(dt),P,P+152);
  x.textAlign="right";x.fillStyle="#fff";x.font="600 30px 'IBM Plex Sans', sans-serif";x.fillText(t("inv_to")+": "+(o.customer||"—"),W-P,P+110);
  if(o.address){x.fillStyle="#B8C4CF";x.font="400 24px 'IBM Plex Sans', sans-serif";x.fillText(o.address.slice(0,42),W-P,P+152);}
  x.textAlign="left";
  // lines
  var y=300;
  for(var i=0;i<o.lines.length;i++){
    var l=o.lines[i];
    x.fillStyle="#FFFFFF";roundRect(x,P,y,W-2*P,lineH-20,22);x.fill();
    var im=IMG[l.img]?await loadImg(IMG[l.img]):null;
    if(im){x.save();roundRect(x,P+14,y+14,lineH-48,lineH-48,16);x.clip();var s=Math.max((lineH-48)/im.width,(lineH-48)/im.height);x.drawImage(im,P+14+((lineH-48)-im.width*s)/2,y+14+((lineH-48)-im.height*s)/2,im.width*s,im.height*s);x.restore();}
    else{x.fillStyle="#EFECE3";roundRect(x,P+14,y+14,lineH-48,lineH-48,16);x.fill();}
    x.fillStyle="#12283C";x.font="600 32px 'IBM Plex Sans', sans-serif";x.fillText(fit(x,l.name,560),P+lineH-10,y+56);
    x.fillStyle="#5D6977";x.font="500 26px 'IBM Plex Mono', monospace";x.fillText(l.qty+" × "+money(l.price),P+lineH-10,y+98);
    x.textAlign="right";x.fillStyle="#12283C";x.font="600 34px 'IBM Plex Mono', monospace";x.fillText(money(l.qty*l.price),W-P-24,y+78);x.textAlign="left";
    y+=lineH;
  }
  if(T.nauli){x.fillStyle="#5D6977";x.font="500 28px 'IBM Plex Sans', sans-serif";x.fillText(t("inv_delivery"),P+8,y+40);x.textAlign="right";x.font="600 30px 'IBM Plex Mono', monospace";x.fillStyle="#12283C";x.fillText(money(T.nauli),W-P-24,y+40);x.textAlign="left";y+=90;}
  // total
  x.fillStyle="#F6B41C";roundRect(x,P,y,W-2*P,130,24);x.fill();
  x.fillStyle="#12283C";x.font="600 28px 'IBM Plex Sans', sans-serif";x.fillText(t("inv_total"),P+30,y+76);
  x.textAlign="right";x.font="600 60px 'IBM Plex Mono', monospace";x.fillText("TSh "+money(T.total),W-P-30,y+86);x.textAlign="left";
  y+=170;
  // pay box
  x.strokeStyle="#12283C";x.lineWidth=4;roundRect(x,P,y,W-2*P,150,24);x.stroke();
  x.fillStyle="#5D6977";x.font="600 24px 'IBM Plex Sans', sans-serif";x.fillText(t("inv_pay")+(st.network?"  ·  "+st.network:""),P+30,y+48);
  x.fillStyle="#12283C";x.font="600 50px 'IBM Plex Mono', monospace";x.fillText(st.lipa||"—",P+30,y+110);
  x.textAlign="right";x.font="600 28px 'IBM Plex Sans', sans-serif";x.fillText(st.lipaName||"",W-P-30,y+108);x.textAlign="left";
  y+=190;
  x.fillStyle="#8C96A1";x.font="400 24px 'IBM Plex Sans', sans-serif";x.fillText(t("inv_valid")+(o.deadline?" · "+t("deadline").toLowerCase()+" "+hhmm(o.deadline):""),P,y);
  return c;
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function fit(x,s,w){if(x.measureText(s).width<=w)return s;while(s.length>3&&x.measureText(s+"…").width>w)s=s.slice(0,-1);return s+"…";}
function invoiceText(o){var T=totals(o),st=S.settings;
  return t("msgInvoice",{c:o.customer||"",no:o.no,w:(st.name||"Winga").replace(/\s*\(.*\)/,""),lines:o.lines.map(function(l){return "• "+l.name+" ("+l.qty+") "+money(l.qty*l.price);}).join("\n")+(T.nauli?"\n• "+t("inv_delivery")+" "+money(T.nauli):""),t:money(T.total),l:st.lipa||"—",ln:st.lipaName||""});}

}

  if(el.id==="itFile"&&el.files[0]){var d=await fileToData(el.files[0]);sheetState.imgData=d;var p=$("#itPrev");p.src=d;p.style.visibility="visible";}
  if(el.id==="pkgFile"&&el.files[0]){var o=order(sheetState.id);var k="img_"+uid();putImg(k,await fileToData(el.files[0],900));o.pkgImg=k;save();orderSheet(o.id);}
  if(el.id==="impFile"&&el.files[0])importBackup(el.files[0]);
  if(el.id==="oDue"&&sheetState&&sheetState.kind==="order"){var o2=order(sheetState.id);readOrderForm(o2);save();}
  if(sheetState&&sheetState.kind==="order"&&el.matches("input")){var o3=order(sheetState.id);readOrderForm(o3);save();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&sheetState){if(sheetState.kind==="order"){readOrderForm(order(sheetState.id));save();render();}closeSheet();}
  if(e.key==="Enter"&&e.target.matches("[role=button][data-act]")){e.target.click();}
});
document.addEventListener("focusin",function(e){if(e.target.matches(".money")&&!e.target.disabled&&e.target.value==="0")e.target.select();});

/* ---------------- boot ---------------- */
(async function boot(){
  await Store.open();
  var saved=await Store.get("kv","state");
  if(saved&&saved.settings){S=Object.assign(S,saved);S.settings=Object.assign({lang:"sw",comm:15,seq:0},saved.settings);IMG=await Store.all("img");}
  else loadExamples();
  render();
  setInterval(function(){if(!sheetState)render();},60000);
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
  checkShareInbox();
})();
})();
</script>

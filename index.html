<style>
/* Customer shop v2: image-first masonry, Temu-style categories, 4-tab bottom bar. */
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.shop{background:var(--navy);color:var(--on-navy);padding:12px var(--gr) 14px var(--gl);padding-top:calc(12px + env(safe-area-inset-top,0px));position:relative;overflow:hidden}
header.shop::after{content:"";position:absolute;right:-70px;top:-90px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(246,180,28,.30),rgba(246,180,28,0) 70%);pointer-events:none}
header.shop .bar{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
header.shop .mark{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
header.shop .mark .t{font-size:18px}
header.shop .tag{color:var(--on-navy-dim);font-size:12.5px;margin-top:6px;position:relative;z-index:1}
.sticky{position:sticky;top:0;z-index:15;background:var(--paper);padding:10px var(--gr) 6px var(--gl);display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:0 6px 0 14px;height:42px;transition:height .15s}
.sbox.big{height:48px}
.sbox svg{width:18px;height:18px;color:var(--dim);flex:none}
.sbox input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:15.5px;padding:0}
.sbox .clr{border:0;background:var(--sunk);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;color:var(--dim)}
.sbox .clr svg{width:14px;height:14px}
.chips .chip{padding:6px 12px;font-size:13px}
.subchips .chip{background:transparent;border-color:transparent;color:var(--dim);padding:4px 10px;font-size:12.5px}
.subchips .chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--sunk);color:var(--ink)}
main{padding:12px var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
/* masonry */
.mas{columns:2;column-gap:10px}
@media (min-width:620px){.mas{columns:3}}
.pc{break-inside:avoid;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block;width:100%;text-align:left;padding:0;color:inherit;position:relative}
.pc .im{display:block;width:100%;background:var(--sunk)}
.pc .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.pc .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .ds{font-weight:400;font-size:12px;color:var(--dim);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pr{display:flex;align-items:center;gap:6px;margin-top:2px}
.pc .pr b{font-family:var(--num);font-weight:600;font-size:15px}
.pc .pr .ask{font-size:12.5px;font-weight:600;color:var(--jua-text)}
.pc .pr .inc{color:var(--green);display:grid}
.pc .pr .inc svg{width:15px;height:15px}
.pc .ft{display:flex;align-items:center;gap:6px;margin-top:6px}
.pc .ft .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc .ft .sold{font-size:10.5px;color:var(--faint);white-space:nowrap}
.pc.sold .im{filter:grayscale(1) opacity(.55)}
.pc .sl{position:absolute;left:8px;top:8px;background:#12283C;color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);position:relative}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs .bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--num)}
/* categories tab */
.catv{display:grid;grid-template-columns:116px 1fr;min-height:calc(100vh - 200px);margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.rail{background:var(--sunk);display:flex;flex-direction:column}
.rail button{border:0;background:transparent;text-align:left;padding:15px 12px 15px 14px;font-size:13.5px;font-weight:500;color:var(--dim);border-left:3px solid transparent;line-height:1.25}
.rail button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;border-left-color:var(--jua)}
.subgrid{padding:14px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;align-content:start}
.subgrid h3{grid-column:1/-1;font-size:15px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.sc .c{width:66px;height:66px;border-radius:50%;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--dim)}
.sc .c img{width:100%;height:100%;object-fit:cover}
.sc .c svg{width:26px;height:26px}
/* product page */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--sunk);scrollbar-width:none;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;max-height:62vh;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.pp{font-family:var(--num);font-weight:600;font-size:24px}
.desc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;line-height:1.5}
.actbar{display:flex;gap:8px;align-items:center}
.actbar .btn{flex:1;border-radius:999px;min-height:48px}
.actbar .chatb{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;font-size:10.5px;font-weight:600;color:#128C4A;padding:0 4px}
.actbar .chatb .fi{width:36px;height:36px}
/* qty sheet */
.qs{display:flex;gap:12px;align-items:center}
.qs img{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--sunk);flex:none}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.sumrow b{font-family:var(--num);font-size:18px}
/* cart */
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.ci .n{font-weight:600;line-height:1.25;font-size:14px}
.ci .p{font-family:var(--num);font-size:13px;color:var(--dim);margin:2px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.total b{font-family:var(--num);font-size:19px}
.ph{display:flex;align-items:center;gap:10px;padding-top:4px}
.ph h1{flex:1;font-size:22px}
/* me */
.mehead{background:var(--navy);color:var(--on-navy);margin:-12px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:22px var(--gr) 22px var(--gl);display:flex;align-items:center;gap:14px;min-height:22vh}
.mehead .av{width:62px;height:62px;border-radius:50%;background:var(--jua);color:#12283C;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;box-shadow:0 0 0 3px var(--navy),0 0 0 5px #C98B4E;flex:none}
.mehead .nm{font-family:var(--display);font-weight:800;font-size:20px}
.mehead .wa{color:var(--on-navy-dim);font-family:var(--num);font-size:13px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mehead .hbtn{margin-left:auto;align-self:flex-start}
.chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-size:11px;padding:2px 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-size:12.5px;font-weight:500;position:relative}
.tl .fi{width:46px;height:46px}.tl .fi svg{width:21px;height:21px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink)}
.mrow .fi{width:34px;height:34px}.mrow .fi svg{width:17px;height:17px}
.mrow .chev{width:18px;height:18px;color:var(--faint);margin-left:auto}
.mrow .val{margin-left:auto;color:var(--dim);font-size:13px}
.mrow.red{color:var(--red)}
.oi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.oi .th{display:flex}
.oi .th img{width:38px;height:38px;border-radius:9px;object-fit:cover;border:2px solid var(--card);margin-left:-10px;background:var(--sunk)}
.oi .th img:first-child{margin-left:0}
.res{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.res button:first-child{border-top:0}
.paybox{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.paybox .pv{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.paybox .pn{font-family:var(--num);font-weight:600;font-size:16px}
.howlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.howlist li{display:flex;align-items:center;gap:12px;font-weight:500}
.howlist b{width:32px;height:32px;border-radius:50%;background:var(--jua);color:#12283C;display:grid;place-items:center;font-family:var(--num);flex:none}
.big-ok{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.big-ok .fi{width:64px;height:64px;background:var(--green-soft);color:var(--green)}
.big-ok .fi svg{width:30px;height:30px}
</style>
</head>

(function(){

var W=window.Winga,t=W.t,esc=W.esc,$=W.$;

var stack=[],CTX={},fuse=null;
var P='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
var IC={
 home:P+'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',

 cartPlus:P+'<path d="M3 4h2l2.2 11h10.6L20 8H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M13 9.5v4M11 11.5h4"/></svg>',
 me:P+'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
 search:P+'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 x:P+'<path d="M6 6l12 12M18 6L6 18"/></svg>',
 back:P+'<path d="M15 5l-7 7 7 7"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.1c-.24.68-1.42 1.3-1.96 1.35-.5.05-.98.24-3.3-.69-2.8-1.1-4.58-3.97-4.72-4.15-.14-.18-1.12-1.49-1.12-2.85s.71-2.02.97-2.3c.25-.27.55-.34.73-.34l.53.01c.17 0 .4-.06.62.48.24.56.8 1.94.87 2.08.07.14.12.3.02.48-.09.18-.14.3-.27.46l-.41.48c-.14.14-.28.29-.12.56.16.27.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.27.14.43.12.59-.07.16-.18.68-.8.86-1.07.18-.27.36-.23.61-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.07.11.07.66-.17 1.34z"/></svg>',

var CATICON={accessories:IC.globe,shoes:IC.box,kids:IC.me,fashion:IC.doc,electronics:IC.phone,other:IC.box};
var STEPS=["new","progress","invoiced","paid","done"];

/* ---------------- basket (on this phone) ---------------- */
var CART=load("winga.cart.v2",[]);
function load(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function cartItems(){return CART.map(function(c){return {c:c,p:byId(c.id)};}).filter(function(x){return x.p&&x.p.status==="active";});}
function cartCount(){return cartItems().reduce(function(s,x){return s+x.c.qty;},0);}
function inCart(id){return CART.find(function(c){return c.id===id;});}
function sum(items){var s=0;items.forEach(function(x){if(x.p.price!=null)s+=x.p.price*x.c.qty;});return s;}
function byId(id){return S.products.find(function(p){return p.id===id;});}
var MYORDERS=load("niagize.myorders",[]);

/* ---------------- shared bits ---------------- */
function stars(n){n=n||2;var s="";for(var i=1;i<=3;i++)s+=i<=n?"★":"<i>★</i>";return '<span class="stars" title="'+esc(t("rate_"+n))+'" aria-label="'+esc(t("rate_"+n))+'">'+s+'</span>';}
function priceHtml(p){return p.price!=null?'<b>TSh '+W.money(p.price)+'</b>':'<span class="ask">'+esc(t("askPrice"))+'</span>';}
function hbtns(){return '<button class="hbtn" data-act="shareShop" aria-label="'+esc(t("share"))+'">'+IC.share+'</button><button class="hbtn" data-act="lang" aria-label="'+esc(t("lang"))+'">'+(W.lang==="sw"?"SW":"EN")+'</button><button class="hbtn" data-act="theme" aria-label="'+esc(t("theme"))+'">'+(W.isDark()?IC.sun:IC.moon)+'</button><button class="hbtn" data-act="how" aria-label="'+esc(t("how_title"))+'">'+IC.bulb+'</button>';}
function card(p){
  var sold=p.status==="soldout",ic=inCart(p.id);
  return '<div class="pc'+(sold?" sold":"")+'"><button class="pcopen" data-act="open" data-id="'+p.id+'" style="all:unset;display:block;width:100%;cursor:pointer">'+
   '<img class="im" src="'+esc(p.thumbUrl)+'" alt="'+esc(p.name)+'" loading="lazy">'+(sold?'<span class="sl">'+esc(t("soldout"))+'</span>':'')+
   '<div class="bd"><div class="nm">'+esc(p.name)+'</div>'+(p.description?'<div class="ds">'+esc(p.description)+'</div>':'')+

function filtered(){
  var list=S.products;
  if(S.cat!=="all")list=list.filter(function(p){return p.category===S.cat&&(!S.sub||p.subcategory===S.sub);});
  var q=S.q.trim();
  if(q&&fuse){var ids={};fuse.search(q).forEach(function(r){ids[r.item.id]=r.score;});list=list.filter(function(p){return p.id in ids;}).sort(function(a,b){return ids[a.id]-ids[b.id];});}
  else if(q){var ql=q.toLowerCase();list=list.filter(function(p){return [p.name,p.description,W.catLabel(p.category),(p.tags||[]).join(" ")].join(" ").toLowerCase().indexOf(ql)>=0;});}
  return list.slice().sort(function(a,b){return (a.status==="soldout")-(b.status==="soldout");});

  var h="";

  var list=filtered();

  if(!list.length)return h+'<div class="empty">'+esc(t("noMatch"))+'</div>';

  return hd(t("set_title"))+'<div class="bd">'+
   '<div class="eyebrow">'+esc(t("set_contacts"))+'</div>'+
   '<label class="ifield">'+IC.wa.replace('<svg','<svg style="color:#128C4A"')+'<input id="s_wa" type="tel" value="'+esc(m.whatsapp?"+"+m.whatsapp:"")+'" placeholder="'+esc(t("f_wa"))+'"></label>'+
   '<label class="ifield">'+IC.doc+'<input id="s_email" type="email" value="'+esc(m.email||"")+'" placeholder="'+esc(t("f_email"))+'"></label>'+

   '<button class="mrow" data-act="lang"><span class="fi">'+IC.globe+'</span><span class="tt">'+esc(t("lang"))+'</span><span class="val">'+(W.lang==="sw"?"Kiswahili":"English")+'</span></button>'+

   '<button class="mrow" data-act="terms"><span class="fi">'+IC.doc+'</span><span class="tt">'+esc(t("set_terms"))+'</span>'+IC.chev.replace('<svg','<svg class="chev"')+'</button>'+

 },
 text:function(c){return hd(c.title)+'<div class="bd"><div class="desc">'+esc(c.body)+'</div></div>';},
 confirm:function(c){return '<div class="hd"><h2>'+esc(c.title)+'</h2><button class="iconbtn" data-act="back" aria-label="'+esc(t("back"))+'">'+IC.x+'</button></div><div class="bd"><p class="muted" style="margin:0">'+esc(c.body)+'</p><button class="btn block" data-act="'+c.act+'" style="background:var(--red);color:#fff;border-radius:999px">'+IC.trash+esc(c.yes)+'</button></div>';},
 history:function(c){
  var list=c.list;
  return hd(t("me_orders"))+'<div class="bd">'+(!list?'<div style="display:grid;place-items:center;padding:40px">'+W.SUN+'</div>':!list.length?'<div class="empty">'+esc(t("no_orders"))+'</div>':list.map(function(o){
    return '<div class="stack" style="gap:6px"><button class="oi" data-act="openOrder" data-code="'+esc(o.code)+'"><span class="th">'+o.items.slice(0,3).map(function(i){return '<img src="'+esc(W.img(i.thumb))+'" alt="">';}).join("")+'</span><span class="grow"><b class="num">'+esc(o.code)+'</b><br><span class="small muted">'+esc(W.when(o.created_at))+' · '+o.items_count+'</span></span><span class="ost '+o.status+'">'+esc(t("st_"+o.status))+'</span></button>'+
     '<button class="btn sm ghost" data-act="reorder" data-code="'+esc(o.code)+'" style="align-self:flex-end;border-radius:999px">'+esc(t("reorder"))+'</button></div>';}).join(""))+'</div>';
 },
 addrs:function(){
  return hd(t("addr_title"))+'<div class="bd">'+(S.addrs.length?S.addrs.map(function(a){return '<div class="mrow"><span class="fi">'+IC.pin+'</span><span class="grow"><span class="tt">'+esc(a.label||t("me_addr"))+'</span><br><span class="small muted">'+esc(a.line)+(a.landmark?' · '+esc(a.landmark):'')+'</span></span><button class="fi sm" data-act="addrEdit" data-id="'+a.id+'" aria-label="'+esc(t("edit"))+'">'+IC.pen+'</button><button class="fi sm" data-act="addrDel" data-id="'+a.id+'" aria-label="'+esc(t("del"))+'" style="color:var(--red)">'+IC.trash+'</button></div>';}).join(""):'<div class="empty">'+esc(t("addr_none"))+'</div>')+
   '</div><div class="ft"><button class="btn primary block" data-act="addrNew" style="border-radius:999px">'+IC.plus+esc(t("addr_add"))+'</button></div>';
 },
 addrForm:function(c){
  var a=c.a;
  return hd(a.id?t("edit"):t("addr_add"))+'<div class="bd">'+
   '<label class="sbox">'+IC.search+'<input id="ad_q" placeholder="'+esc(t("addr_search"))+'" autocomplete="off" value="'+esc(c.q||"")+'"></label>'+
   (c.results?(c.results.length?'<div class="res">'+c.results.map(function(r,i){return '<button data-act="addrPick" data-i="'+i+'">'+esc(r.display_name)+'</button>';}).join("")+'</div>':'<div class="hint">'+esc(t("addr_nores"))+'</div>'):'')+
   '<div class="eyebrow">'+esc(t("addr_manual"))+'</div>'+
   '<label class="ifield"><span class="pre">#</span><input id="ad_label" placeholder="'+esc(t("addr_label"))+'" value="'+esc(a.label||"")+'"></label>'+
   '<label class="ifield" style="align-items:flex-start"><span style="padding-top:14px">'+IC.pin+'</span><textarea id="ad_line" placeholder="'+esc(t("addr_line"))+'">'+esc(a.line||"")+'</textarea></label>'+
   '<label class="ifield">'+IC.info+'<input id="ad_land" placeholder="'+esc(t("addr_landmark"))+'" value="'+esc(a.landmark||"")+'"></label>'+
   (a.lat?'<div class="hint">📍 '+(+a.lat).toFixed(5)+', '+(+a.lng).toFixed(5)+'</div>':'')+
   '<label class="check" style="align-items:flex-start"><input type="checkbox" id="ad_terms"'+(a.accepted_terms?" checked":"")+'><span>'+esc(t("addr_terms"))+'</span></label>'+
   '</div><div class="ft"><button class="btn primary block" data-act="addrSave" style="border-radius:999px">'+esc(t("save"))+'</button></div>';
 }
};

/* ---------------- actions ---------------- */
function readAddr(){var c=top().c,a=c.a;var l=$("#ad_label");if(!l)return;a.label=l.value;a.line=$("#ad_line").value;a.landmark=$("#ad_land").value;a.accepted_terms=$("#ad_terms").checked;c.q=$("#ad_q").value;}
function addToCart(id,q){var c=inCart(id);if(c)c.qty=Math.min(99,c.qty+q);else CART.push({id:id,qty:q});save("winga.cart.v2",CART);W.db.log("cart",id);}
async function placeOrder(items){
  var w=null;try{w=window.open("","_blank");}catch(e){}   // open now (inside the tap) so iPhone doesn't block it
  try{
    var addr=S.me&&S.addrs.length?S.addrId:null;
    var r=await W.db.createOrder(items,S.delivery,addr,null,null);
    var link=W.adminUrl()+"#o-"+r.code;
    var msg=t("wa_hello")+"\n"+t("wa_items",{code:r.code,n:r.count})+"\n"+link;
    var url=W.wa(S.shop.whatsapp,msg);
    if(w)w.location.href=url;
    MYORDERS.unshift(r.code);MYORDERS=MYORDERS.slice(0,30);save("niagize.myorders",MYORDERS);
    S.products.forEach(function(p){var it=items.find(function(i){return i.id===p.id;});if(it)p.ordered=(p.ordered||0)+it.qty;});
    stack=[];var ctx={fresh:true,waUrl:url,loading:true};open("order",ctx);
    try{history.replaceState(null,"","#o-"+r.code);}catch(e){}
    ctx.o=await W.db.getOrder(r.code);ctx.loading=false;draw(false);
    return true;
  }catch(e){if(w)try{w.close();}catch(_){}console.error(e);W.toast(t("error"));return false;}
}
async function openOrder(code){var ctx={loading:true};open("order",ctx);try{history.replaceState(null,"","#o-"+code);}catch(e){}try{ctx.o=await W.db.getOrder(code);}catch(e){ctx.o=null;}ctx.loading=false;draw(false);}
async function refreshMe(){S.me=await W.db.profile();S.addrs=S.me?await W.db.addresses():[];if(S.addrs.length&&!S.addrs.some(function(a){return a.id===S.addrId;}))S.addrId=S.addrs[0].id;}
var searchT=null;
async function geocode(q){
  var u="https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=tz&accept-language="+(W.lang==="sw"?"sw,en":"en")+"&viewbox=39.0,-6.6,39.5,-7.0&q="+encodeURIComponent(q);
  try{var r=await fetch(u,{headers:{"Accept":"application/json"}});return await r.json();}catch(e){return [];}
}
document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-act],[data-tab]");if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;closeAll();scrollTo(0,0);if(S.tab==="me"||S.tab==="cart"){try{await refreshMe();}catch(_){}}render();return;}
  var a=el.dataset.act,id=el.dataset.id,cur=top();
  if(a==="scrim"){if(e.target===el&&cur&&POP[cur.n])back();return;}
  if(a==="pcopen")return;
  try{switch(a){
    case "back":if(cur&&cur.n==="addrForm")readAddr();back();break;
    case "open":open("product",{id:id});try{history.replaceState(null,"","#p-"+id);}catch(_){}W.db.log("view",id);break;
    case "chat":var p=byId(id);W.db.log("chat",id);window.open(W.wa(S.shop.whatsapp,t("wa_ask")+"\n*"+p.name+"*"+(p.price!=null?" · TSh "+W.money(p.price):"")+"\n"+W.shopUrl()+"#p-"+p.id),"_blank","noopener");break;
    case "qty":open("qty",{id:id,q:1,mode:el.dataset.mode});break;
    case "qq":cur.c.q=Math.max(1,Math.min(99,(cur.c.q||1)+(+el.dataset.d)));draw(false);break;
    case "addQ":addToCart(cur.c.id,cur.c.q);W.toast(t("cart_added"));stack.pop();draw(false);render();break;
    case "buyQ":var it=[{id:cur.c.id,qty:cur.c.q}];stack.pop();open("checkout",{items:it});break;
    case "sendNow":el.disabled=true;await placeOrder(cur.c.items);break;
    case "send":el.disabled=true;var items=cartItems().map(function(x){return {id:x.p.id,qty:x.c.qty};});if(await placeOrder(items)){CART=[];save("winga.cart.v2",CART);renderTabs();}else el.disabled=false;break;
    case "cq":var c=inCart(id);c.qty=Math.max(1,Math.min(99,c.qty+(+el.dataset.d)));save("winga.cart.v2",CART);render();break;
    case "rmCart":CART=CART.filter(function(x){return x.id!==id;});save("winga.cart.v2",CART);render();break;
    case "clearCart":CART=[];save("winga.cart.v2",CART);render();break;
    case "cat":S.cat=el.dataset.cat;S.sub="";render();break;
    case "sub":S.sub=el.dataset.sub;render();break;
    case "rail":S.railCat=el.dataset.cat;render();break;
    case "goSub":S.cat=el.dataset.cat;S.sub=el.dataset.sub;S.tab="home";render();scrollTo(0,0);break;
    case "clearQ":S.q="";S.searching=false;render();break;
    case "shareShop":var u=W.shopUrl();if(navigator.share)navigator.share({title:S.shop.name||"Niagize Kariakoo",text:t("wa_one"),url:u}).catch(function(){});else W.copy(u);break;
    case "lang":W.setLang(W.lang==="sw"?"en":"sw");render();draw(false);break;
    case "theme":W.toggleTheme();render();draw(false);break;
    case "how":open("how");break;
    case "signin":stack=stack.filter(function(s){return s.n!=="auth";});open("auth",{mode:"signin"});break;
    case "signup":stack=stack.filter(function(s){return s.n!=="auth";});open("auth",{mode:"signup"});break;
    case "settings":open("settings");break;
    case "about":open("text",{title:t("set_about"),body:t("about_body")});break;
    case "terms":open("text",{title:t("set_terms"),body:t("terms_body")});break;
    case "signout":await W.db.signOut();S.me=null;S.addrs=[];closeAll();break;
    case "delAcc":open("confirm",{title:t("del_acc"),body:t("del_acc_s"),yes:t("yesDelAcc"),act:"delAccYes"});break;
    case "delAccYes":await W.db.account("delete");await W.db.signOut();S.me=null;S.addrs=[];closeAll();break;
    case "saveContacts":await W.db.account("contacts",{whatsapp:$("#s_wa").value,email:$("#s_email").value});await refreshMe();W.toast(t("saved"));draw(false);break;
    case "history":var hctx={list:null};open("history",hctx);
      try{var mine=await W.db.myOrders();if(!S.me){mine=[];for(var i=0;i<MYORDERS.length;i++){var g=await W.db.getOrder(MYORDERS[i]);if(g)mine.push(g);}}hctx.list=mine;}catch(_){hctx.list=[];}draw(false);break;
    case "openOrder":openOrder(el.dataset.code);break;
    case "reorder":var hl=cur.c.list.find(function(o){return o.code===el.dataset.code;});hl.items.forEach(function(i){if(i.product_id&&byId(i.product_id))addToCart(i.product_id,i.qty);});closeAll();S.tab="cart";render();break;
    case "copyTxt":W.copy(el.dataset.v);break;
    case "addrs":open("addrs");break;
    case "addrNew":open("addrForm",{a:{accepted_terms:false}});break;
    case "addrEdit":open("addrForm",{a:JSON.parse(JSON.stringify(S.addrs.find(function(x){return x.id===id;})))});break;
    case "addrDel":await W.db.deleteAddress(id);await refreshMe();draw(false);break;
    case "addrPick":readAddr();var r=cur.c.results[+el.dataset.i];cur.c.a.line=r.display_name;cur.c.a.lat=+r.lat;cur.c.a.lng=+r.lon;cur.c.results=null;draw(false);break;
    case "addrSave":readAddr();var ad=cur.c.a;
      if(!ad.line||!ad.line.trim()){W.toast(t("addr_line"));break;}
      if(!ad.accepted_terms){W.toast(t("addr_need_terms"));break;}
      var savedA=await W.db.saveAddress(ad);await refreshMe();S.addrId=savedA.id;W.toast(t("saved"));back();render();break;
  }}catch(err){console.error(err);W.toast(t("error"));}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.act==="dl"){S.delivery=el.value;if(stack.length)draw(false);else render();}
  if(el.dataset.act==="ad"){S.addrId=el.value;if(stack.length)draw(false);else render();}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){S.q=e.target.value;S.searching=true;S.focusQ=true;render();}
  if(e.target.id==="ad_q"){var v=e.target.value;clearTimeout(searchT);if(v.trim().length<3)return;searchT=setTimeout(async function(){readAddr();var c=top().c;c.results=await geocode(v);draw(false);var i=$("#ad_q");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},650);}
});
document.addEventListener("focusin",function(e){if(e.target.id==="q"&&!S.searching){S.searching=true;var b=e.target.closest(".sbox");if(b)b.classList.add("big");}});
document.addEventListener("focusout",function(e){if(e.target.id==="q"&&!S.q){S.searching=false;var b=e.target.closest(".sbox");if(b)b.classList.remove("big");}});
document.addEventListener("submit",async function(e){
  if(e.target.dataset.form!=="auth")return;e.preventDefault();
  var c=top().c,up=c.mode==="signup",err=$("#a_err"),v=function(id){var x=$(id);return x?x.value.trim():"";};
  c.f={name:v("#a_name"),user:v("#a_user").toLowerCase(),wa:v("#a_wa"),email:v("#a_email")};
  var pin=$("#a_pin").value;
  function fail(k,vars){err.textContent=t(k,vars);}
  if(up){
    if(c.f.name.length<2)return fail("err_name");
    if(!/^[a-z0-9_.]{3,20}$/.test(c.f.user))return fail("err_user");
    if(W.waPhone(c.f.wa).length<12)return fail("err_wa");
    if(!/^\d{6}$/.test(pin))return fail("err_pin");
    if(pin!==$("#a_pin2").value)return fail("err_pin2");
    if(!$("#a_terms").checked)return fail("addr_need_terms");
  }else if(!/^\d{6}$/.test(pin))return fail("err_pin");
  var btn=e.target.querySelector("[type=submit]");btn.disabled=true;
  try{
    if(up)await W.db.account("signup",{username:c.f.user,pin:pin,full_name:c.f.name,whatsapp:c.f.wa,email:c.f.email});
    else await W.db.account("login",{login:c.f.user,pin:pin});
    await refreshMe();closeAll();S.tab="me";render();
  }catch(x){btn.disabled=false;var m=x.message;
    if(m==="taken")fail("err_taken");else if(m==="locked")fail("err_locked");else if(m==="wrong")fail("err_wrong",{n:(x.info&&x.info.left!=null)?x.info.left:"…"});else fail("error");}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&stack.length)back();});

/* ---------------- boot ---------------- */
async function fetchAll(){
  try{S.shop=await W.db.getShop()||{};}catch(e){S.shop={};}
  S.products=await W.db.listProducts(false);
  S.loaded=true;
  fuse=window.Fuse?new Fuse(S.products.map(function(p){return Object.assign({catLabel:W.catLabel(p.category)+" "+(p.subcategory?W.catLabel(p.category,p.subcategory):""),tagStr:(p.tags||[]).join(" ")},p);}),{keys:["name","description","catLabel","tagStr"],threshold:.38,ignoreLocation:true}):null;
  render();
}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,fetchAll);
async function boot(){
  render();
  try{await fetchAll();}catch(e){console.error(e);W.errorScreen(boot);return;}
  try{await refreshMe();}catch(e){}
  W.db.log("visit");
  var m=location.hash.match(/^#p-(.+)$/),o=location.hash.match(/^#o-(.+)$/);
  if(m&&byId(m[1])){open("product",{id:m[1]});W.db.log("view",m[1]);}
  else if(o)openOrder(o[1]);
  else{var seen=W.ls("winga.how")==="1";if(!seen&&S.products.length){open("how");W.ls("winga.how","1");}}
}
boot();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
</script>

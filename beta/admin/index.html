<style>
/* Boss side v2: Shopify-style dashboard, orders, products. Framed icons, back arrows, quiet colour. */
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:10px var(--gr) 10px var(--gl);padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;overflow:hidden}
header.top .mark{margin-right:auto}
header.top .sunload{width:26px;height:26px}
.upn{font-family:var(--num);font-size:12px;color:var(--jua);font-weight:600;margin-left:-2px;margin-right:4px;position:relative;z-index:1}
main{padding:0 var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:center;gap:8px;margin-top:4px}
.sec-h h2{font-size:16px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
/* dashboard */
.period{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.period button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--dim)}
.period button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-xs)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.addrrow .tt{font-weight:600}.addrrow .ss{font-size:13px;color:var(--dim)}.addrrow .chev{width:18px;height:18px}
.freechip{flex:none;align-self:center}.lockic{display:grid;place-items:center;width:28px;height:28px;color:var(--dim)}.lockic svg{width:16px;height:16px}
.poitem{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.poitem img{width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:var(--sunk);cursor:zoom-in}
.podesc{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}.podesc div{font-weight:600;white-space:pre-wrap}
.vipcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink);cursor:pointer}
.vipcard .fi{background:var(--sunk);font-size:20px}.vipcard .grow{flex:1;min-width:0}.vipcard>svg{width:18px;height:18px;flex:none;opacity:.6}.vipcard b{font-size:15px}
.vipsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vipsum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.vipsum b{font-size:20px}.vipsum span{font-size:11.5px;color:var(--dim)}
.viprow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.viprow .rk{width:30px;text-align:center;font-weight:800;font-size:15px;flex:none}.viprow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstars{display:inline-flex;gap:2px;line-height:1}.vstars i{display:inline-flex;color:var(--line)}.vstars i svg{width:12px;height:12px}.vstars i.on{color:var(--jua)}
.gjeye{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.gjeye svg{width:18px;height:18px}
.kpi.profit .l{display:flex;align-items:center;gap:6px;width:100%}.gjdots{letter-spacing:.12em}
.kpi.profit{grid-column:1/-1}
.icopick{border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}.icopick img{width:20px;height:20px}
.icopick.big{width:44px;height:44px;flex:none}.icopick.big img{width:28px;height:28px}.icopick.on{outline:2px solid var(--jua);outline-offset:2px;border-radius:50%}
.icogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--sunk);border-radius:14px;padding:10px}
.icogrid button{aspect-ratio:1;border:0;border-radius:12px;background:var(--card);display:grid;place-items:center;cursor:pointer}
.icogrid button img{width:70%;height:70%}.icogrid button[aria-pressed="true"]{outline:2px solid var(--jua);background:var(--sunk)}
.fi.c3dw{background:var(--sunk)}.fi.c3dw img{width:26px;height:26px}
.btn.locked{opacity:.55}
#t_total{font-size:18px}#t_total::placeholder{font-size:14px}
.ifield.private{background:var(--sunk);border-color:transparent}.ifield .lock{font-size:13px;opacity:.7;padding-right:4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink)}
.kpi .l{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.kpi .l .fi{width:26px;height:26px}.kpi .l .fi svg{width:14px;height:14px}
.kpi .v{font-family:var(--num);font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi .s b{color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--bar);min-height:3px}

:root[data-theme="dark"] .bars .b i.today{background:var(--jua)}
.bars .b i.today{background:var(--jua)}
.bars .b span{font-size:11px;color:var(--faint);font-family:var(--num)}
.bars .b em{font-style:normal;font-size:11px;font-family:var(--num);color:var(--dim)}
.funnel{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.fr .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fr .tr i{display:block;height:100%;background:var(--jua);border-radius:5px}
.fr b{font-family:var(--num);text-align:right;font-weight:600}
.tops .t{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tops .t:first-child{border-top:0}
.tops img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 4px}
.qt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font-size:12px;font-weight:500;position:relative;text-align:center}
.qt .fi{width:48px;height:48px}.qt .fi svg{width:22px;height:22px}
.preview{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.preview .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.preview .pg img,.preview .pg span{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;background:var(--sunk);display:block}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none}
/* orders */
.oc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink)}
.oc .th{display:flex;flex:none;width:68px;position:relative}
.oc .th .pocam{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--jua);color:var(--on-jua);display:grid;place-items:center;font-style:normal}.oc .th .pocam svg{width:12px;height:12px}
.newtag{display:inline-block;font-size:11px;font-weight:700;background:transparent;color:var(--cyan-text);box-shadow:inset 0 0 0 1.5px var(--cyan);border-radius:6px;padding:1px 6px;vertical-align:2px}
.oc .th img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:2px solid var(--card);margin-left:-12px;background:var(--sunk)}
.oc .th img:first-child{margin-left:0}
.oc .c{font-family:var(--num);font-weight:600}
.oc .m{font-size:12.5px;color:var(--dim)}
.oc .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.oc .r b{font-family:var(--num);font-size:13.5px}
.oc.new{border-color:var(--blue)}
.operiod{align-self:flex-start}
.phonerow{display:flex;gap:8px;align-items:center;min-width:0}
.phonerow .ifield{flex:1 1 auto;min-width:0}
.phonerow .fi{width:48px;height:48px;flex:none}
.slot.full .crp{position:absolute;left:6px;bottom:6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--photo-ink);color:var(--on-navy);display:grid;place-items:center;padding:0}
.slot.full .crp svg{width:15px;height:15px}
.cropv{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px;flex:1;min-height:0}
.cframe{position:relative;width:min(78vw,420px);aspect-ratio:1/1;overflow:hidden;border-radius:12px;background:var(--navy);touch-action:none;cursor:grab;flex:none}
.cframe img{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none}
.cframe::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--grid-line),var(--grid-line)) 33.33% 0/1px 100% no-repeat,linear-gradient(var(--grid-line),var(--grid-line)) 66.66% 0/1px 100% no-repeat,linear-gradient(var(--grid-line),var(--grid-line)) 0 33.33%/100% 1px no-repeat,linear-gradient(var(--grid-line),var(--grid-line)) 0 66.66%/100% 1px no-repeat}
.ctools{display:flex;flex-direction:column;gap:10px}
.ctools button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.ctools button svg{width:18px;height:18px}
.ctools .ok{background:var(--jua);border-color:var(--jua);color:var(--on-jua)}
.oc .tm{font-size:12px;color:var(--faint);font-family:var(--num)}
.oc .claim{font-size:11px;font-weight:600;color:var(--green);display:block;margin-top:2px}
.chip .cnt{font-family:var(--num);font-size:11.5px;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-left:2px}
.chip[aria-pressed="true"] .cnt{background:var(--tint-dark)}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:var(--ink);text-align:left;width:100%}
.ocard .top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
.ocard .top .fi{width:26px;height:26px}.ocard .top .fi svg{width:14px;height:14px}
.ocard .mid{display:flex;align-items:center;gap:14px}
.ocard .big{font-family:var(--num);font-size:34px;font-weight:600;letter-spacing:-.03em;min-width:64px;text-align:center}
.ocard .rows{display:flex;flex-direction:column;gap:4px;flex:1;border-left:1px solid var(--line);padding-left:14px}
.ocard .rw{display:flex;align-items:center;gap:8px;font-size:13.5px}
.ocard .rw b{font-family:var(--num);min-width:22px;text-align:right}
.ocard .rw i{width:8px;height:8px;border-radius:50%;flex:none}
.stockpill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 6px;font-size:12.5px;color:var(--dim)}
.stockpill b{font-family:var(--num);color:var(--ink)}
.stockpill .fi{width:22px;height:22px}.stockpill .fi svg{width:12px;height:12px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 31%;max-width:150px;border:0;padding:0;background:none;scroll-snap-align:start;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.strip img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.strip .nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .pr{font-size:11.5px;color:var(--dim);font-family:var(--num)}
.cust .av.tap{border:1.5px dashed var(--jua);cursor:pointer;color:var(--jua-text)}
.claimbox{display:flex;flex-direction:column;gap:4px;background:var(--green-soft);border-radius:12px;padding:10px 12px}
.claimbox .rw{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.claimbox .rw b{font-family:var(--num)}
.ratebox{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13.5px}
.ratebox .st{color:var(--jua);letter-spacing:2px}
.ci{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.ci .n{font-weight:600;font-size:14px;line-height:1.25}
.ci .p{font-family:var(--num);font-size:12.5px;color:var(--dim)}
.ci b{font-family:var(--num);font-size:13.5px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.total b{font-family:var(--num);font-size:19px}
.cust{display:flex;align-items:center;gap:10px}
.cust .av{width:42px;height:42px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.nextbar{display:flex;gap:8px}
.nextbar .btn{flex:1;border-radius:999px;min-height:50px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
/* products */
.ph{display:flex;align-items:center;gap:10px;padding-top:14px}
.ph h1{font-size:22px;flex:1}
.tools{display:flex;align-items:center;gap:8px}
.tools .chips{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;color:var(--ink)}
.pcard .popen{all:unset;display:block;cursor:pointer;position:relative}
.pcard .pacts{display:flex;justify-content:flex-end;gap:8px;padding:0 10px 10px}
.pcard .pr.noprice{color:var(--red);font-family:var(--body);font-size:12.5px}
.pcard img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--sunk);display:block}
.pcard .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pcard .pr{font-family:var(--num);font-weight:600;font-size:13.5px}
.pcard .meta{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:11px;color:var(--faint)}
.pcard .tag{position:absolute;left:8px;top:8px}
.pcard.dim img{opacity:.55}
.pill svg{width:13px;height:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);border-top:1px solid var(--nav-raise);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:66px}
nav.tabs button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--on-navy-dim);height:100%;justify-content:center;position:relative}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--cyan);font-weight:600}
nav.tabs .bdg{position:absolute;top:8px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--jua);color:var(--on-jua);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--num)}
.fab{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-28px;cursor:pointer}
.fab span.c{width:58px;height:58px;border-radius:50%;background:var(--jua);border:4px solid var(--navy);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--on-jua)}
.fab span.c svg{width:25px;height:25px}
.fab span.l{font-size:11.5px;font-weight:600;color:var(--on-navy)}
.fileHidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--sunk);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--dim);cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.full{border-style:solid}
.slot.off{opacity:.45;cursor:default}
.slot .rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:var(--photo-ink);color:var(--on-navy);display:grid;place-items:center}
.slot .rm svg{width:15px;height:15px}
.slot>svg{width:26px;height:26px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.subpick .chip{padding:5px 11px;font-size:12.5px;background:transparent}
.subpick .chip[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.ratepick{display:flex;gap:8px}
.ratepick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
.ratepick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.ft2{display:flex;gap:8px}
.ft2 .btn{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--dim)}
.ibtn svg{width:19px;height:19px}
.ibtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .ibtn[aria-pressed="true"]{background:var(--jua);border-color:var(--jua);color:var(--on-jua)}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.prof .ring{width:96px;height:96px;border-radius:50%;padding:4px;background:var(--jua)}
.prof .ring span{width:100%;height:100%;border-radius:50%;background:var(--navy);color:var(--jua);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;border:3px solid var(--paper)}
.prof .nm{font-family:var(--display);font-weight:800;font-size:20px;text-align:center}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink)}
.mrow .fi{width:34px;height:34px}.mrow .fi svg{width:17px;height:17px}
.mrow .chev{width:18px;height:18px;color:var(--faint);margin-left:auto}

var CR=null;
function cropSrc(i){
  if(A)return {src:purl(A.photos[i])};
  var x=E.items[i];if(x.f)return {src:purl(x.f)};var u=E.p.imageUrls[x.k]||E.p.thumbUrls[x.k];return {src:/^https?:/.test(u)?u+(u.indexOf("?")<0?"?":"&")+"crop=1":u};

function startCrop(i){var s=cropSrc(i);CR={i:i,src:s.src,z:1,x:0,y:0,base:1};open("crop");setTimeout(initCrop,30);}
function initCrop(){
  var fr=$("#cframe"),im=$("#cimg");if(!fr||!im)return;
  function fit(){var F=fr.clientWidth;CR.F=F;CR.base=Math.max(F/im.naturalWidth,F/im.naturalHeight);CR.z=1;CR.x=(F-im.naturalWidth*CR.base)/2;CR.y=(F-im.naturalHeight*CR.base)/2;paint();}
  if(im.complete&&im.naturalWidth)fit();else im.onload=fit;
  var pts={},start=null;
  fr.addEventListener("pointerdown",function(e){fr.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};start=snap();});
  fr.addEventListener("pointermove",function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};var ids=Object.keys(pts);
    if(ids.length===1){CR.x=start.cx+(e.clientX-start.p[0].x);CR.y=start.cy+(e.clientY-start.p[0].y);}
    else if(ids.length>=2&&start.p.length>=2){var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),d0=Math.hypot(start.p[0].x-start.p[1].x,start.p[0].y-start.p[1].y)||1;zoomTo(start.z*d/d0,start);}
    paint();});
  function end(e){delete pts[e.pointerId];start=snap();}
  fr.addEventListener("pointerup",end);fr.addEventListener("pointercancel",end);
  fr.addEventListener("wheel",function(e){e.preventDefault();zoomTo(CR.z*(e.deltaY<0?1.1:0.9),snap());paint();},{passive:false});
  function snap(){return {cx:CR.x,cy:CR.y,z:CR.z,p:Object.keys(pts).map(function(k){return pts[k];})};}
}
function zoomTo(z,st){var F=CR.F,nz=Math.max(1,Math.min(4,z)),k=nz/st.z;CR.x=F/2-(F/2-st.cx)*k;CR.y=F/2-(F/2-st.cy)*k;CR.z=nz;}
function paint(){
  var im=$("#cimg");if(!im||!CR.F)return;var s=CR.base*CR.z,w=im.naturalWidth*s,h=im.naturalHeight*s,F=CR.F;
  CR.x=Math.min(0,Math.max(F-w,CR.x));CR.y=Math.min(0,Math.max(F-h,CR.y));
  im.style.width=im.naturalWidth+"px";im.style.transform="translate("+CR.x+"px,"+CR.y+"px) scale("+s+")";
}
function cropFile(){
  return new Promise(function(res,rej){
    var im=$("#cimg"),s=CR.base*CR.z,OUT=1080,c=document.createElement("canvas");c.width=OUT;c.height=OUT;
    var g=c.getContext("2d"),sx=-CR.x/s,sy=-CR.y/s,sw=CR.F/s;
    g.drawImage(im,sx,sy,sw,sw,0,0,OUT,OUT);
    try{c.toBlob(function(b){b?res(new File([b],"crop-"+Date.now()+".jpg",{type:"image/jpeg"})):rej(new Error("crop"));},"image/jpeg",.88);}catch(e){rej(e);}
  });
}

function payList(){return (S.shop.payments||[]).filter(function(p){return p.number;});}

function invoiceText(o){
  var nm=(o.customer_name||"").split(" ")[0]||(W.waPhone(o.customer_phone)?"+"+W.waPhone(o.customer_phone):"");
  var lines=[t("inv_hi",{name:nm?" "+nm:"",code:o.code}),""];
  o.items.forEach(function(i){lines.push("• "+i.qty+" × "+i.name+(i.price!=null?" — TSh "+W.money(i.price*i.qty):"")+(i.note?" ("+i.note+")":""));});
  if(o.delivery_fee===0)lines.push("• "+t("fee_name")+" — "+t("fee_free")+" 🎁");else if(o.delivery_fee!=null)lines.push("• "+t("fee_name")+" — TSh "+W.money(o.delivery_fee));
  if(o.address&&o.address.line)lines.push("📍 "+o.address.line);
  lines.push("*"+t("cart_total")+": TSh "+W.money(W.total(o))+"*");
  var sel=paySel(o),pays=payList().filter(function(_,i){return sel.indexOf(i)>=0;});
  if(pays.length){lines.push("",t("inv_pay"));pays.forEach(function(p){lines.push(p.provider+": *"+p.number+"*"+(p.name?" ("+p.name+")":""));});}
  lines.push("",t("inv_after"),"",t("inv_track"),W.orderLink(o.code));
  /* an assistant signs the invoice so the customer knows who they are talking to */
  if(S.me&&S.me.role==="assistant"&&S.me.name)lines.push("",t("sign_asst",{name:S.me.name}));

async function openOrder(code){markSeen(String(code).toUpperCase());
  O={loading:true,o:null};if(stack[stack.length-1]!=="order")open("order");else draw(false);
  try{history.replaceState(null,"","#o-"+code);}catch(e){}
  try{O.o=await W.db.getOrder(code);}catch(e){console.error(e);}
  /* v2.18: a guest's number is on the order; if this copy came back without it (sign-in still loading after a
     WhatsApp link), take it from the order list or ask again once the session is there */
  if(O.o&&!W.waPhone(O.o.customer_phone)){var lo=(S.orders||[]).find(function(x){return x.code===O.o.code;});
    if(lo&&W.waPhone(lo.customer_phone))O.o.customer_phone=lo.customer_phone;
    else if(O.o.phone_tail){for(var k=0;k<3&&O&&O.o&&!W.waPhone(O.o.customer_phone);k++){await new Promise(function(r){setTimeout(r,900);});try{var o2=await W.db.getOrder(code);if(o2&&W.waPhone(o2.customer_phone))O.o=o2;}catch(e){}}}}
  O.loading=false;draw(false);
  /* opening a new order starts the 2-minute clock; the server moves it to "Inafanyiwa kazi" */
  if(O.o&&O.o.status==="new"&&!O.o.seen_at){try{var r=await W.db.setOrder(O.o.code,"new",{seen:true});if(O&&O.o&&O.o.code===r.code){O.o=r;draw(false);}}catch(e){console.error(e);}}
  clearInterval(S.oTimer);
  S.oTimer=setInterval(async function(){
    if(!O||!O.o||O.o.status!=="new"||stack[stack.length-1]!=="order")return;
    try{await W.db.orders();var r2=await W.db.getOrder(O.o.code);if(O&&O.o&&r2&&r2.status!==O.o.status){keepFee();O.o=r2;draw(false);syncList(r2);}}catch(e){}
  },20000);
}

  if(p1.length<6)return bad("k_err","w_k_pin",t("err_pass"));
  if(p1!==p2)return bad("k_err","w_k_pin2",t("err_pass2"));
  try{await W.db.account("set_password",{username:u,password:p1,current:cur});if(S.me)S.me.username=u;W.toast(t("pin_done"));back();}
  catch(e){var em=e.message;bad("k_err",em==="taken"?"w_k_user":em==="current"?"w_k_cur":null,em==="taken"?t("err_taken"):em==="current"?t("err_current"):em==="assistant"?t("pin_assistant"):t("error"));}
}
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="pick"){var fs=Array.from(el.files||[]);el.value="";if(fs.length)startAdd(fs);return;}
  if(el.id==="avIn"){var af=(el.files||[])[0];el.value="";if(!af||!S.me)return;W.during(W.db.uploadAvatar(S.me.id,af).then(function(v){W.ls("winga.av."+S.me.id,String(v));W.toast(t("saved"));render();draw(false);}).catch(function(e){console.error(e);W.toast(t("error"));}));return;}
  if(el.id==="more"){
    var fs2=Array.from(el.files||[]);el.value="";if(!fs2.length)return;
    if(A){readFields(A);A.photos=takePhotos(A.photos,fs2);}
    else if(E){readFields(E);var room=takePhotos(E.items,fs2).slice(E.items.length);E.items=E.items.concat(room.map(function(f){return {f:f};}));}
    draw(false);
  }
});
document.addEventListener("input",function(e){
  if(e.target.closest&&e.target.closest(".ifield.bad"))e.target.closest(".ifield").classList.remove("bad");
  if(e.target.id==="aq"){S.q=e.target.value;render();}
  if(e.target.id==="oq"){S.oq=e.target.value;render();}
});
document.addEventListener("submit",async function(e){
  if(e.target.dataset.form!=="login")return;e.preventDefault();
  if(S.busy)return;
  var em=$("#em").value.trim(),pw=$("#pw").value;S.email=em;
  if(!em)return bad("lerr","w_em",t("need_field",{f:t("f_login").toLowerCase()}));
  if(!pw)return bad("lerr","w_pw",t("need_field",{f:t("f_secret").toLowerCase()}));
  S.busy=true;render();
  W.wait(true);
  try{await W.db.signIn(em,pw);S.busy=false;await afterAuth();W.wait(false);}
  catch(x){W.wait(false);console.error(x);S.busy=false;render();var m=x.message;bad("lerr","w_pw",m==="locked"?t("err_locked"):m==="wrong"?t("err_wrong",{n:(x.info&&x.info.left!=null)?x.info.left:"…"}):t("wrongLogin"));}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&stack.length){readAll();back();}});

/* ---------------- boot ---------------- */
async function loadDash(){try{S.dash=await W.db.dashboard(S.days);}catch(e){console.error(e);S.dash={visitors:0,views:0,carts:0,chats:0,orders:0,paid:0,sales:0,open:0,new:0,by_day:[],top:[]};}if(S.tab==="home")render();}
async function reloadOrders(){try{S.orders=await W.db.orders();}catch(e){console.error(e);}if(S.stage==="ready"){render();}}
/* the Oda badge stays fresh: every minute while the app is open, and on coming back to it */
function startPolling(){clearInterval(S.poll);S.poll=setInterval(function(){if(document.visibilityState==="visible"&&S.stage==="ready")reloadOrders();},60000);}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.stage==="ready"){reloadOrders().then(autoOpenFresh);loadDash();}});
/* coming from a WhatsApp link or an alert: the newest order nobody has opened yet (last 15 min) opens by itself, once */
function autoOpenFresh(){
  if(S.stage!=="ready"||stack.length||S.pendingOrder)return false;
  var done=[];try{done=JSON.parse(localStorage.getItem("winga.autoOpened")||"[]");}catch(e){}
  var o=(S.orders||[]).find(function(x){return x.status==="new"&&!x.seen_at&&Date.now()-new Date(x.created_at)<900000&&done.indexOf(x.code)<0;});
  if(!o)return false;
  done.unshift(o.code);try{localStorage.setItem("winga.autoOpened",JSON.stringify(done.slice(0,40)));}catch(e){}
  S.tab="orders";render();openOrder(o.code);return true;
}
async function load(){
  var r=await Promise.all([W.db.getShop(),W.db.listProducts(true),W.db.me(),W.db.ping(),W.db.orders().catch(function(){return [];}),W.db.productGanji().catch(function(){return {};})]);
  S.shop=r[0]||{};S.products=r[1];S.me=r[2];S.status=r[3];S.orders=r[4];S.products.forEach(function(p){if(r[5][p.id]!=null)p.ganji=r[5][p.id];});S.stage="ready";render();
  loadDash();startPolling();
  W.push.state().then(function(st){S.push=st;if(S.tab==="home")render();
    /* first open from the Home Screen: ask for alerts straight away (Allow → the phone's own prompt; blocked → how to fix it) */
    if(W.standalone()&&(st==="off"||st==="denied")&&W.ls("winga.pushAsk")!=="1"&&!stack.length&&!S.pendingOrder&&!S.pendingBrief){W.ls("winga.pushAsk","1");ALERT_WELCOME=true;open("alerts");}});
  if(S.pendingOrder){var c=S.pendingOrder;S.pendingOrder=null;S.tab="orders";render();openOrder(c);}
  else if(S.pendingBrief){var bt=S.pendingBrief;S.pendingBrief=null;openBrief(bt);}
  else autoOpenFresh();
}
async function afterAuth(){if(!(await W.db.isAdmin())){S.stage="denied";render();return;}await load();}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,async function(){if(S.stage==="ready"&&!stack.length)await load();});
W.watchNetwork(function(){if(S.stage==="ready")load().catch(function(){});else boot();});
var om=location.hash.match(/^#o-(.+)$/);if(om)S.pendingOrder=decodeURIComponent(om[1]);
/* a tapped brief alert carries the whole brief: #b=<title\nbody> */
var bm=location.hash.match(/^#b=(.+)$/);if(bm){try{S.pendingBrief=decodeURIComponent(bm[1]);}catch(_){}try{history.replaceState(null,"",location.pathname+location.search);}catch(_){}}
/* a tapped order alert (app already open) or a changed #o-CODE opens that order */
function openFromUrl(u){var bb=String(u||"").match(/#b=(.+)$/);if(bb){var tx="";try{tx=decodeURIComponent(bb[1]);}catch(_){}if(S.stage!=="ready"){S.pendingBrief=tx;return;}openBrief(tx);return;}var m=String(u||"").match(/#o-([A-Za-z0-9-]+)/);if(!m)return;var code=decodeURIComponent(m[1]);if(S.stage!=="ready"){S.pendingOrder=code;return;}S.tab="orders";render();reloadOrders();openOrder(code);}
addEventListener("hashchange",function(){if(!(O&&O.o&&location.hash==="#o-"+O.o.code))openFromUrl(location.hash);});
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",function(e){if(e.data&&e.data.type==="open")openFromUrl(e.data.url);});
async function boot(){
  render();
  try{var s=await W.guard(W.db.session(),10000);if(!s){S.stage="login";render();return;}await W.guard(afterAuth(),15000);}
  catch(e){console.error(e);S.status="down";if(S.stage==="boot"){W.errorScreen(function(){location.reload();});}else{S.stage="login";render();}}
}
boot();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});}catch(e){}}
})();
</script>
</body>

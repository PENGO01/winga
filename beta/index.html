<style>
/* Customer shop v2.1: image-first masonry, Temu-style categories, 4-tab bottom bar, striped sun. */
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header.shop{background:var(--navy);color:var(--on-navy);padding:12px var(--gr) 14px var(--gl);padding-top:calc(12px + env(safe-area-inset-top,0px));position:relative;overflow:hidden}
header.shop .bar{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
header.shop .mark{flex:1;min-width:0;white-space:nowrap;overflow:visible}
header.shop .mark .t{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis}
header.shop .mark{position:relative}
header.shop .betapill{position:absolute;left:22px;top:-2px;margin:0;box-shadow:0 0 0 2px var(--navy)}
header.shop .tag{color:var(--on-navy-dim);font-size:12.5px;margin-top:6px;position:relative;z-index:1}
.sticky{position:sticky;top:0;z-index:15;background:var(--paper);padding:10px var(--gr) 6px var(--gl);display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:0 6px 0 14px;height:42px;transition:height .15s}
.sbox.big{height:48px}
.sbox svg{width:18px;height:18px;color:var(--dim);flex:none}
.sbox input{border:0;outline:none;background:transparent;flex:1;min-width:0;padding:0}
.sbox .clr{border:0;background:var(--sunk);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;color:var(--dim)}
.sbox .clr svg{width:14px;height:14px}
.chips{scroll-behavior:smooth}
.chips .chip{padding:6px 12px;font-size:13px}
.subchips .chip{background:transparent;border-color:transparent;color:var(--dim);padding:4px 10px;font-size:12.5px}
.subchips .chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--sunk);color:var(--ink)}
main{padding:12px var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
/* masonry */
.mas{columns:2;column-gap:3px;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.fychips{margin-top:-4px;flex-wrap:nowrap}
.fychips .belt{display:flex;gap:6px;flex:none;padding-right:6px}
.fychips .chip svg{width:15px;height:15px;flex:none}
.thero{display:flex;gap:10px;align-items:center;padding:12px 14px 2px}
.thero .tsun{width:36px;height:36px;border-radius:14px;background:var(--navy);display:grid;place-items:center;flex:none}
.thero .tsun svg{width:24px;height:24px}
.thero h2{font-size:17px;margin:0;text-wrap:balance}
.thero p{margin:0;font-size:13.5px;color:var(--dim)}
.tips{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.ttabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.ttabs button{border:0;background:none;border-radius:11px;padding:7px 6px;font-weight:600;font-size:13px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.ttabs button svg{width:16px;height:16px;flex:none}
.ttabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-xs)}
.tsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tstep{display:grid;grid-template-columns:28px 1fr 36px;gap:12px;align-items:center;position:relative;padding:8px 0}
.tstep:not(.last)::before{content:"";position:absolute;left:13px;top:36px;bottom:-8px;width:2px;background:var(--line)}
.tstep .tn{width:28px;height:28px;border-radius:50%;background:var(--jua);color:var(--on-jua);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:13px;position:relative;z-index:1}
.tstep .tt{font-size:14.5px;line-height:1.35}
.tstep .ti{width:36px;height:36px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.tstep .ti svg{width:18px;height:18px}
@media (min-width:620px){.mas{columns:3}}
.pc{break-inside:avoid;margin:0 0 3px;background:var(--card);border:0;border-radius:0;overflow:hidden;display:block;width:100%;text-align:left;padding:0;color:inherit;position:relative}
.pc .im{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:var(--sunk)}
.pc.tall .im{aspect-ratio:4/5}
.slide{display:flex;flex-direction:column;align-items:center;gap:10px}
/* the whole screen picture, never cropped, sized so title + action + picture + buttons fit with no scrolling */
.slide .shot{height:clamp(200px,calc(100dvh - 380px),460px);aspect-ratio:420/908;border-radius:18px;overflow:hidden;background:var(--navy);box-shadow:var(--shadow);display:grid;place-items:center}
.slide .shot img,.slide .shot svg{width:100%;height:100%;object-fit:contain;display:block}
.slide .scap{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15.5px;line-height:1.3;max-width:36ch;min-height:42px;align-self:stretch}
.tnav{display:flex;gap:8px;align-items:center}.tnav .btn{border-radius:999px;min-height:50px}.tnav .btn.primary{flex:1;font-size:16px}
.tnav .tback{width:50px;flex:none;padding:0}.tnav .tback[disabled]{visibility:hidden}
.slide .scap .tn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--jua);color:var(--on-jua);display:grid;place-items:center;font-size:14px}
.sdots{display:flex;gap:6px}.sdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.sdots i.on{background:var(--ink);width:18px;border-radius:4px}
.instbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 10px 12px}
.instbar .fi{flex:none}.instbar b{font-size:14px}
.newstrip{margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.newstrip .nsh{font-weight:800;font-size:15px;padding:0 var(--gr) 8px var(--gl);display:flex;align-items:center;gap:6px}
.newstrip .spark{display:inline-grid;color:var(--jua-text)}.newstrip .spark svg{width:18px;height:18px}
.nlive{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--dim);background:var(--sunk);border-radius:999px;padding:3px 9px 3px 7px;display:inline-flex;align-items:center;gap:5px}
.nlive i{width:7px;height:7px;border-radius:50%;background:var(--cyan)}
.nsv{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:2px 0 4px}.nsv::-webkit-scrollbar{display:none}
.newstrip .track{display:flex;width:max-content;padding-left:var(--gl)}
.newstrip .nbelt{display:flex;gap:8px;padding-right:8px}
.newstrip button{all:unset;cursor:pointer;width:108px;display:flex;flex-direction:column;gap:4px;animation:popin .3s ease-out both;animation-delay:var(--d,0ms);transition:transform .15s}
.newstrip button:active{transform:scale(.95)}
.newstrip .nim{position:relative;display:block;border-radius:14px;overflow:hidden;background:var(--sunk)}
.newstrip img{width:108px;height:108px;object-fit:cover;display:block;transition:transform .5s}
.newstrip .ntag{position:absolute;top:6px;left:6px;font-style:normal;font-size:11px;font-weight:700;background:var(--jua);color:var(--on-jua);border-radius:6px;padding:2px 6px;}
.newstrip .nprice{position:absolute;left:6px;bottom:6px;font-size:12px;font-weight:800;background:var(--photo-ink);color:var(--on-navy);border-radius:8px;padding:2px 7px}
.newstrip .nprice s{opacity:.6;font-weight:600;font-size:11.5px}
.newstrip .nn{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.newstrip button{animation:none}}
.sbox .cam{all:unset;cursor:pointer;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--ink)}
.sbox .cam svg{width:21px;height:21px}
.pobox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;border:2px dashed var(--line);border-radius:16px;background:var(--card);cursor:pointer;position:relative;overflow:hidden;text-align:center}
.pobox.has{border-style:solid;min-height:0}.pobox img{width:100%;max-height:44vh;object-fit:contain;display:block;background:var(--sunk)}
.pobox .pochg{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:var(--photo-ink);color:var(--on-navy);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pobox .pochg svg{width:16px;height:16px}
.savedaddr{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--wa);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab svg{width:28px;height:28px}
@media (min-width:760px){.fab{right:calc(50% - 380px + 16px)}}
.served{display:flex;gap:8px;align-items:center}.served svg{width:16px;height:16px;flex:none}
.pc .bd{padding:6px 10px 8px;display:flex;flex-direction:column;gap:2px}
.pc .nm{font-weight:400;font-size:12.5px;line-height:1.3;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .ds{font-weight:400;font-size:12px;color:var(--dim);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .pr{display:flex;align-items:center;gap:6px;margin-top:2px}
.pc .pr{flex-wrap:wrap;row-gap:0}
.pc .pr b{font-family:var(--num);font-weight:700;font-size:16px}
.was{font-size:12px;color:var(--faint);font-family:var(--num)}
.off{font-size:11.5px;font-weight:700;color:var(--jua-text);background:var(--jua-soft);border-radius:5px;padding:1px 5px}
.pp .was{font-size:15px;margin-left:8px}.pp .off{font-size:13px;margin-left:6px;vertical-align:3px}
.pc .pr .ask{font-size:12.5px;font-weight:600;color:var(--jua-text)}
.pc .pr .inc{color:var(--amber-brand);display:grid}
.pc .pr .inc svg{width:15px;height:15px}
.pc .ft{display:flex;align-items:center;gap:6px;margin-top:2px}
.pc .ft .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc .ft .sold{font-size:10.5px;color:var(--faint);white-space:nowrap}
/* bottom nav: ink bar, cyan = you are here, gold badge */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);border-top:1px solid var(--nav-raise);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--on-navy-dim);position:relative}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--cyan);font-weight:600}
nav.tabs .bdg.ping{background:var(--cyan);color:var(--on-jua);animation:pingpop .8s ease-in-out 3}
@media (prefers-reduced-motion:reduce){nav.tabs .bdg.ping{animation:none}}
@keyframes pingpop{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
nav.tabs .bdg{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--jua);color:var(--on-jua);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--num)}
/* categories tab */
.catv{display:grid;grid-template-columns:116px 1fr;min-height:calc(100vh - 200px);margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.rail{background:var(--sunk);display:flex;flex-direction:column}
.rail button{border:0;background:transparent;text-align:left;padding:15px 12px 15px 14px;font-size:13.5px;font-weight:500;color:var(--dim);border-left:3px solid transparent;line-height:1.25}
.rail button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;border-left-color:var(--jua)}
.subgrid{padding:14px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;align-content:start}
.subgrid h3{grid-column:1/-1;font-size:15px}
.sc{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font-size:12px;font-weight:500;text-align:center;line-height:1.2}
.sc .c{width:62px;height:62px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.sc .c svg{width:28px;height:28px}
.sc .c{overflow:hidden}
.sc .c img{width:100%;height:100%;object-fit:cover;transform:scale(1.35);transform-origin:center}
.sc .c{width:68px;height:68px;background:var(--sunk);border-color:transparent}
.sc .c img.c3d{width:68%;height:68%;object-fit:contain;transform:none}
.sc:first-of-type .c{background:var(--sunk);border-color:transparent;color:var(--ink)}
/* product page */
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--sunk);scrollbar-width:none;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl))}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:min(100vw,64vh);object-fit:contain;scroll-snap-align:center}
.pbd{padding-top:0!important;gap:8px!important}.pbd>*{flex-shrink:0}
/* while a page is open the list behind it can't move; scrolling stays inside the page */
html.sheet-open,html.sheet-open body{overflow:hidden}
.scrim,.sheet .bd{overscroll-behavior:contain}
.scrim.page .sheet .bd{flex:1 1 auto;min-height:0}
.gal,.sim{overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.pbd h2{margin:-2px 0 0}
.galw{position:relative}
.galback{position:absolute;z-index:2;top:10px;left:calc(10px - var(--gl));background:var(--card);color:var(--ink);box-shadow:var(--shadow-xs);width:40px;height:40px;border-radius:50%}
.galw .gal{margin-top:0}
.scrim.page .sheet .ft{padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.simh{font-weight:600;font-size:14px;margin-top:6px}
.sim{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:0 var(--gr) 2px var(--gl);scroll-snap-type:x proximity}
.sim::-webkit-scrollbar{display:none}
.sim button{flex:0 0 112px;scroll-snap-align:start;display:flex;flex-direction:column;gap:3px;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit}
.sim img{width:112px;height:112px;object-fit:cover;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.sim span{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sim b{font-size:12.5px;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.pp{font-family:var(--num);font-weight:600;font-size:24px}
.desc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;white-space:pre-wrap;line-height:1.5}
/* three semi-equal action buttons */
.actbar{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;align-items:stretch}
.actbar.two{grid-template-columns:1fr 1.6fr}
.editpill{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--jua);color:var(--on-jua);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;flex:none}.editpill svg{width:14px;height:14px}
.stamp{display:flex;gap:12px;align-items:center;border:2px dashed var(--ink);border-radius:16px;padding:12px 14px;background:var(--card);position:relative;overflow:hidden}
.stamp .sl{width:52px;height:52px;flex:none;color:var(--ink);transform:rotate(-12deg)}.stamp .sl svg{width:100%;height:100%}
.stamp b{display:block;font-size:16px;color:var(--ink)}.stamp .small{color:var(--dim)}
.cardprev{display:flex;flex-direction:column;gap:12px;align-items:center}.cardprev img{width:100%;max-width:360px;border-radius:16px;box-shadow:var(--shadow);background:var(--sunk)}
.delpop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 4px}.delpop .fi{width:64px;height:64px}.delpop .fi svg{width:32px;height:32px}
.pside{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.feenote{display:flex;gap:10px;align-items:center;background:var(--sunk);color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14.5px;line-height:1.3;margin-top:-6px}
.feenote svg{width:22px;height:22px;flex:none}
.emptyx{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 8px;text-align:center}
.emptyx b{font-size:15px}.ecart{width:120px;height:56px;position:relative;overflow:hidden}
.ecart svg{position:absolute;top:8px;left:40px;width:40px;height:40px;color:var(--dim);animation:cartroll 3.2s ease-in-out infinite}
@keyframes cartroll{0%{transform:translateX(-80px);opacity:0}20%{opacity:1}50%{transform:translateX(0)}55%{transform:translateX(0) rotate(-6deg)}60%{transform:translateX(0)}80%{opacity:1}100%{transform:translateX(80px);opacity:0}}
@media (prefers-reduced-motion:reduce){.ecart svg{animation:none;left:40px}}
.locbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600;align-self:flex-start;margin-top:-2px}.locbtn svg{width:16px;height:16px}

.actbar .btn{border-radius:999px;min-height:48px;padding:8px 10px;font-size:14px;white-space:nowrap}
.actbar .btn.chat{background:var(--card);color:var(--ink);border:1px solid var(--line)}.actbar .btn.chat svg{color:var(--wa)}
.actbar .btn.cartb{background:var(--jua);color:var(--on-jua)}
/* qty sheet */
.qs{display:flex;gap:12px;align-items:center}
.qs img{width:76px;height:76px;border-radius:12px;object-fit:cover;background:var(--sunk);flex:none}
.sumrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.sumrow b{font-family:var(--num);font-size:18px}
/* cart */
.ci{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.ci .n{font-weight:600;line-height:1.25;font-size:14px}
.ci .p{font-family:var(--num);font-size:13px;color:var(--dim);margin:2px 0 6px}
.ci .note{font-size:12.5px;color:var(--dim);background:var(--sunk);border-radius:8px;padding:4px 8px;margin:2px 0 6px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ph{display:flex;align-items:center;gap:10px;padding-top:4px}
.ph h1{flex:1;font-size:22px}
/* me */
.mehead{background:var(--navy);color:var(--on-navy);margin:-12px calc(-1*var(--gr)) 0 calc(-1*var(--gl));padding:22px var(--gr) 22px var(--gl);padding-top:calc(22px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;min-height:25vh}
.mehead .av{width:62px;height:62px;border-radius:50%;background:var(--jua);color:var(--on-jua);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;flex:none}
.mehead .nm{font-family:var(--display);font-weight:800;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehead .wa{color:var(--on-navy-dim);font-family:var(--num);font-size:13px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mehead .gear{width:42px;height:42px;border-radius:50%;border:0;background:var(--nav-raise);color:var(--on-navy);display:grid;place-items:center;flex:none;align-self:center}
.mehead .gear svg{width:21px;height:21px}
.chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber);font-size:11px;padding:2px 8px;font-family:var(--body)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font-size:12.5px;font-weight:500;position:relative}
.tl .fi{width:46px;height:46px}.tl .fi svg{width:21px;height:21px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink)}
.mrow .fi{width:34px;height:34px}.mrow .fi svg{width:17px;height:17px}
.mrow .chev{width:18px;height:18px;color:var(--faint);margin-left:auto}
.mrow .val{margin-left:auto;color:var(--dim);font-size:13px}
.mrow.red{color:var(--red)}
.oi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink)}
.oi .th{display:flex}
.oi .th img{width:38px;height:38px;border-radius:9px;object-fit:cover;border:2px solid var(--card);margin-left:-10px;background:var(--sunk)}
.oi .th img:first-child{margin-left:0}
.res{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.res button:first-child{border-top:0}
.paybox{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px}
.paybox .pv{font-size:12px;font-weight:700;color:var(--dim)}
.paybox .pn{font-family:var(--num);font-weight:600;font-size:16px}
.howlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.howlist li{display:flex;align-items:center;gap:12px;font-weight:500}
.howlist b{width:32px;height:32px;border-radius:50%;background:var(--jua);color:var(--on-jua);display:grid;place-items:center;font-family:var(--num);flex:none}

.big-ok .fi{width:64px;height:64px;background:var(--green-soft);color:var(--green)}
.big-ok .fi svg{width:30px;height:30px}

.ghero .brandmark{width:64px;height:64px;flex:none}.ghero .btn.ghost{background:transparent;color:var(--on-navy);border-color:var(--grid-line)}
.tiles .fi{position:relative}
.guest{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 0 6px}

.sendbtn svg{width:19px;height:19px}

/* v2.15 Calm pass (shop product page): name → price + stars on one line → description; the basket sits in the bottom bar, same height as the other two */
.pinfo{display:flex;flex-direction:column;gap:6px}
.pname{font-size:19px;font-weight:600;line-height:1.3}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pmeta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);white-space:nowrap}
.actbar.pbar{grid-template-columns:48px 1fr 1.35fr}

.cartsq svg{width:22px;height:22px}
.cartsq i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--jua);color:var(--on-jua);font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.pcopen{all:unset;display:block;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pcopen:focus-visible{outline:3px solid var(--jua);outline-offset:-3px}
.pc .bd{display:flex;flex-direction:column;gap:3px;padding:8px 10px 10px}
.pc .nm{font-size:13px;color:var(--dim)}
.pc .meta{display:flex;align-items:center;gap:8px;min-width:0}
.pc .meta .sold{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:inline-flex;gap:1px;line-height:1}
.stars i{display:inline-flex;color:var(--line)}.stars i.on{color:var(--jua)}
.stars svg{width:12px;height:12px;fill:currentColor;stroke:none}
.pmeta .stars svg{width:14px;height:14px}
.pc .pr .inc{color:var(--jua-text)}
/* basket: the WhatsApp glyph keeps its green on the main pill */
.btn.sendwa svg{color:var(--wa)}
.btn.primary.sendwa svg{background:var(--on-navy);border-radius:50%;padding:1px}
/* category screen: the 3D icons are the one place they live, on calm neutral tiles */
.sc .c img.c3d{width:62%;height:62%;object-fit:contain;transform:none;filter:none}
.sc{font-size:12.5px}
/* the header tagline also uses .tag: keep it on the ink header, not the sand chip */
header.shop .tag{background:var(--on-navy-tint);box-shadow:none;height:auto;padding:4px 10px;color:var(--on-navy-dim)}

/* ---------------- basket (on this phone) ---------------- */
var CART=load("winga.cart.v2",[]);
function load(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function buyable(p){return p&&p.status==="active"&&p.price!=null;}
function cartItems(){return CART.map(function(c){return {c:c,p:byId(c.id)};}).filter(function(x){return buyable(x.p);});}
function cartCount(){return cartItems().filter(function(x){return x.p;}).length;}   /* number of different products in the basket */
function inCart(id){return CART.find(function(c){return c.id===id;});}
function sum(items){var s=0;items.forEach(function(x){if(x.p.price!=null)s+=x.p.price*x.c.qty;});return s;}
function byId(id){return S.products.find(function(p){return p.id===id;});}
var MYORDERS=load("niagize.myorders",[]);

/* ---------------- shared bits ---------------- */
function stars(n){n=n||2;var s="";for(var i=1;i<=3;i++)s+='<i class="'+(i<=n?"on":"")+'">'+IC.star+'</i>';return '<span class="stars" title="'+esc(t("rate_"+n))+'" aria-label="'+esc(t("rate_"+n))+'">'+s+'</span>';}
/* a price cut in the last 14 days shows the old price struck through + the % off (Temu style) */
function drop(p){return p.price>0&&p.prev_price>p.price&&p.price_drop_at&&(Date.now()-new Date(p.price_drop_at).getTime()<14*864e5)?Math.round((1-p.price/p.prev_price)*100):0;}
function priceHtml(p){if(p.price==null)return '<span class="ask">'+esc(t("noPrice"))+'</span>';var d=drop(p);
  return '<b>TSh '+W.money(p.price)+'</b>'+(d?'<s class="was">'+W.money(p.prev_price)+'</s><span class="off">-'+d+'%</span>':'');}
function hbtns(){return '<button class="hbtn" data-act="shareShop" aria-label="'+esc(t("share"))+'">'+IC.share+'</button><button class="hbtn" data-act="lang" aria-label="'+esc(t("lang"))+'">'+(W.lang==="sw"?"SW":"EN")+'</button>';}
function chev(){return IC.chev.replace('<svg','<svg class="chev"');}
/* "Zinazofanana": same group AND sub-group, and a price in the same range (¼× to 4×); best matches first.
   A TV doesn't get phone covers. No real match → the section is hidden. */
function similar(p){
  var tags=p.tags||[];
  return S.products.filter(function(x){
    if(x.id===p.id||x.status!=="active"||x.category!==p.category||(x.subcategory||"")!==(p.subcategory||""))return false;
    if(p.price>0&&x.price>0&&(x.price>p.price*4||x.price<p.price/4))return false;
    return true;
  }).map(function(x){var shared=(x.tags||[]).filter(function(g){return tags.indexOf(g)>=0;}).length,gap=(p.price>0&&x.price>0)?Math.abs(Math.log(x.price/p.price)):1;return {x:x,s:shared*2-gap};})
   .sort(function(a,b){return b.s-a.s;}).slice(0,10).map(function(o){return o.x;});
}
/* staggered masonry: a fixed rhythm of tall (4:5) and square tiles so the seams never line up (Temu feel).
   Uploads stay square; tall tiles crop a little off each side. Sizes are known up front, so nothing jumps. */
function tall(i){return [0,3,5,6].indexOf(i%8)>=0;}
function card(p,i){
  var ic=inCart(p.id);
  /* v2.16: the whole card opens the product (orders start there); no WhatsApp or basket button per card */
  return '<div class="pc'+(tall(i||0)?' tall':'')+'"><button class="pcopen" data-act="open" data-id="'+p.id+'">'+
   '<img class="im" src="'+esc(p.thumbUrl)+'" alt="'+esc(p.name)+'" width="400" height="400" loading="lazy" decoding="async">'+
   '<span class="bd"><span class="nm">'+esc(p.name)+'</span>'+
   '<span class="pr">'+priceHtml(p)+(ic?'<span class="inc" title="'+esc(t("inCart"))+'" aria-label="'+esc(t("inCart"))+'">'+IC.cart+'</span>':'')+'</span>'+
   '<span class="meta">'+stars(p.rating)+(p.ordered?'<span class="sold">'+esc(t("sold_n",{n:p.ordered}))+'</span>':'')+'</span></span></button></div>';
}
function forYou(n){
  var cats=W.CATS.filter(function(c){return S.products.some(function(p){return p.category===c;});});
  var pick=S.fy&&cats.indexOf(S.fy)>=0?S.fy:"";
  /* the same chip buttons as the home filter: scroll sideways, tap to filter the products under them */

  var chips='<span class="belt">'+one(false)+'</span><span class="belt">'+one(true)+'</span>';

/* any endless row (category chips, "Mpya dukani"): drifts by itself, a finger scrolls or taps it, drifting resumes after 3.5 s */
function driftRow(row,sel,speed){
  if(!row||row.dataset.on)return;row.dataset.on="1";
  row.style.scrollBehavior="auto";   /* smooth scrolling would swallow the tiny steps */
  var belts=row.querySelectorAll(sel);if(belts.length<2)return;
  var span=function(){return belts[1].offsetLeft-belts[0].offsetLeft;};
  var still=matchMedia("(prefers-reduced-motion: reduce)").matches,hold=0,pos=row.scrollLeft;
  var touch=function(){hold=Date.now()+3500;};
  row.addEventListener("pointerdown",touch);row.addEventListener("touchstart",touch,{passive:true});row.addEventListener("wheel",touch,{passive:true});
  /* endless: two copies of the chips; whenever one copy has gone past, jump back by its width (no visible jump) */
  row.addEventListener("scroll",function(){var w=span();if(w<=0)return;if(row.scrollLeft>=w){row.scrollLeft-=w;pos=row.scrollLeft;}else if(row.scrollLeft<=0&&Date.now()<hold){row.scrollLeft+=w;pos=row.scrollLeft;}},{passive:true});
  (function step(){if(!document.body.contains(row))return;
    if(Date.now()<=hold)pos=row.scrollLeft;
    else if(!still&&span()>0){pos+=speed;if(pos>=span())pos-=span();row.scrollLeft=pos;}
    requestAnimationFrame(step);})();
}

function claimView(o,ok){return '<div class="claimok'+(ok?'':' wait')+'">'+(ok?IC.check:IC.clock)+'<div><b>'+W.pair(t(ok?"claim_ok":"claim_sent"))+'</b><div class="small">'+W.pair([o.claim_channel,o.claim_ref,o.claim_name].filter(Boolean).join(" · "))+'</div></div></div>';}
function open(name,ctx){stack.push({n:name,c:ctx||{}});draw(true);}
function back(){stack.pop();if(!stack.length)try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}draw(false);}
function closeAll(){stack=[];draw(false);try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
function top(){return stack[stack.length-1];}
function draw(first){
  var r=$("#sheetRoot");document.documentElement.classList.toggle("sheet-open",stack.length>0);if(!stack.length){r.innerHTML="";if(viewSig()!==S.sig)render();else renderTabs();return;}
  var cur=top(),html=PAGES[cur.n](cur.c),pop=POP[cur.n];
  var under="";if(pop&&stack.length>1){var u=stack[stack.length-2];under='<div class="scrim page"><div class="sheet">'+PAGES[u.n](u.c)+'</div></div>';}
  r.innerHTML=under+'<div class="scrim'+(pop?((cur.n==="how"||cur.n==="install"||cur.n==="rate"||cur.n==="tips"||cur.n==="cardprev"||cur.n==="delinfo")?" center":""):" page")+(first?" anim":"")+'" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
  var g=$("#gal");if(g)g.querySelectorAll("img[data-full]").forEach(function(im){var big=new Image();big.decoding="async";big.onload=function(){im.src=big.src;im.removeAttribute("data-full");};big.src=im.dataset.full;});
  if(g&&g.children.length>1)g.addEventListener("scroll",function(){var i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll("#dots i").forEach(function(d,j){d.className=j===i?"on":"";});},{passive:true});
}
function hd(title,extra){return '<div class="hd"><button class="iconbtn" data-act="back" aria-label="'+esc(t("back"))+'" style="margin-left:-8px">'+IC.back+'</button><h2>'+esc(title)+'</h2>'+(extra||"")+'</div>';}
function field(id,icon,ph,val,extra){return '<label class="ifield" id="w_'+id+'">'+icon+'<input id="'+id+'" placeholder="'+esc(ph)+'" value="'+esc(val||"")+'"'+(extra||"")+'></label>';}

 order:function(c){
  var o=c.o;
  if(!o)return hd("")+'<div class="bd">'+(c.loading?loader():'<div class="empty">'+esc(t("o_notfound"))+'</div>')+'</div>';
  var cur=o.status,fee=o.delivery_fee,closed=cur==="cancelled";
  /* paid isn't the end: "Tunafunga mzigo na kukutumia" stays yellow (dashed line) until the order is complete */
  var steps=["new","progress","invoiced","paid","pack","done"],idx=cur==="paid"?4:steps.indexOf(cur);
  var tl=closed?'<div class="banner" style="background:var(--red-soft);border-color:transparent;color:var(--red)"><b>'+esc(t("st_cancelled"))+'</b>'+(o.cancel_reason?' <span class="pair2">'+esc(o.cancel_reason)+'</span>':'')+'<div class="small" style="width:100%;color:var(--ink)">'+esc(t("o_closed"))+'</div></div>':
   '<div class="timeline">'+steps.map(function(s,i){var sh=s==="pack"?(o.history||[]).filter(function(x){return x.s==="ship";}).pop():null,h=s==="pack"?sh:(o.history||[]).slice().reverse().find(function(x){return x.s===s;});
     var cls=(i<idx?" on":i===idx?" cur":"")+(s==="pack"?" pack":"")+(s==="paid"&&idx===4?" before-pack":"");
     return '<div class="st'+cls+'"><span class="dot"></span><div><div class="tt">'+esc(t(sh?"st_ship":"st_"+s))+'</div>'+(h?'<div class="ss">'+esc(W.whenRel(h.at))+(sh&&sh.note?' · '+esc(sh.note):'')+'</div>':'')+'</div></div>';}).join("")+'</div>';
  var pays=(o.payments||[]).filter(function(p){return p.number;});
  /* payment: nothing before the invoice; after it, where to pay + "I paid" details for the seller */
  var pay="";
  if(cur==="invoiced"){
    if(pays.length)pay+='<div class="eyebrow">'+esc(t("o_pay"))+'</div>'+pays.map(function(p){return '<div class="paybox"><div class="grow"><div class="pv">'+esc(p.provider)+'</div><div class="pn">'+esc(p.number)+'</div><div class="small muted">'+esc(p.name||"")+'</div></div><button class="fi" data-act="copyTxt" data-v="'+esc(p.number)+'" aria-label="'+esc(t("copy"))+'">'+IC.copy+'</button></div>';}).join("");
    if(o.claim_ref)pay+=claimView(o,false);
    else{var cl=c.claim||(c.claim={ch:(pays[0]&&pays[0].provider)||"",ref:"",name:""});
      pay+='<div class="claimbox" id="claim"><b>'+esc(t("claim_title"))+'</b>'+
       '<label class="ifield" id="w_cl_ch">'+IC.receipt+'<select id="cl_ch" aria-label="'+esc(t("claim_channel"))+'">'+pays.map(function(p){return p.provider;}).filter(function(v,i,a){return a.indexOf(v)===i;}).concat(["Nyingine"]).map(function(v){return '<option'+(cl.ch===v?" selected":"")+'>'+esc(v)+'</option>';}).join("")+'</select></label>'+
       field("cl_ref",IC.doc,t("claim_ref"),cl.ref,' autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="60"')+
       field("cl_name",IC.me,t("claim_name"),cl.name,' autocomplete="name" maxlength="60"')+
       '<div class="ferr" id="cl_err" role="alert"></div><button class="btn primary block" data-act="claimSend" style="border-radius:999px">'+IC.wa+esc(t("claim_send"))+'</button></div>';}
  }
  var canPhone=cur==="new"||cur==="progress"||cur==="invoiced",gq=S.guest||load("niagize.guest",{});
  var myNum=o.customer_phone||(o.phone_tail&&gq.wa&&gq.wa.slice(-3)===o.phone_tail?gq.wa:"")||"";
  var phoneRow=canPhone?'<button class="mrow" data-act="editPhone"><span class="fi">'+IC.wa+'</span><span class="tt">'+esc(t("o_phone"))+'<br><span class="small muted num">'+(myNum?"+"+esc(myNum):(o.phone_tail?"•••• "+esc(o.phone_tail):"—"))+'</span></span><span class="editpill">'+IC.pen+esc(t("o_phone_edit"))+'</span></button>':'';
  var h=hd(t("o_title",{code:o.code}),'<span class="ost '+cur+'">'+esc(t("st_"+cur))+'</span>')+'<div class="bd">'+
   (o.served_by?'<div class="hint served">'+IC.me+W.pair(t("served_by",{name:o.served_by}))+'</div>':'')+
   (cur==="done"?'<div class="stamp"><span class="sl">'+IC.seal+'</span><div class="grow"><b>'+esc(t("stamp_t"))+'</b><div class="small">'+W.pair(t("stamp_s",{code:o.code,x:W.money(W.total(o))}))+'</div></div></div><button class="btn primary block" data-act="cardPrev" data-k="thx" style="border-radius:999px">'+IC.receipt+esc(t("card_thx_btn"))+'</button>':'')+
   (cur==="paid"?'<div class="feenote">'+IC.truck+'<span>'+esc(t("del_soon"))+'</span></div>':'')+
   (c.fresh?'<div class="big-ok"><span class="fi">'+IC.check+'</span><h2>'+esc(t("order_sent"))+'</h2><p class="muted" style="margin:0">'+esc(t("order_sent_s"))+'</p></div>':'')+
   (cur==="invoiced"?pay:tl)+'<div class="eyebrow">'+esc(t("o_items"))+'</div><div class="card">'+o.items.map(function(i){return '<div class="ci"><img src="'+esc(W.img(i.thumb))+'" alt="" width="400" height="400" loading="lazy" decoding="async"><div><div class="n">'+esc(i.name)+'</div><div class="p">'+i.qty+' × '+(i.price!=null?"TSh "+W.money(i.price):esc(t("noPrice")))+'</div>'+noteHtml(i.note)+'</div><span></span></div>';}).join("")+'</div>'+
   '<div class="card stack" style="gap:6px"><div class="row between"><span class="muted">'+esc(t("delivery"))+' <span class="pair2">'+esc(t("del_"+o.delivery))+'</span>'+'</span><span class="num">'+(fee!=null?'TSh '+W.money(fee):esc(t("fee_tbd")))+'</span></div>'+
   (o.agreed_total!=null?'<div class="row between small muted"><span>'+esc(t("total_orig"))+'</span><s class="num">TSh '+W.money((o.subtotal||0)+(fee||0))+'</s></div>':'')+
   '<div class="sumline"><span>'+esc(t("cart_total"))+'</span><b>TSh '+W.money(W.total(o))+'</b></div></div>';
  if(cur==="new"||cur==="progress"){h+='<div class="hint">'+esc(t("o_pay_wait"))+'</div>';}
  else if(o.claim_ref&&(cur==="paid"||cur==="done"))h+=claimView(o,true);
  h+=phoneRow;
  if(cur==="invoiced"||cur==="paid")h+='<button class="mrow" data-act="cardPrev" data-k="inv"><span class="fi">'+IC.receipt+'</span><span class="tt">'+esc(t("card_inv_btn"))+'</span>'+chev()+'</button>';
  if(cur==="invoiced")h+='<div class="eyebrow" style="margin-top:6px">'+esc(t("o_title",{code:o.code}))+'</div>'+tl;
  if(cur==="done"&&o.rating)h+='<div class="hint" style="text-align:center"><span style="color:var(--jua);letter-spacing:2px">'+"★★★★★".slice(0,o.rating)+'</span> '+esc(t("rate_your",{n:o.rating}))+'</div>';
  h+=(!S.me?'<button class="mrow" data-act="signup"><span class="fi">'+IC.me+'</span><span class="tt">'+esc(t("guest_hint"))+'</span>'+chev()+'</button>':'')+'</div>';
  var paidUp=cur==="paid"||cur==="done"||(cur==="invoiced"&&o.claim_ref);
  var chatText=paidUp?t("chat_status",{code:o.code,x:W.money(W.total(o)),link:W.adminUrl()+"o.html#"+o.code}):t("chat_order",{code:o.code,x:W.money(W.total(o))});
  var chat='<a class="btn green'+(cur==="paid"?'':' block')+'" style="border-radius:999px" href="'+esc(W.wa(o.whatsapp||S.shop.whatsapp,chatText))+'" aria-label="'+esc(t("o_chat"))+'">'+IC.wa+(cur==="paid"?'':esc(t("o_chat")))+'</a>';
  h+='<div class="ft">'+(cur==="paid"?'<div class="actbar two" style="grid-template-columns:1fr auto"><button class="btn primary" data-act="received" style="border-radius:999px">'+IC.check+esc(t("received"))+'</button>'+chat+'</div>':chat)+'</div>';
  return h;
 },

  try{

    var r=await W.during(W.db.createOrder(items,S.delivery,addr,guest?(String(g.name||"").trim()||null):null,guest?g.wa:null,guest?g.addr:null));

    MYORDERS.unshift(r.code);MYORDERS=MYORDERS.slice(0,30);save("niagize.myorders",MYORDERS);seenSet(r.code,"new");
    S.products.forEach(function(p){var it=items.find(function(i){return i.id===p.id;});if(it)p.ordered=(p.ordered||0)+it.qty;});
    stack=[];var ctx={fresh:true,loading:true};open("order",ctx);
    try{history.replaceState(null,"","#o-"+r.code);}catch(e){}

var SEEN=load("niagize.seen",{}),PING={},pingAt=0;
function seenSet(code,st){SEEN[code]=st;save("niagize.seen",SEEN);if(PING[code]){delete PING[code];renderTabs();}}
async function checkOrders(force){
  if(!force&&Date.now()-pingAt<60000)return;pingAt=Date.now();
  var codes=MYORDERS.slice(0,6);if(S.me&&!S.me.needsProfile){try{var mine=await W.db.myOrders();mine.slice(0,6).forEach(function(o){if(codes.indexOf(o.code)<0)codes.push(o.code);});}catch(_){}}
  var changed=[];
  await Promise.all(codes.map(async function(code){if(SEEN[code]==="done"||SEEN[code]==="cancelled")return;try{var o=await W.db.getOrder(code);if(!o)return;
    if(SEEN[code]==null){SEEN[code]=o.status;}else if(SEEN[code]!==o.status){PING[code]=o.status;changed.push(o);}}catch(_){}}));
  save("niagize.seen",SEEN);
  if(changed.length){renderTabs();var o=changed[0];W.toast(t("ping_toast",{code:o.code,st:t("st_"+o.status)}));}
}

  if(ctx.o){seenSet(ctx.o.code,ctx.o.status);if(ctx.o.status==="paid"&&W.ls("niagize.delpop."+ctx.o.code)!=="1"){W.ls("niagize.delpop."+ctx.o.code,"1");draw(false);open("delinfo",{o:ctx.o});return;}}
  draw(false);}

async function loadHistory(ctx){
  var cached=load("niagize.hist",null);if(cached){ctx.list=cached;ctx.more=true;draw(false);}
  var mine=[];
  try{
    if(S.me&&!S.me.needsProfile)mine=await W.db.myOrders();
    var have={};mine.forEach(function(o){have[o.code]=1;});
    var guest=MYORDERS.filter(function(c){return !have[c];}).slice(0,15);
    var got=await Promise.all(guest.map(function(c){return W.db.getOrder(c).catch(function(){return null;});}));
    mine=mine.concat(got.filter(Boolean)).sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
    save("niagize.hist",mine.slice(0,30));
  }catch(e){mine=cached||[];}
  ctx.list=mine;ctx.more=false;if(top()&&top().c===ctx)draw(false);
}

    case "swapP":top().c={id:el.dataset.id};draw(false);var sh=$("#sheetRoot .sheet .bd");if(sh)sh.scrollTop=0;try{history.replaceState(null,"","#p-"+el.dataset.id);}catch(_){}W.db.log("view",el.dataset.id);break;
    case "open":open("product",{id:id});try{history.replaceState(null,"","#p-"+id);}catch(_){}W.db.log("view",id);break;

    case "cardInv":case "cardThx":var co=top().c.o,shopUrl=location.href.split("#")[0].split("?")[0];

      try{var oo=await W.db.setOrderPhone(top().c.code,nw);back();var oc2=top();if(oc2&&oc2.n==="order"){oc2.c.o=Object.assign(oc2.c.o,oo||{});if(!oc2.c.o.customer_phone&&isGuest())oc2.c.o.phone_tail=nw.slice(-3);}
        if(isGuest()){var gg=S.guest||load("niagize.guest",{});gg.wa=nw;S.guest=gg;save("niagize.guest",gg);}draw(false);W.toast(t("saved"));}
      catch(x){console.error(x);bad("op_err",null,t(/^(owner|locked)$/.test(x&&x.message)?"err_"+x.message:"o_phone_fail"));}break;
    case "instGo":var how=await W.install();W.ls("winga.instbar",String(Date.now()));if(how==="manual")open("tips",{panel:1});else render();break;

    case "addrPick":readAddr();var r=cur.c.results[+el.dataset.i];cur.c.a.line=r.display_name;cur.c.a.lat=+r.lat;cur.c.a.lng=+r.lon;cur.c.results=null;draw(false);break;
    case "addrSave":readAddr();var ad=cur.c.a;
      if(!ad.line||!ad.line.trim())return bad("ad_err","w_ad_line",t("need_field",{f:t("addr_line").toLowerCase()}));
      if(!ad.accepted_terms)return bad("ad_err","w_ad_terms",t("err_terms"));
      var nz=function(v){return String(v||"").trim().replace(/\s+/g," ").toLowerCase();};
      var same=S.addrs.find(function(x){return (!ad.id||x.id===ad.id)&&nz(x.label)===nz(ad.label)&&nz(x.line)===nz(ad.line)&&nz(x.landmark)===nz(ad.landmark);});
      if(same){S.addrId=same.id;W.toast(t("saved"));back();render();break;}
      var savedA=await W.db.saveAddress(ad);await refreshMe();S.addrId=savedA.id;W.toast(t("saved"));back();render();break;
    case "install":open("tips",{panel:1});break;
    case "received":open("rate",{n:0,o:cur.c.o});break;
    case "star":var rn=$("#r_note");cur.c.note=rn?rn.value:"";cur.c.n=+el.dataset.n;draw(false);break;
    case "rateSend":if(!cur.c.n)break;var note=($("#r_note")||{}).value||"";var ro=await W.db.customerReceived(cur.c.o.code,cur.c.n,note.trim());
      back();var oc=top();if(oc&&oc.n==="order"){oc.c.o=ro;oc.c.fresh=false;}draw(false);W.toast(t("rate_thanks"));break;
    case "claimSend":var cc=cur.c,cl=cc.claim||{};cl.ch=$("#cl_ch").value;cl.ref=$("#cl_ref").value.trim();cl.name=$("#cl_name").value.trim();cc.claim=cl;
      if(cl.ref.length<3)return bad("cl_err","w_cl_ref",t("need_field",{f:t("claim_ref").toLowerCase()}));
      if(cl.name.length<2)return bad("cl_err","w_cl_name",t("need_field",{f:t("claim_name").toLowerCase()}));
      cc.o=await W.db.submitPayment(cc.o.code,cl.ref,cl.name,cl.ch);draw(false);
      W.openWa(cc.o.whatsapp||S.shop.whatsapp,t("claim_wa",{code:cc.o.code,ch:cl.ch,ref:cl.ref,name:cl.name,link:W.adminUrl()+"o.html#"+cc.o.code}));break;
  }}catch(err){console.error(err);W.toast(t(/^(owner|locked)$/.test(err&&err.message)?"err_"+err.message:"error"));}
  finally{if(slow)W.busy(el,false);}

document.addEventListener("submit",async function(e){
  var form=e.target.dataset.form;if(form!=="auth"&&form!=="complete")return;e.preventDefault();
  var c=top().c;if(c.busy)return;
  if(form==="complete"){
    var cf=c.f={name:$("#c_name").value.trim(),user:$("#c_user").value.trim().toLowerCase().replace(/^@/,""),wa:W.phoneVal("c_wa")};
    if(cf.name.length<2)return bad("c_err","w_c_name",t("err_name"));
    if(!/^[a-z0-9_.]{3,20}$/.test(cf.user))return bad("c_err","w_c_user",t("err_user"));
    if(!W.phoneOk(cf.wa))return bad("c_err","w_c_wa",W.phoneErr("c_wa"));
    c.busy=true;draw(false);
    try{await W.during(W.db.account("complete",{full_name:cf.name,username:cf.user,whatsapp:cf.wa}));c.busy=false;await W.during(refreshMe());closeAll();S.tab="me";render();}
    catch(x){c.busy=false;draw(false);var cm=x.message;if(cm==="taken")bad("c_err","w_c_user",t("err_taken"));else if(cm==="duplicate")bad("c_err","w_c_wa",t("err_dup"));else bad("c_err",null,t("error"));}
    return;
  }
  readAuth();
  var up=c.mode==="signup",f=c.f,pass=$("#a_pass").value;
  c.dup=false;
  if(up){
    f.user=f.user.toLowerCase().replace(/^@/,"");
    if(f.name.length<2)return bad("a_err","w_a_name",t("err_name"));
    if(!/^[a-z0-9_.]{3,20}$/.test(f.user))return bad("a_err","w_a_user",t("err_user"));
    if(!W.phoneOk(f.wa))return bad("a_err","w_a_wa",W.phoneErr("a_wa"));
    if(f.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email))return bad("a_err","w_a_email",t("need_field",{f:t("email").toLowerCase()}));
    if(pass.length<6)return bad("a_err","w_a_pass",t("err_pass"));
    if(pass!==$("#a_pass2").value)return bad("a_err","w_a_pass2",t("err_pass2"));
    if(!$("#a_terms").checked)return bad("a_err","w_a_terms",t("err_terms"));
  }else{
    if(!f.user)return bad("a_err","w_a_user",t("need_field",{f:t("f_login").toLowerCase()}));
    if(!pass)return bad("a_err","w_a_pass",t("need_field",{f:t("f_secret").toLowerCase()}));
  }
  c.busy=true;draw(false);W.wait(true);
  try{
    if(up)await W.db.account("signup",{username:f.user,password:pass,full_name:f.name,whatsapp:f.wa,email:f.email});
    else await W.db.signIn(f.user,pass);
    c.busy=false;await refreshMe();W.wait(false);closeAll();S.tab="me";render();
  }catch(x){W.wait(false);c.busy=false;var m=x.message;
    if(m==="duplicate"){c.dup=true;draw(false);return;}
    draw(false);
    if(m==="taken")bad("a_err","w_a_user",t("err_taken"));
    else if(m==="locked")bad("a_err",null,t("err_locked"));
    else if(m==="wrong")bad("a_err","w_a_pass",t("err_wrong",{n:(x.info&&x.info.left!=null)?x.info.left:"…"}));
    else if(m==="password")bad("a_err","w_a_pass",t("err_pass"));
    else bad("a_err",null,t("error"));}
});

/* ---------------- boot ---------------- */
function dataKey(){return JSON.stringify([S.shop,S.products.map(function(p){return [p.id,p.name,p.price,p.status,p.refreshed_at,p.thumbUrl,p.ordered,p.rating,p.description];})]);}
function useData(shop,products){
  S.shop=shop||{};S.products=products.filter(function(p){return p.status==="active";});S.loaded=true;
  fuse=window.Fuse?new Fuse(S.products.map(function(p){return Object.assign({catLabel:W.catLabel(p.category)+" "+(p.subcategory?W.catLabel(p.category,p.subcategory):"")},p);}),{keys:["name","description","catLabel"],threshold:.38,ignoreLocation:true}):null;
  var k=dataKey();if(k===S.dataKey&&$("#app main"))return;   /* same as what's on screen: don't redraw */
  S.dataKey=k;render();
}
async function fetchAll(){
  var shop;try{shop=await W.db.getShop()||{};}catch(e){shop={};}
  useData(shop,await W.db.listProducts(false));
}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,fetchAll);
W.watchNetwork(function(){fetchAll().catch(function(){});});
async function boot(){
  S.me=load("niagize.me",null);
  var o0=location.hash.match(/^#o-(.+)$/);
  if(o0){document.documentElement.classList.add("olink");openOrder(o0[1]);}
  /* instant open: show last time's shop straight away, then swap in fresh data quietly */
  var warm=null;try{warm=W.db.cached();}catch(_){}
  if(warm)useData(warm.shop,warm.products);else render();
  try{await W.guard(fetchAll(),15000);}catch(e){console.error(e);if(!warm){W.errorScreen(function(){location.reload();});return;}}
  try{await W.guard(refreshMe(),8000);}catch(e){}
  W.db.log("visit");
  checkOrders(true);document.addEventListener("visibilitychange",function(){if(!document.hidden)checkOrders(false);});
  var m=location.hash.match(/^#p-(.+)$/),o=location.hash.match(/^#o-(.+)$/);
  if(/[?&]go=me/.test(location.search)){S.tab="me";try{history.replaceState(null,"",location.pathname);}catch(_){}render();if(S.me&&S.me.needsProfile)open("complete",{f:{name:S.me.full_name||""}});}
  else if(m&&byId(m[1])){open("product",{id:m[1]});W.db.log("view",m[1]);}
  else if(o){if(!o0)openOrder(o[1]);}
  else if(!W.standalone()&&W.ls("niagize.inst")!=="1"&&S.products.length){open("tips",{panel:1});W.ls("niagize.inst","1");W.ls("winga.how","1");}
  else{var seen=W.ls("winga.how")==="1";if(!seen&&S.products.length){open("tips",{panel:0});W.ls("winga.how","1");}}
}
boot();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();

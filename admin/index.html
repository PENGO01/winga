/* ---------------- helpers ---------------- */
function owner(){return !!S.me&&(S.me.role==="boss"||S.me.role==="super_admin");}
function initials(n){return String(n||"B").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}
function isLive(p){return p.status==="active"&&W.daysLeft(p)>0;}
function steps(){return [!!W.waPhone(S.shop.whatsapp),S.products.length>=3,W.ls("winga.shared")==="1"];}
function priceTxt(p){return p.price!=null?"TSh "+W.money(p.price):t("askPrice");}
function stars(n){var s="";for(var i=1;i<=3;i++)s+=i<=n?"★":"<i>★</i>";return '<span class="stars">'+s+'</span>';}
function statePill(p){
  if(p.status==="hidden")return '<span class="pill ok" title="'+esc(t("hidden"))+'">'+IC.eyeOff+'</span>';
  if(p.status==="archived")return '<span class="pill soon">'+IC.archive+esc(t("archived"))+'</span>';
  if(p.status==="soldout")return '<span class="pill late">'+esc(t("soldout"))+'</span>';
  return "";
}
function hbtns(){
  return '<button class="hbtn" data-act="share" aria-label="'+esc(t("share"))+'">'+IC.share+'</button>'+
   '<button class="hbtn" data-act="lang" aria-label="'+esc(t("lang"))+'">'+(W.lang==="sw"?"SW":"EN")+'</button>'+
   '<button class="hbtn" data-act="theme" aria-label="'+esc(t("theme"))+'">'+(W.isDark()?IC.sun:IC.moon)+'</button>'+
   (owner()?'<button class="hbtn" data-act="steps" aria-label="'+esc(t("steps_title"))+'">'+IC.bulb+'</button>':'');
}
function orderTotal(o){return (o.subtotal||0)+(o.delivery_fee||0);}
function newCount(){return S.orders.filter(function(o){return o.status==="new";}).length;}

/* ---------------- shell ---------------- */
function shell(inner){
  var up=Q.total&&Q.done<Q.total?W.SUN+'<span class="upn">'+(Q.done+1)+'/'+Q.total+'</span>':"";
  var nm=(S.me&&S.me.name)||"Boss",n=newCount();
  return '<header class="top"><div class="mark">'+W.MARK+'<span class="t">Niagize</span></div>'+up+hbtns()+
   '<button class="hbtn av" data-act="profile" aria-label="'+esc(nm)+'">'+esc(initials(nm))+'</button></header>'+
   '<main><div class="ptr" id="ptr"></div>'+inner+'</main>'+
   (S.select&&S.tab==="products"?selbar():"")+
   '<nav class="tabs" aria-label="Menu"><div class="in">'+
   tabBtn("home",IC.home,t("home"))+tabBtn("orders",IC.inbox,t("nav_orders"),n)+
   '<label class="fab" for="pick"><span class="c">'+IC.cam+'</span><span class="l">'+esc(t("addPhotos"))+'</span></label>'+
   tabBtn("products",IC.grid,t("products"))+'<button class="tab" data-act="profile">'+IC.me+'<span>'+esc(nm.split(" ")[0])+'</span></button></div></nav>';
}
function tabBtn(id,icon,label,badge){return '<button class="tab" data-tab="'+id+'" aria-current="'+(S.tab===id?"page":"false")+'">'+icon+'<span>'+esc(label)+'</span>'+(badge?'<span class="bdg">'+badge+'</span>':'')+'</button>';}
function render(){
  var a=$("#app");
  if(S.stage==="login"){a.innerHTML=vLogin();return;}
  if(S.stage==="denied"){a.innerHTML='<div class="login"><div class="mark">'+W.MARK+'<span class="t">Niagize</span></div><div class="banner">'+esc(t("notAdmin"))+'</div><button class="mrow red" data-act="signout"><span class="fi">'+IC.out+'</span><span class="tt">'+esc(t("signOut"))+'</span></button></div>';return;}
  if(S.stage!=="ready"){a.innerHTML='<div class="boot">'+W.SUN+'</div>';return;}
  a.innerHTML=shell(S.tab==="products"?vProducts():S.tab==="orders"?vOrders():vHome());
  var q=$("#aq");if(q&&S.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);S.focusQ=false;}
}
function vLogin(){
  return '<form class="login" data-form="login"><div class="corner">'+'<button type="button" class="hbtn" data-act="lang">'+(W.lang==="sw"?"SW":"EN")+'</button><button type="button" class="hbtn" data-act="theme">'+(W.isDark()?IC.sun:IC.moon)+'</button></div>'+
   '<div class="mark" style="gap:12px">'+W.MARK.replace('class="brandmark"','class="brandmark" style="width:46px;height:46px"')+'<span class="t" style="font-size:28px">Niagize</span></div><div><h1>'+esc(t("boss_app"))+'</h1><div class="muted" style="margin-top:4px">'+esc(t("accountHint"))+'</div></div>'+
   '<label class="ifield">'+IC.user+'<input id="em" autocapitalize="none" autocomplete="username" required placeholder="'+esc(t("f_login"))+'" value="'+esc(S.email)+'"></label>'+
   '<label class="ifield">'+IC.lock+'<input id="pw" type="password" autocomplete="current-password" required placeholder="'+esc(t("f_secret"))+'"><button type="button" class="eye" data-act="eye" data-for="pw" aria-label="Show">'+IC.eye+'</button></label>'+
   '<div class="hint" id="lerr" style="color:var(--red)"></div>'+
   '<button class="btn primary block" type="submit" style="border-radius:999px">'+esc(t("login"))+'</button></form>';
}

/* ---------------- home: dashboard ---------------- */
function vHome(){
  var d=S.dash,live=S.products.filter(isLive).length,u=W.shopUrl();
  var h='<div class="sec-h" style="margin-top:14px"><span class="sdot '+S.status+'" title="'+esc(t("st_"+S.status))+'"></span><h2 class="small muted" style="font-family:var(--body);font-weight:500">'+live+' '+esc(t("d_live"))+'</h2>'+
   '<span class="period">'+[1,7,30].map(function(n){return '<button data-act="days" data-n="'+n+'" aria-pressed="'+(S.days===n)+'">'+(n===1?(W.lang==="sw"?"Leo":"Today"):n+(W.lang==="sw"?" siku":"d"))+'</button>';}).join("")+'</span></div>';
  if(!d)h+='<div class="card" style="display:grid;place-items:center;padding:30px">'+W.SUN+'</div>';
  else{
    var conv=d.visitors?Math.round(d.orders/d.visitors*1000)/10:0;
    h+='<section class="kpis">'+
     kpi(IC.money,t("d_sales"),'TSh '+W.money(d.sales),d.paid+' '+t("d_paid").toLowerCase())+
     kpi(IC.inbox,t("d_orders"),d.orders,d.new?'<b>'+d.new+' '+esc(t("d_new"))+'</b> · '+d.open+' '+esc(t("d_open").toLowerCase()):d.open+' '+esc(t("d_open").toLowerCase()),'goOrders')+
     kpi(IC.users,t("d_visitors"),d.visitors,d.views+' '+t("d_views").toLowerCase())+
     kpi(IC.trend,t("d_conv"),conv+'%',t("d_orders")+' ÷ '+t("d_visitors"))+'</section>';
    var max=Math.max(1,Math.max.apply(null,d.by_day.map(function(x){return x.orders;})));
    var bd=d.by_day.slice(-7);
    h+='<section class="card"><div class="row between"><b>'+esc(t("d_orders"))+'</b><span class="small muted">'+bd.length+(W.lang==="sw"?" siku":" days")+'</span></div><div class="bars">'+bd.map(function(x,i){var dd=new Date(x.d);
      return '<div class="b"><em>'+(x.orders||"")+'</em><i class="'+(i===bd.length-1?"today":"")+'" style="height:'+Math.max(3,Math.round(x.orders/max*80))+'px"></i><span>'+dd.toLocaleDateString(W.lang==="sw"?"sw-TZ":"en-GB",{weekday:"narrow"})+'</span></div>';}).join("")+'</div></section>';
    var top=Math.max(1,d.visitors);
    h+='<section class="card"><b>'+esc(t("d_funnel"))+'</b><div class="funnel" style="margin-top:10px">'+[[t("d_visitors"),d.visitors],[t("d_views"),d.views],[t("d_carts"),d.carts],[t("d_chats"),d.chats],[t("d_orders"),d.orders],[t("d_paid"),d.paid]].map(function(r){
      return '<div class="fr"><span>'+esc(r[0])+'</span><span class="tr"><i style="width:'+Math.min(100,Math.round(r[1]/top*100))+'%"></i></span><b>'+r[1]+'</b></div>';}).join("")+'</div></section>';
    if(d.top&&d.top.length)h+='<section class="card"><b>'+esc(t("d_top"))+'</b><div class="tops" style="margin-top:6px">'+d.top.map(function(p){return '<div class="t"><img src="'+esc(W.img(p.thumb))+'" alt=""><span class="grow" style="font-weight:500">'+esc(p.name)+'</span><span class="small muted num">'+p.ordered+' · '+p.views+'</span></div>';}).join("")+'</div></section>';
  }
  h+='<section class="qtiles">'+[["goOrders",IC.inbox,t("q_orders"),newCount()],["goArchive",IC.archive,t("q_archive"),S.products.filter(function(p){return p.status==="archived";}).length],["shareShop",IC.share,t("q_share")],["openShop",IC.store,t("q_shop")]].map(function(x){
    return '<button class="qt" data-act="'+x[0]+'"><span class="fi">'+x[1]+(x[3]?'<span class="bdg">'+x[3]+'</span>':'')+'</span>'+esc(x[2])+'</button>';}).join("")+'</section>';
  var lv=S.products.filter(isLive).slice(0,8),cells="";
  for(var i=0;i<8;i++)cells+=lv[i]?'<img src="'+esc(lv[i].thumbUrl)+'" alt="" loading="lazy">':'<span></span>';
  h+='<div class="sec-h"><button class="fi sm" data-act="openShop" aria-label="'+esc(t("q_shop"))+'">'+IC.eye+'</button><h2>'+esc(t("my_shop"))+'</h2><button class="iconbtn" data-act="openShop" aria-label="'+esc(t("q_shop"))+'">'+IC.chev+'</button></div><a class="preview" href="'+esc(u)+'" target="_blank" rel="noopener"><div class="pg">'+cells+'</div></a>';
  var ending=S.products.filter(function(p){return isLive(p)&&W.daysLeft(p)<=7;}).sort(function(a,b){return W.daysLeft(a)-W.daysLeft(b);});
  if(ending.length)h+='<div class="sec-h"><h2>'+esc(t("t_ending"))+'</h2></div><div class="list">'+ending.slice(0,6).map(function(p){
    return '<div class="li"><img class="thumb" src="'+esc(p.thumbUrl)+'" alt=""><div class="grow"><div class="t">'+esc(p.name)+'</div><div class="s">'+esc(priceTxt(p))+'</div></div><button class="btn sm ghost" data-act="still" data-id="'+p.id+'" style="border-radius:999px">'+esc(t("stillHere"))+'</button><button class="fi sm" data-act="sold" data-id="'+p.id+'" aria-label="'+esc(t("markSold"))+'">'+IC.sold+'</button></div>';}).join("")+'</div>';
  if(!S.products.length)h+='<div class="empty">'+esc(t("emptyHome"))+'</div>';
  return h;
}
function kpi(icon,label,value,sub,act){return '<button class="kpi"'+(act?' data-act="'+act+'"':' disabled style="opacity:1"')+'><span class="l"><span class="fi">'+icon+'</span>'+esc(label)+'</span><span class="v">'+esc(value)+'</span><span class="s">'+sub+'</span></button>';}

}

/* ---------------- products ---------------- */
function visible(){
  var q=S.q.trim().toLowerCase();
  return S.products.filter(function(p){
    if(S.filter==="hidden"&&p.status!=="hidden")return false;
    if(S.filter==="archived"&&p.status!=="archived")return false;
    if(S.filter==="all"&&p.status==="archived")return false;
    if(S.cat&&p.category!==S.cat)return false;
    if(q){var hay=(p.name+" "+(p.description||"")+" "+W.catLabel(p.category)+" "+(p.tags||[]).map(function(x){return "#"+x;}).join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}
function vProducts(){
  var list=visible();
  var h='<div class="ph"><h1>'+esc(t("list_title"))+'</h1><span class="muted small num">'+list.length+'</span>'+
   '<button class="ibtn" data-act="selectMode" aria-pressed="'+S.select+'" aria-label="Select">'+IC.selectSq+'</button></div>'+
   '<div class="tools"><div class="chips">'+[["all",t("all")],["hidden",t("f_hidden")],["archived",t("f_archive")]].map(function(f){return '<button class="chip" data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+esc(f[1])+'</button>';}).join("")+
    (S.cat?'<button class="chip" data-act="clearCat" aria-pressed="true">'+esc(W.catLabel(S.cat))+IC.x+'</button>':'')+
   '</div><button class="icon-btn" data-act="cats" aria-label="Filter">'+IC.filter+(S.cat?'<span class="dot"></span>':'')+'</button></div>'+
   '<label class="ifield">'+IC.search+'<input id="aq" type="search" placeholder="'+esc(t("searchPh"))+' / #tag" value="'+esc(S.q)+'" autocomplete="off"></label>';
  if(S.filter==="archived")h+='<div class="hint">'+esc(t("archive_hint"))+'</div>';
  if(!list.length)return h+'<div class="empty">'+esc(t("noProducts"))+'</div>';

function enqueue(data,files){Q.jobs.push({data:data,files:files});Q.total++;render();run();}
async function run(){
  if(Q.running)return;Q.running=true;var ok=0;
  while(Q.jobs.length){
    var j=Q.jobs[0];
    try{var p=await W.db.createProduct(j.data,await W.prepPhotos(j.files));S.products.unshift(p);ok++;}
    catch(e){W.toast(t("upload_fail",{x:j.data.name}));console.error(e);}
    Q.jobs.shift();Q.done++;render();
  }
  if(ok)W.toast(t("savedN",{n:ok}));
  Q.done=0;Q.total=0;Q.running=false;render();
}

function invoiceText(o){
  var lines=[t("inv_hi",{name:(o.customer_name||"").split(" ")[0]||"",code:o.code}).replace("  "," "),""];
  o.items.forEach(function(i){lines.push("• "+i.qty+" × "+i.name+(i.price!=null?" — TSh "+W.money(i.price*i.qty):""));});
  if(o.delivery_fee!=null)lines.push("• "+t("del_"+o.delivery)+" — TSh "+W.money(o.delivery_fee));
  lines.push("*"+t("cart_total")+": TSh "+W.money(orderTotal(o))+"*","",t("inv_pay"));
  (S.shop.payments||[]).filter(function(p){return p.number;}).forEach(function(p){lines.push(p.provider+": *"+p.number+"*"+(p.name?" ("+p.name+")":""));});
  lines.push("",t("inv_after"),W.shopUrl()+"#o-"+o.code);
  return lines.join("\n");
}

function byId(id){return S.products.find(function(p){return p.id===id;});}
function readAll(){readFields(A||E);readSettings();readTeam();if(B)readBulk();}
async function shareShop(){

document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-act],[data-tab]");if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;S.select=false;S.sel=[];render();scrollTo(0,0);if(S.tab==="orders")reloadOrders();return;}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="scrim"){if(e.target===el&&POP[stack[stack.length-1]])back();return;}
  try{switch(a){
    case "back":readAll();back();break;
    case "theme":readAll();W.toggleTheme();render();draw(false);break;
    case "lang":readAll();W.setLang(W.lang==="sw"?"en":"sw");render();draw(false);break;
    case "eye":var f=$("#"+el.dataset.for),show=f.type==="password";f.type=show?"text":"password";el.innerHTML=show?IC.eyeOff:IC.eye;break;
    case "signout":await W.db.signOut();closeAll();S.stage="login";render();break;
    case "resetDemo":W.db.resetDemo();closeAll();await load();break;
    case "profile":open("profile");break;
    case "share":open("share");break;
    case "markShared":W.ls("winga.shared","1");break;
    case "settings":D={whatsapp:S.shop.whatsapp||"",fee_fasta:S.shop.fee_fasta,fee_leo:S.shop.fee_leo,payments:JSON.parse(JSON.stringify(S.shop.payments||[]))};if(!D.payments.length)D.payments.push({provider:"M-PESA",number:"",name:""});
      if(stack[stack.length-1]==="steps")stack.pop();open("settings");break;
    case "team":T={name:"",email:"",pw:""};if(POP[stack[stack.length-1]])stack.pop();open("team");loadTeam();break;
    case "pin":K={user:(S.me&&S.me.username)||""};open("pin");break;
    case "steps":open("steps");break;
    case "pickPhotos":closeAll();$("#pick").click();break;
    case "shareShop":await shareShop();break;
    case "copyLink":W.copy(W.shopUrl(),$("#shopUrl"));break;
    case "openShop":window.open(W.shopUrl(),"_blank","noopener");break;
    case "days":S.days=+el.dataset.n;S.dash=null;render();loadDash();break;
    case "goOrders":S.tab="orders";S.ofilter=newCount()?"new":"open";render();scrollTo(0,0);break;
    case "goArchive":S.tab="products";S.filter="archived";render();scrollTo(0,0);break;
    case "reloadOrders":await reloadOrders();break;
    case "ofilter":S.ofilter=el.dataset.f;render();break;
    case "openOrder":await openOrder(el.dataset.code);break;
    case "savePhone":var ph=$("#o_phone").value;O.phone=ph;O.o=await W.db.setOrder(O.o.code,O.o.status,{phone:W.waPhone(ph)});W.toast(t("saved"));draw(false);break;
    case "nextStep":var st=O.o.status,nx=NEXT[st];
      if(nx==="paid"){open("paid");break;}
      await moveOrder(nx,{},nx==="progress"?"msg_progress":nx==="invoiced"?"invoice":nx==="done"?"msg_done":null);break;
    case "resendInvoice":window.open(W.wa(O.o.customer_phone,invoiceText(O.o)),"_blank","noopener");break;
    case "confirmPaid":var ref=$("#p_ref").value.trim(),pn=$("#p_name").value.trim();stack.pop();await moveOrder("paid",{pay_ref:ref,pay_name:pn},"msg_paid");break;
    case "cancelOrder":open("cancel");break;
    case "cancelWith":stack.pop();await moveOrder("cancelled",{reason:t(el.dataset.r)},"msg_cancel");break;
    case "still":await W.db.refresh(id);var p=byId(id);p.refreshed_at=new Date().toISOString();p.status="active";render();break;
    case "sold":await W.db.updateProduct(id,{status:"soldout"});byId(id).status="soldout";W.toast(t("saved"));render();break;
    case "filter":S.filter=el.dataset.f;render();break;
    case "cats":open("cats");break;
    case "setCat":S.cat=el.dataset.cat;back();render();break;
    case "clearCat":S.cat="";render();break;
    case "selectMode":S.select=!S.select;S.sel=[];render();break;
    case "card":
      if(S.select){var k=S.sel.indexOf(id);if(k>=0)S.sel.splice(k,1);else S.sel.push(id);render();}
      else openEdit(byId(id));break;
    case "editSel":
      if(S.sel.length===1)openEdit(byId(S.sel[0]));
      else{B={items:S.sel.map(function(i){var p=byId(i);return {p:p,price:p.price,hide:p.status==="hidden",arch:p.status==="archived"};})};open("bulk");}
      break;
    case "pickCat":var o=A||E;readFields(o);o.cat=el.dataset.cat;o.sub=W.subs(o.cat)[0]||null;draw(false);break;
    case "pickSub":var o2=A||E;readFields(o2);o2.sub=el.dataset.sub;draw(false);break;
    case "rate":var o3=A||E;readFields(o3);o3.rating=+el.dataset.n;draw(false);break;
    case "rmPhoto":var i=+el.dataset.i;
      if(A){readFields(A);A.photos.splice(i,1);}
      else if(E){readFields(E);if(i<E.keep.length)E.keep.splice(i,1);else E.add.splice(i-E.keep.length,1);}
      draw(false);break;
    case "useQueued":readFields(A);if(A.photos.length<W.MAX_PHOTOS)A.photos.push(A.queue.splice(+el.dataset.i,1)[0]);draw(false);break;
    case "addMore":readFields(A);if(!addValid())break;commitAdd();
      var keep={cat:A.cat,sub:A.sub,rating:A.rating};A=newA(A.queue,A.saved);Object.assign(A,keep);if(A.queue.length)A.photos.push(A.queue.shift());draw(false);
      var bd=$(".sheet .bd");if(bd)bd.scrollTop=0;if(!A.photos.length)$("#more").click();break;
    case "addDone":readFields(A);
      if(!A.photos.length&&!A.name.trim()){closeAll();break;}
      if(!addValid())break;commitAdd();closeAll();break;
    case "tgHide":readFields(E);E.status=E.status==="hidden"?"active":"hidden";draw(false);break;
    case "tgSold":readFields(E);E.status=E.status==="soldout"?"active":"soldout";draw(false);break;
    case "tgArchive":readFields(E);E.status=E.status==="archived"?"active":"archived";draw(false);break;
    case "unarchive":await W.db.unarchive(id);var up=byId(id);up.status="active";up.refreshed_at=new Date().toISOString();W.toast(t("unarchived"));closeAll();render();break;
    case "saveEdit":readFields(E);await saveEdit();break;
    case "bHide":readBulk();var r1=B.items[+el.dataset.i];r1.hide=!r1.hide;if(r1.hide)r1.arch=false;draw(false);break;
    case "bArch":readBulk();var r2=B.items[+el.dataset.i];r2.arch=!r2.arch;if(r2.arch)r2.hide=false;draw(false);break;
    case "saveBulk":readBulk();await saveBulk();break;
    case "askDelOne":readFields(E);C={items:[E.p]};open("confirm");break;
    case "askDelSel":if(B)readBulk();C={items:S.sel.map(byId)};open("confirm");break;
    case "rmMember":readTeam();C={member:S.team.find(function(m){return m.user_id===id;})};open("confirm");break;
    case "yesDel":
      if(C.member){await W.db.team("remove",{user_id:C.member.user_id});S.team=S.team.filter(function(m){return m.user_id!==C.member.user_id;});W.toast(t("team_removed"));back();break;}
      for(var d=0;d<C.items.length;d++){var it=C.items[d];await W.db.deleteProduct(it);S.products=S.products.filter(function(x){return x!==it;});}
      S.select=false;S.sel=[];closeAll();W.toast(t("saved"));render();break;
    case "addPay":readSettings();D.payments.push({provider:"M-PESA",number:"",name:""});draw(false);break;
    case "rmPay":readSettings();D.payments.splice(+el.dataset.i,1);draw(false);break;
    case "saveSettings":readSettings();await saveSettings();break;
    case "addMember":readTeam();await addMember();break;
    case "savePin":await savePin();break;
  }}catch(err){console.error(err);W.toast(t(err&&err.message==="exists"?"team_exists":"error"));}
});
async function saveEdit(){
  if(!E.name.trim()){W.toast(t("need_name"));return;}
  if(!E.keep.length&&!E.add.length){W.toast(t("need_photo"));return;}
  var p=E.p,patch=productData(E);patch.status=E.status;
  if(E.status==="active"&&p.status==="archived")patch.refreshed_at=new Date().toISOString();
  var changedPhotos=E.add.length||E.keep.length!==(p.images||[]).length;
  if(changedPhotos)await W.db.setPhotos(p,E.keep,await W.prepPhotos(E.add));
  await W.db.updateProduct(p.id,patch);Object.assign(p,patch);
  if(changedPhotos){var fresh=(await W.db.listProducts(true)).find(function(x){return x.id===p.id;});if(fresh)Object.assign(p,fresh);}
  S.select=false;S.sel=[];closeAll();W.toast(t("saved"));render();
}
async function saveBulk(){
  var now=new Date().toISOString();
  var rows=B.items.map(function(r){var was=r.p.status,st=r.arch?"archived":r.hide?"hidden":(was==="hidden"||was==="archived"?"active":was);var patch={price:W.parseMoney(r.price),status:st};if(was==="archived"&&st!=="archived")patch.refreshed_at=now;return {id:r.p.id,p:r.p,patch:patch};});
  await W.db.updateMany(rows);rows.forEach(function(r){Object.assign(r.p,r.patch);});
  S.select=false;S.sel=[];closeAll();W.toast(t("saved"));render();
}
async function saveSettings(){
  var pays=D.payments.filter(function(p){return String(p.number||"").trim();}).map(function(p){return {provider:p.provider,number:String(p.number).trim(),name:String(p.name||"").trim()};});
  var patch={whatsapp:W.waPhone(D.whatsapp)||D.whatsapp.trim(),payments:pays,fee_fasta:W.parseMoney(D.fee_fasta),fee_leo:W.parseMoney(D.fee_leo)};
  if(pays[0]){patch.lipa=pays[0].number;patch.lipa_name=pays[0].name;patch.network=pays[0].provider;}
  var saved=await W.db.saveShop(patch);S.shop=Object.assign(S.shop,saved||patch);
  back();W.toast(t("saved"));render();
}
async function addMember(){
  if(!T.name.trim()){W.toast(t("team_name"));return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(T.email.trim())){W.toast("Email");return;}
  if(T.pw.length<8){W.toast(t("team_pw"));return;}
  var btn=$("[data-act=addMember]");if(btn)btn.disabled=true;
  try{await W.db.team("add",{name:T.name.trim(),email:T.email.trim().toLowerCase(),password:T.pw});T={name:"",email:"",pw:""};W.toast(t("team_added"));await loadTeam();}
  finally{var b2=$("[data-act=addMember]");if(b2)b2.disabled=false;}
}
async function savePin(){
  var u=$("#k_user").value.trim().toLowerCase(),p1=$("#k_pin").value,p2=$("#k_pin2").value,err=$("#k_err");
  K.user=u;
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){err.textContent=t("err_user");return;}
  if(!/^\d{6}$/.test(p1)){err.textContent=t("err_pin");return;}
  if(p1!==p2){err.textContent=t("err_pin2");return;}
  try{await W.db.account("set_pin",{username:u,pin:p1});if(S.me)S.me.username=u;W.toast(t("pin_done"));back();}
  catch(e){err.textContent=e.message==="taken"?t("err_taken"):t("error");}
}
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="f_ask"){readFields(A||E);draw(false);return;}
  if(el.id==="pick"){var fs=Array.from(el.files||[]);el.value="";if(fs.length)startAdd(fs);return;}
  if(el.id==="more"){
    var fs2=Array.from(el.files||[]);el.value="";if(!fs2.length)return;
    if(A){readFields(A);var room=W.MAX_PHOTOS-A.photos.length;A.photos=A.photos.concat(fs2.slice(0,room));A.queue=fs2.slice(room).concat(A.queue);}
    else if(E){readFields(E);var room2=W.MAX_PHOTOS-E.keep.length-E.add.length;E.add=E.add.concat(fs2.slice(0,room2));}
    draw(false);
  }
});
document.addEventListener("input",function(e){if(e.target.id==="aq"){S.q=e.target.value;S.focusQ=true;render();}});
document.addEventListener("submit",async function(e){
  if(e.target.dataset.form!=="login")return;e.preventDefault();

  var btn=e.target.querySelector("[type=submit]");btn.disabled=true;err.textContent="";

  catch(x){console.error(x);btn.disabled=false;var m=x.message;err.textContent=m==="locked"?t("err_locked"):m==="wrong"?t("err_wrong",{n:(x.info&&x.info.left!=null)?x.info.left:"…"}):t("wrongLogin");}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&stack.length){readAll();back();}});

/* ---------------- boot ---------------- */
async function loadDash(){try{S.dash=await W.db.dashboard(S.days);}catch(e){console.error(e);S.dash={visitors:0,views:0,carts:0,chats:0,orders:0,paid:0,sales:0,open:0,new:0,by_day:[],top:[]};}if(S.tab==="home")render();}
async function reloadOrders(){try{S.orders=await W.db.orders();}catch(e){console.error(e);}render();}
async function load(){
  var r=await Promise.all([W.db.getShop(),W.db.listProducts(true),W.db.me(),W.db.ping(),W.db.orders().catch(function(){return [];})]);
  S.shop=r[0]||{};S.products=r[1];S.me=r[2];S.status=r[3];S.orders=r[4];S.stage="ready";render();
  loadDash();
  if(S.pendingOrder){var c=S.pendingOrder;S.pendingOrder=null;S.tab="orders";render();openOrder(c);}
}
async function afterAuth(){if(!(await W.db.isAdmin())){S.stage="denied";render();return;}await load();}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,async function(){if(S.stage==="ready"&&!stack.length)await load();});
var om=location.hash.match(/^#o-(.+)$/);if(om)S.pendingOrder=decodeURIComponent(om[1]);
async function boot(){
  render();
  try{var s=await W.db.session();if(!s){S.stage="login";render();return;}await afterAuth();}
  catch(e){console.error(e);S.status="down";if(S.stage==="boot"){W.errorScreen(boot);}else{S.stage="login";render();}}
}
boot();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});}catch(e){}}
})();

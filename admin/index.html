<style>
/* Boss side v2: Shopify-style dashboard, orders, products. Framed icons, back arrows, quiet colour. */
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:10px var(--gr) 10px var(--gl);padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;overflow:hidden}
header.top .mark{margin-right:auto}
header.top .sunload{width:26px;height:26px}
.upn{font-family:var(--num);font-size:12px;color:var(--jua);font-weight:600;margin-left:-2px;margin-right:4px;position:relative;z-index:1}
main{padding:0 var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:center;gap:8px;margin-top:4px}
.sec-h h2{font-size:16px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
/* dashboard */
.period{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.period button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--dim)}
.period button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink)}
.kpi .l{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.kpi .l .fi{width:26px;height:26px}.kpi .l .fi svg{width:14px;height:14px}
.kpi .v{font-family:var(--num);font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi .s b{color:var(--blue)}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--ocean);min-height:3px}
:root[data-theme="dark"] .bars .b i{background:#2E4E6E}
:root[data-theme="dark"] .bars .b i.today{background:var(--jua)}
.bars .b i.today{background:var(--jua)}
.bars .b span{font-size:10.5px;color:var(--faint);font-family:var(--num)}
.bars .b em{font-style:normal;font-size:10.5px;font-family:var(--num);color:var(--dim)}
.funnel{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:13px}
.fr .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fr .tr i{display:block;height:100%;background:var(--jua);border-radius:5px}
.fr b{font-family:var(--num);text-align:right;font-weight:600}
.tops .t{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tops .t:first-child{border-top:0}
.tops img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.qtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 4px}
.qt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font-size:12px;font-weight:500;position:relative;text-align:center}
.qt .fi{width:48px;height:48px}.qt .fi svg{width:22px;height:22px}
.preview{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.preview .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.preview .pg img,.preview .pg span{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px;background:var(--sunk);display:block}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none}
/* orders */
.oc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink)}
.oc .th{display:flex;flex:none}
.oc .th img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:2px solid var(--card);margin-left:-12px;background:var(--sunk)}
.oc .th img:first-child{margin-left:0}
.oc .c{font-family:var(--num);font-weight:600}
.oc .m{font-size:12.5px;color:var(--dim)}
.oc .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.oc .r b{font-family:var(--num);font-size:13.5px}
.oc.new{border-color:var(--blue)}
.ci{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ci:first-child{border-top:0}
.ci img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--sunk)}
.ci .n{font-weight:600;font-size:14px;line-height:1.25}
.ci .p{font-family:var(--num);font-size:12.5px;color:var(--dim)}
.ci b{font-family:var(--num);font-size:13.5px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.total b{font-family:var(--num);font-size:19px}
.cust{display:flex;align-items:center;gap:10px}
.cust .av{width:42px;height:42px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.nextbar{display:flex;gap:8px}
.nextbar .btn{flex:1;border-radius:999px;min-height:50px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
/* products */
.ph{display:flex;align-items:center;gap:10px;padding-top:14px}
.ph h1{font-size:22px;flex:1}
.tools{display:flex;align-items:center;gap:8px}
.tools .chips{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;color:var(--ink)}
.pcard .popen{all:unset;display:block;cursor:pointer;position:relative}
.pcard .pacts{display:flex;justify-content:flex-end;gap:8px;padding:0 10px 10px}
.pcard .pr.noprice{color:var(--red);font-family:var(--body);font-size:12.5px}
.pcard img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--sunk);display:block}
.pcard .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pcard .pr{font-family:var(--num);font-weight:600;font-size:13.5px}
.pcard .meta{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:11px;color:var(--faint)}
.pcard .tag{position:absolute;left:8px;top:8px}
.pcard.dim img{opacity:.55}
.pill svg{width:13px;height:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);border-top:1px solid #262626;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:66px}
nav.tabs button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:#9A9A9A;height:100%;justify-content:center;position:relative}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--cyan);font-weight:600}
nav.tabs .bdg{position:absolute;top:8px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--jua);color:#121212;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--num)}
.fab{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-28px;cursor:pointer}
.fab span.c{width:58px;height:58px;border-radius:50%;background:var(--jua);border:4px solid var(--navy);box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center;color:#121212}
.fab span.c svg{width:25px;height:25px}
.fab span.l{font-size:10.5px;font-weight:600;color:#fff}
.fileHidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--sunk);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--dim);cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.full{border-style:solid}
.slot.off{opacity:.45;cursor:default}
.slot .rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(18,18,18,.72);color:#fff;display:grid;place-items:center}
.slot .rm svg{width:15px;height:15px}
.slot>svg{width:26px;height:26px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.subpick .chip{padding:5px 11px;font-size:12.5px;background:transparent}
.subpick .chip[aria-pressed="true"]{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.ratepick{display:flex;gap:8px}
.ratepick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:6px}
.ratepick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.ft2{display:flex;gap:8px}
.ft2 .btn{flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--dim)}
.ibtn svg{width:19px;height:19px}
.ibtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .ibtn[aria-pressed="true"]{background:var(--jua);border-color:var(--jua);color:#12283C}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.prof .ring{width:96px;height:96px;border-radius:50%;padding:4px;background:var(--jua)}
.prof .ring span{width:100%;height:100%;border-radius:50%;background:#121212;color:var(--jua);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:32px;border:3px solid var(--paper)}
.prof .nm{font-family:var(--display);font-weight:800;font-size:20px;text-align:center}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--ink)}
.mrow .fi{width:34px;height:34px}.mrow .fi svg{width:17px;height:17px}
.mrow .chev{width:18px;height:18px;color:var(--faint);margin-left:auto}
.mrow .tt{font-weight:600}.mrow .ss{font-size:12.5px;color:var(--dim)}
.mrow.red{color:var(--red)}
.pay{display:grid;grid-template-columns:1fr auto;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.pay select,.pay input{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 10px;min-height:40px;outline:none;width:100%}
.pay .two{grid-column:1/-1;gap:6px}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .avs{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:600;background:var(--sunk);flex:none}
.step.done .n{background:var(--green);color:#fff}.step.done .tt{text-decoration:line-through;color:var(--dim)}
.step .tt{font-weight:600}.step .ss{font-size:12.5px;color:var(--dim)}
.delbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:6px 0}
.delbox .big{width:64px;height:64px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;position:relative}
.delbox .big svg{width:30px;height:30px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px var(--gr) 24px var(--gl);max-width:440px;margin:0 auto;position:relative}
.login .corner{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:var(--gr);display:flex;gap:8px}
.login .corner .hbtn{background:var(--sunk);color:var(--ink)}
.eye{border:0;background:none;color:var(--dim);display:grid;place-items:center;padding:4px}
.eye svg{width:20px;height:20px}
.sharebox{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:10px 10px 10px 14px}
.sharebox .u{font-family:var(--num);font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
/* v2.1 */
.kpi.sales{background:var(--ocean);border-color:var(--ocean);color:#fff}
.kpi.sales .v{color:var(--jua)} .kpi.sales .l,.kpi.sales .s{color:#B7CADB} .kpi.sales .fi{background:rgba(255,255,255,.1);color:var(--jua)}
.osearch{display:flex;align-items:center;gap:6px;flex:1;min-width:0;max-width:220px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;height:38px;padding:0 12px}
.osearch svg{width:16px;height:16px;color:var(--dim);flex:none}
.osearch input{border:0;outline:none;background:transparent;min-width:0;flex:1;font-family:var(--num);text-transform:uppercase}
.osearch input::placeholder{font-family:var(--body);text-transform:none}
.ph h1{flex:0 0 auto}
.subchips .chip{background:transparent;border-color:transparent;color:var(--dim);padding:4px 10px;font-size:12.5px}
.subchips .chip[aria-pressed="true"]{background:var(--sunk);border-color:var(--sunk);color:var(--ink)}
.feerow{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.feerow.bad{border-color:var(--red);background:var(--red-soft)}
.feerow .grow{display:flex;flex-direction:column}
.feerow input{border:0;outline:none;background:transparent;width:100%;padding:2px 0;font-family:var(--num);font-weight:600}
.feerow input::placeholder{font-family:var(--body);font-weight:400;color:var(--faint)}
.ci .note{font-size:12px;color:var(--dim);background:var(--sunk);border-radius:8px;padding:3px 8px;margin-top:3px;display:inline-block}
.catpick.bad{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}
.slots.bad{outline:2px solid var(--red);outline-offset:4px;border-radius:14px}
.sendbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.sendbtn svg{width:19px;height:19px}
.spinning svg{animation:spin .8s linear infinite}
.login .brandmark{display:block}
</style>
</head>

/* ---------------- helpers ---------------- */
function owner(){return !!S.me&&(S.me.role==="boss"||S.me.role==="super_admin");}

function isLive(p){return p.status==="active"&&W.daysLeft(p)>0;}
function steps(){return [!!W.waPhone(S.shop.whatsapp),S.products.length>=3,W.ls("winga.shared")==="1"];}
function priceTxt(p){return p.price!=null?"TSh "+W.money(p.price):t("noPrice");}
function stars(n){var s="";for(var i=1;i<=3;i++)s+=i<=n?"★":"<i>★</i>";return '<span class="stars">'+s+'</span>';}
function chev(){return IC.chev.replace('<svg','<svg class="chev"');}
function hbtns(){
  return '<button class="hbtn" data-act="lang" aria-label="'+esc(t("lang"))+'">'+(W.lang==="sw"?"SW":"EN")+'</button>'+

}
function newCount(){return S.orders.filter(function(o){return o.status==="new";}).length;}
function loader(){return '<div style="display:grid;place-items:center;padding:40px">'+W.SUN+'</div>';}
/* name the missing field, mark it, stop */
function bad(errId,wrapId,msg){
  document.querySelectorAll(".ifield.bad,.catpick.bad").forEach(function(x){x.classList.remove("bad");});
  var e=$("#"+errId);if(e)e.textContent=msg||"";else if(msg)W.toast(msg);
  var w=wrapId&&$("#"+wrapId);if(w){w.classList.add("bad");var i=w.querySelector("input,textarea");if(i)i.focus();w.scrollIntoView&&w.scrollIntoView({block:"center",behavior:"smooth"});}
  return false;
}

function shell(inner){
  var up=Q.total&&Q.done<Q.total?W.SUN+'<span class="upn">'+(Q.done+1)+'/'+Q.total+'</span>':"";
  var nm=(S.me&&S.me.name)||"Boss",n=newCount();
  return '<header class="top"><div class="mark">'+W.MARK+'<span class="t">Niagize</span></div>'+up+hbtns()+
   '<button class="hbtn av" data-act="profile" aria-label="'+esc(nm)+'">'+esc(initials(nm))+'</button></header>'+
   '<main><div class="ptr" id="ptr"></div>'+inner+'</main>'+
   '<nav class="tabs" aria-label="Menu"><div class="in">'+
   tabBtn("home",IC.home,t("home"))+tabBtn("orders",IC.inbox,t("nav_orders"),n)+
   '<label class="fab" for="pick"><span class="c">'+IC.cam+'</span><span class="l">'+esc(t("addPhotos"))+'</span></label>'+
   tabBtn("products",IC.grid,t("products"))+'<button class="tab" data-act="profile">'+IC.me+'<span>'+esc(nm.split(" ")[0])+'</span></button></div></nav>';

function tabBtn(id,icon,label,badge){return '<button class="tab" data-tab="'+id+'" aria-current="'+(S.tab===id?"page":"false")+'">'+icon+'<span>'+esc(label)+'</span>'+(badge?'<span class="bdg">'+badge+'</span>':'')+'</button>';}
function render(){
  var a=$("#app");
  if(S.stage==="login"){a.innerHTML=vLogin();return;}
  if(S.stage==="denied"){a.innerHTML='<div class="login"><div class="mark">'+W.MARK+'<span class="t">Niagize</span></div><div class="banner">'+esc(t("notAdmin"))+'</div><button class="mrow red" data-act="signout"><span class="fi red">'+IC.out+'</span><span class="tt">'+esc(t("signOut"))+'</span></button></div>';return;}
  if(S.stage!=="ready"){a.innerHTML=W.splash("Niagize");return;}
  var oq=document.activeElement&&document.activeElement.id;
  a.innerHTML=shell(S.tab==="products"?vProducts():S.tab==="orders"?vOrders():vHome());
  if(oq==="aq"||oq==="oq"){var q=$("#"+oq);if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
}

function takePhotos(list,files){var room=W.MAX_PHOTOS-list.length,took=files.slice(0,Math.max(0,room));if(files.length>took.length)W.toast(t("photos_drop",{n:took.length}));return list.concat(took);}

function enqueue(data,files){Q.jobs.push({data:data,files:files});Q.total++;render();run();}
async function run(){
  if(Q.running)return;Q.running=true;var ok=0;
  while(Q.jobs.length){
    var j=Q.jobs[0];
    try{var p=await W.db.createProduct(j.data,await W.prepPhotos(j.files));S.products.unshift(p);ok++;}
    catch(e){W.toast(t("upload_fail",{x:j.data.name}));console.error(e);}
    Q.jobs.shift();Q.done++;render();
  }
  if(ok)W.toast(t("savedN",{n:ok}));
  Q.done=0;Q.total=0;Q.running=false;render();
}

function invoiceText(o){
  var nm=(o.customer_name||"").split(" ")[0];
  var lines=[t("inv_hi",{name:nm||(W.lang==="sw"?"Habari":"Hello"),code:o.code}),""];
  o.items.forEach(function(i){lines.push("• "+i.qty+" × "+i.name+(i.price!=null?" — TSh "+W.money(i.price*i.qty):"")+(i.note?" ("+i.note+")":""));});
  if(o.delivery_fee!=null)lines.push("• "+t("fee_name")+" — TSh "+W.money(o.delivery_fee));
  lines.push("*"+t("cart_total")+": TSh "+W.money(W.total(o))+"*");
  var pays=(S.shop.payments||[]).filter(function(p){return p.number;});
  if(pays.length){lines.push("",t("inv_pay"));pays.forEach(function(p){lines.push(p.provider+": *"+p.number+"*"+(p.name?" ("+p.name+")":""));});}
  lines.push("",t("inv_after"),"",t("inv_track"),W.shopUrl()+"#o-"+o.code);
  return lines.join("\n");
}
async function openOrder(code){
  O={loading:true,o:null};if(stack[stack.length-1]!=="order")open("order");else draw(false);
  try{history.replaceState(null,"","#o-"+code);}catch(e){}
  try{O.o=await W.db.getOrder(code);}catch(e){console.error(e);}O.loading=false;draw(false);
  /* opening a new order starts the 2-minute clock; the server moves it to "Inafanyiwa kazi" */
  if(O.o&&O.o.status==="new"&&!O.o.seen_at){try{var r=await W.db.setOrder(O.o.code,"new",{seen:true});if(O&&O.o&&O.o.code===r.code){O.o=r;draw(false);}}catch(e){console.error(e);}}
  clearInterval(S.oTimer);
  S.oTimer=setInterval(async function(){
    if(!O||!O.o||O.o.status!=="new"||stack[stack.length-1]!=="order")return;
    try{await W.db.orders();var r2=await W.db.getOrder(O.o.code);if(O&&O.o&&r2&&r2.status!==O.o.status){keepFee();O.o=r2;draw(false);syncList(r2);}}catch(e){}
  },20000);
}
function keepFee(){var f=$("#o_fee");if(f&&O)O.fee=f.value;var c=$("#c_reason");if(c&&O)O.reason=c.value;}
function syncList(r){var i=S.orders.findIndex(function(x){return x.code===r.code;});if(i>=0){["status","delivery_fee","agreed_total","seen_at","pay_ref","pay_name","cancel_reason"].forEach(function(k){S.orders[i][k]=r[k];});}render();}
async function moveOrder(status,extra,msgKey){
  var o=O.o;extra=extra||{};keepFee();
  if(O.fee!=null&&String(O.fee).trim()!=="")extra.fee=W.parseMoney(O.fee);
  var w=null;if(msgKey&&o.customer_phone){try{w=window.open("","_blank");}catch(e){}}
  var r=await W.db.setOrder(o.code,status,extra);O.o=r;O.fee=null;O.cancelling=false;
  var text=null;
  if(msgKey==="invoice")text=invoiceText(r);
  else if(msgKey==="msg_cancel")text=t("msg_cancel",{code:r.code,reason:extra.reason});
  else if(msgKey)text=t(msgKey,{code:r.code})+(msgKey==="msg_done"?"\n"+W.shopUrl():"");
  if(w&&text)w.location.href=W.wa(r.customer_phone,text);else if(w)w.close();
  syncList(r);draw(false);
}

    case "nextStep":
      var st=O.o.status,nx=NEXT[st];keepFee();

      await moveOrder("cancelled",{reason:why},"msg_cancel");break;

    case "saveEdit":readFields(E);await saveEdit();break;
    case "askDelOne":readFields(E);C={items:[E.p]};open("confirm");break;
    case "rmMember":readTeam();C={member:S.team.find(function(m){return m.user_id===id;})};open("confirm");break;
    case "shareMember":var sm=S.team.find(function(m){return m.user_id===id;}),login=sm.username?"@"+sm.username:sm.email;
      var msg=t("team_share_msg",{name:sm.name.split(" ")[0],url:W.adminUrl(),login:login});
      if(navigator.share){navigator.share({text:msg}).catch(function(){});}else window.open(W.wa("",msg),"_blank","noopener");break;
    case "resetMember":readTeam();R={m:S.team.find(function(m){return m.user_id===id;}),pw:""};open("reset");break;
    case "saveReset":var np=$("#r_pw").value;R.pw=np;if(np.length<6)return bad("r_err","w_r_pw",t("err_pass"));
      await W.db.team("reset",{user_id:R.m.user_id,password:np});W.toast(t("team_reset_ok"));back();break;
    case "yesDel":
      if(C.member){await W.db.team("remove",{user_id:C.member.user_id});S.team=S.team.filter(function(m){return m.user_id!==C.member.user_id;});W.toast(t("team_removed"));back();break;}
      for(var d=0;d<C.items.length;d++){var it=C.items[d];await W.db.deleteProduct(it);S.products=S.products.filter(function(x){return x!==it;});}
      closeAll();W.toast(t("saved"));render();break;
    case "addPay":readSettings();D.payments.push({provider:"M-PESA",number:"",name:""});draw(false);break;
    case "rmPay":readSettings();D.payments.splice(+el.dataset.i,1);draw(false);break;

    case "addMember":readTeam();await addMember();break;
    case "savePin":await savePin();break;
  }}catch(err){console.error(err);W.toast(t(err&&err.message==="exists"?"team_exists":"error"));}

async function saveEdit(){
  if(!validProduct(E,E.keep.length+E.add.length))return;
  var p=E.p,patch=productData(E);
  var changedPhotos=E.add.length||E.keep.length!==(p.images||[]).length;
  if(changedPhotos)await W.db.setPhotos(p,E.keep,await W.prepPhotos(E.add));
  await W.db.updateProduct(p.id,patch);Object.assign(p,patch);
  if(changedPhotos){var fresh=(await W.db.listProducts(true)).find(function(x){return x.id===p.id;});if(fresh)Object.assign(p,fresh);}
  closeAll();W.toast(t("saved"));render();
}
async function saveSettings(){
  if(W.waPhone(D.whatsapp).length<12)return bad("s_err","w_s_wa",t("err_wa"));
  var pays=D.payments.filter(function(p){return String(p.number||"").trim();}).map(function(p){return {provider:p.provider,number:String(p.number).trim(),name:String(p.name||"").trim()};});
  var patch={whatsapp:W.waPhone(D.whatsapp),payments:pays};
  if(pays[0]){patch.lipa=pays[0].number;patch.lipa_name=pays[0].name;patch.network=pays[0].provider;}
  var saved=await W.db.saveShop(patch);S.shop=Object.assign(S.shop,saved||patch);
  back();W.toast(t("saved"));render();
}

  var btn=$("[data-act=addMember]");if(btn)btn.disabled=true;

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.stage==="ready"){reloadOrders();loadDash();}});
async function load(){
  var r=await Promise.all([W.db.getShop(),W.db.listProducts(true),W.db.me(),W.db.ping(),W.db.orders().catch(function(){return [];})]);
  S.shop=r[0]||{};S.products=r[1];S.me=r[2];S.status=r[3];S.orders=r[4];S.stage="ready";render();
  loadDash();startPolling();
  if(S.pendingOrder){var c=S.pendingOrder;S.pendingOrder=null;S.tab="orders";render();openOrder(c);}
}
async function afterAuth(){if(!(await W.db.isAdmin())){S.stage="denied";render();return;}await load();}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,async function(){if(S.stage==="ready"&&!stack.length)await load();});
W.watchNetwork(function(){if(S.stage==="ready")load().catch(function(){});else boot();});
var om=location.hash.match(/^#o-(.+)$/);if(om)S.pendingOrder=decodeURIComponent(om[1]);
async function boot(){
  render();
  try{var s=await W.db.session();if(!s){S.stage="login";render();return;}await afterAuth();}
  catch(e){console.error(e);S.status="down";if(S.stage==="boot"){W.errorScreen(boot);}else{S.stage="login";render();}}
}
boot();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});}catch(e){}}
})();
</script>
</body>
</html>

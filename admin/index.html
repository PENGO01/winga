<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niagize Boss</title>
<meta name="theme-color" content="#12283C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Niagize Boss">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
<style>
/* Boss side: three buttons below, profile on top, big yellow "Ongeza picha" in the middle. */
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:10px var(--gr) 10px var(--gl);padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:50%;background:var(--jua);opacity:.16;pointer-events:none}
header.top .mark{font-size:21px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--on-navy);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;position:relative;z-index:1}
.av{width:30px;height:30px;border-radius:50%;background:var(--jua);color:#12283C;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;flex:none}
.av.lg{width:46px;height:46px;font-size:18px}
.upq{font-family:var(--num);font-size:12px;background:var(--jua);color:#12283C;border-radius:999px;padding:3px 9px;font-weight:600;position:relative;z-index:1}
main{padding:0 var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
/* home */
.dash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.dash .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dash .big b{font-family:var(--num);font-size:40px;font-weight:600;line-height:1}
.dash .big span{color:var(--dim);font-weight:500}
.stage{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--sunk);border:0;border-radius:12px;padding:10px 11px;text-align:left}
.tile b{display:block;font-family:var(--num);font-size:22px;font-weight:600}
.tile span{font-size:12px;color:var(--dim)}
.tile.warn b{color:var(--amber)}
.linkcard{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.linkcard::after{content:"";position:absolute;right:-40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:var(--jua);opacity:.14;pointer-events:none}
.linkcard .u{font-family:var(--num);font-size:12.5px;color:var(--on-navy-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkcard .t{font-weight:600;font-size:14.5px}
.linkcard .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:var(--on-navy);z-index:1}
.preview{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.preview .bar{background:var(--navy);color:var(--on-navy);padding:8px 12px;font-family:var(--display);font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.preview .bar i{width:8px;height:8px;border-radius:50%;background:var(--jua)}
.preview .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.preview .pg img,.preview .pg span{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.preview .go{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);font-weight:600}
.preview .go svg{width:18px;height:18px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none}
/* products */
.ph{display:flex;align-items:center;gap:10px;padding-top:14px}
.ph h1{font-size:22px;flex:1}
.tools{display:flex;align-items:center;gap:8px}
.tools .chips{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--sunk);display:block}
.card .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .pr{font-family:var(--num);font-weight:600;font-size:13.5px}
.card .tag{position:absolute;left:8px;top:8px}
.card .ck{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(18,40,60,.35);display:grid;place-items:center;color:#12283C}
.card .ck svg{width:15px;height:15px;opacity:0}
.card.sel{outline:3px solid var(--jua);outline-offset:-1px}
.card.sel .ck{background:var(--jua);border-color:var(--jua)}
.card.sel .ck svg{opacity:1}
.card.dim img{opacity:.55}
.selbar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.selbar .in{pointer-events:auto;max-width:608px;width:100%;background:var(--navy);color:var(--on-navy);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.selbar b{flex:1;font-weight:600;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;height:68px}
nav.tabs button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);height:100%}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.fab{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-30px;cursor:pointer}
.fab span.c{width:62px;height:62px;border-radius:50%;background:var(--jua);border:4px solid var(--card);box-shadow:0 6px 18px rgba(18,40,60,.22);display:grid;place-items:center;color:#12283C}
.fab span.c svg{width:26px;height:26px}
.fab span.l{font-size:11px;font-weight:600;color:var(--ink)}
.fileHidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* sheets */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--sunk);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--dim);font-size:12.5px;font-weight:600;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.full{border-style:solid}
.slot.off{opacity:.45;cursor:default}
.slot .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(18,40,60,.7);color:#fff;display:grid;place-items:center}
.slot .rm svg{width:14px;height:14px}
.slot .add{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot .add svg{width:22px;height:22px}
.queue{display:flex;gap:6px;overflow-x:auto;align-items:center}
.queue img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;cursor:pointer;opacity:.85}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.ft2{display:flex;gap:8px}
.ft2 .btn{flex:1}
.ftr{display:flex;justify-content:flex-end;gap:8px}
.confirm{background:var(--red-soft);color:var(--red);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-weight:600}
.confirm .row .btn{flex:1}
.btn.red{background:var(--red);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;font-weight:600;padding:6px 4px}
.tbl td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .nm{display:flex;align-items:center;gap:8px;min-width:0}
.tbl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;font-weight:500}
.tbl .thumb{width:36px;height:36px;border-radius:8px}
.tbl input.input{min-height:38px;padding:7px 9px;width:100%;max-width:120px}
.tbl input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy)}
.prof{display:flex;align-items:center;gap:12px}
.prof .nm{font-family:var(--display);font-weight:800;font-size:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.pay{display:grid;grid-template-columns:1fr auto;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.pay select,.pay input{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 10px;min-height:40px;outline:none;width:100%}
.pay .two{grid-column:1/-1;gap:6px}
.sys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sys div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.sys span{display:block;font-size:11.5px;color:var(--dim)}
.sys b{font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.logout{color:var(--red)}
.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:600;background:var(--sunk);flex:none}
.step.done .n{background:var(--green);color:#fff}.step.done .tt{text-decoration:line-through;color:var(--dim)}
.step .tt{font-weight:600}.step .ss{font-size:12.5px;color:var(--dim)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px var(--gr) 24px var(--gl);max-width:440px;margin:0 auto}
.login .mark{font-size:34px}
.pwbtn{border:0;background:var(--sunk);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="pick" class="fileHidden" accept="image/*" multiple>
<input type="file" id="more" class="fileHidden" accept="image/*" multiple>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/core.js"></script>
<script>
(function(){
"use strict";
var W=window.Winga,t=W.t,esc=W.esc,$=W.$;
var S={shop:{},products:[],me:null,status:"pilot",tab:"home",filter:"all",cat:"",q:"",email:"",stage:"boot",lastCat:"viatu",select:false,sel:[]};
var Q={jobs:[],done:0,total:0,running:false};   // background uploads
var A=null;    // add-product sheet state
var E=null;    // single edit state
var B=null;    // bulk edit state
var D=null;    // settings draft
var sheet="";  // which sheet is open
var URLS=new Map(); function purl(f){if(!URLS.has(f))URLS.set(f,URL.createObjectURL(f));return URLS.get(f);}
var P='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
var IC={
 home:P+'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 grid:P+'<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>',
 cam:P+'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 x:P+'<path d="M6 6l12 12M18 6L6 18"/></svg>',
 search:P+'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 bulb:P+'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
 filter:P+'<path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 trash:P+'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
 share:P+'<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg>',
 copy:P+'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 wa:P+'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c.3 2 2 3.9 4.5 4.5l1.2-1.2 1.8.8c-.2 1.2-1.2 1.9-2.4 1.8-3.4-.4-6.2-3.2-6.6-6.6-.1-1.2.6-2.2 1.8-2.4l.8 1.8z"/></svg>',
 sun:P+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:P+'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 device:P+'<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>',
 out:P+'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
 plus:P+'<path d="M12 5v14M5 12h14"/></svg>',
 tag:P+'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>',
 text:P+'<path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 box:P+'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></svg>',
 mail:P+'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 lock:P+'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
 chev:P+'<path d="M9 6l6 6-6 6"/></svg>',
 down:P+'<path d="M6 9l6 6 6-6"/></svg>',
 refresh:P+'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>'
};
var FLAG={sw:"🇹🇿",en:"🇬🇧"};

/* ---------------- shell ---------------- */
function initials(n){return String(n||"B").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}
function shell(inner){
  var up=Q.total&&Q.done<Q.total?'<span class="upq">'+esc(t("uploading",{i:Q.done+1,n:Q.total}))+'</span>':"";
  var nm=(S.me&&S.me.name)||"Boss";
  return '<header class="top"><div class="mark"><i></i>Niagize</div>'+up+
   '<button class="me" data-act="profile" aria-label="'+esc(t("set_title"))+'"><span class="av">'+esc(initials(nm))+'</span>'+esc(nm)+'</button></header>'+
   '<main><div class="ptr" id="ptr"></div>'+inner+'</main>'+
   (S.select&&S.tab==="products"?selbar():"")+
   '<nav class="tabs" aria-label="Menu"><div class="in">'+
   tabBtn("home",IC.home,t("home"))+
   '<label class="fab" for="pick"><span class="c">'+IC.cam+'</span><span class="l">'+esc(t("addPhotos"))+'</span></label>'+
   tabBtn("products",IC.grid,t("products"))+'</div></nav>';
}
function tabBtn(id,icon,label){return '<button class="tab" data-tab="'+id+'" aria-current="'+(S.tab===id?"page":"false")+'">'+icon+'<span>'+esc(label)+'</span></button>';}
function render(){
  var a=$("#app");
  if(S.stage==="login"){a.innerHTML=vLogin();return;}
  if(S.stage==="denied"){a.innerHTML='<div class="login"><div class="mark"><i></i>Niagize</div><div class="banner">'+esc(t("notAdmin"))+'</div><button class="btn ghost" data-act="signout">'+IC.out+esc(t("signOut"))+'</button></div>';return;}
  if(S.stage!=="ready"){a.innerHTML='<div class="login"><div class="mark"><i></i>Niagize</div><div class="muted">'+esc(t("loading"))+'</div></div>';return;}
  a.innerHTML=shell(S.tab==="products"?vProducts():vHome());
  var q=$("#aq");if(q&&S.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);S.focusQ=false;}
}
function vLogin(){
  return '<form class="login" data-form="login"><div class="mark"><i></i>Niagize</div><div><h1>'+esc(t("boss_app"))+'</h1><div class="muted" style="margin-top:4px">'+esc(t("accountHint"))+'</div></div>'+
   '<label class="ifield">'+IC.mail+'<input id="em" type="email" autocomplete="username" inputmode="email" required placeholder="'+esc(t("email"))+'" value="'+esc(S.email)+'"></label>'+
   '<label class="ifield">'+IC.lock+'<input id="pw" type="password" autocomplete="current-password" required placeholder="'+esc(t("password"))+'"><button type="button" class="pwbtn" data-act="togglePw">'+esc(t("showPw"))+'</button></label>'+
   '<button class="btn primary block" type="submit">'+esc(t("login"))+'</button>'+
   '<div class="row" style="justify-content:center">'+langPick()+'</div></form>';
}
function langPick(){return '<label class="langpick"><span class="fl">'+FLAG[W.lang]+'</span>'+(W.lang==="sw"?"SW":"ENG")+IC.down+'<select data-change="lang" aria-label="'+esc(t("lang"))+'"><option value="sw"'+(W.lang==="sw"?" selected":"")+'>🇹🇿 Kiswahili</option><option value="en"'+(W.lang==="en"?" selected":"")+'>🇬🇧 English</option></select></label>';}

/* ---------------- numbers ---------------- */
function isLive(p){return p.status==="active"&&W.daysLeft(p)>0;}
function counts(){var c={live:0,ending:0,hidden:0,asked:0};S.products.forEach(function(p){if(isLive(p)){c.live++;if(W.daysLeft(p)<=3)c.ending++;}if(p.status==="hidden")c.hidden++;if(p.asks>0)c.asked++;});return c;}
function steps(){return [!!W.waPhone(S.shop.whatsapp),S.products.length>=3,W.ls("winga.shared")==="1"];}
function priceTxt(p){return p.price!=null?"TSh "+W.money(p.price):t("askPrice");}
function statePill(p){
  if(p.status==="hidden")return '<span class="pill ok">'+esc(t("hidden"))+'</span>';
  if(p.status==="soldout")return '<span class="pill late">'+esc(t("soldout"))+'</span>';
  var d=W.daysLeft(p);
  if(d<=0)return '<span class="pill late">'+esc(t("expired"))+'</span>';
  if(d===1)return '<span class="pill soon">'+esc(t("lastDay"))+'</span>';
  return '<span class="pill '+(d<=3?"soon":"ok")+'">'+esc(t("daysLeft",{n:d}))+'</span>';
}

/* ---------------- home ---------------- */
function vHome(){
  var c=counts(),st=steps(),open=st.filter(Boolean).length<3,u=W.shopUrl();
  var h='<section class="dash" style="margin-top:14px"><div class="row between"><span class="stage"><span class="sdot '+S.status+'"></span>'+esc(t("st_"+S.status))+'</span>'+
   '<button class="icon-btn" data-act="steps" aria-label="'+esc(t("steps_title"))+'">'+IC.bulb+(open?'<span class="dot"></span>':'')+'</button></div>'+
   '<div class="big"><span>'+esc(t("haveN"))+'</span><b>'+c.live+'</b><span>'+esc(t("inShopN"))+'</span></div>'+

  S.lastCat=A.cat;

  A.saved++;

/* upload queue */
function enqueue(data,files){Q.jobs.push({data:data,files:files});Q.total++;render();run();}
async function run(){
  if(Q.running)return;Q.running=true;
  var ok=0;
  while(Q.jobs.length){
    var j=Q.jobs[0];
    try{var p=await W.db.createProduct(j.data,await W.prepPhotos(j.files));S.products.unshift(p);ok++;}
    catch(e){W.toast(t("upload_fail",{x:j.data.name}));console.error(e);}
    Q.jobs.shift();Q.done++;render();
  }
  if(ok)W.toast(t("savedN",{n:ok}));
  Q.done=0;Q.total=0;Q.running=false;render();
}

  else{W.copy(txt+" "+u,$("#shopUrl"));W.ls("winga.shared","1");}

document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-act],[data-tab]");if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;S.select=false;S.sel=[];render();scrollTo(0,0);return;}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="scrim"){if(e.target===el)closeSheet();return;}
  try{switch(a){
    case "close":closeSheet();break;
    case "togglePw":var pw=$("#pw"),show=pw.type==="password";pw.type=show?"text":"password";el.textContent=show?t("hidePw"):t("showPw");break;
    case "signout":await W.db.signOut();closeSheet();S.stage="login";render();break;
    case "resetDemo":W.db.resetDemo();closeSheet();await load();break;
    case "profile":openProfile();break;
    case "steps":openSheet("steps");break;
    case "goSettings":closeSheet();openProfile();setTimeout(function(){var w=$("#s_wa");if(w)w.focus();},50);break;
    case "pickPhotos":closeSheet();$("#pick").click();break;
    case "shareShop":await shareShop();break;
    case "copyLink":W.copy(W.shopUrl(),$("#shopUrl"));break;
    case "goEnding":S.tab="products";S.filter="all";render();break;
    case "goHidden":S.tab="products";S.filter="hidden";render();break;
    case "still":await W.db.refresh(id);var p=byId(id);p.refreshed_at=new Date().toISOString();p.status="active";if(E){readFields(E);E.status="active";}W.toast(t("refreshed"));render();if(sheet)drawSheet();break;
    case "sold":await W.db.updateProduct(id,{status:"soldout"});byId(id).status="soldout";W.toast(t("saved"));render();break;
    case "filter":S.filter=el.dataset.f;render();break;
    case "catSheet":openSheet("cats");break;
    case "setCat":S.cat=el.dataset.cat;closeSheet();render();break;
    case "clearCat":S.cat="";render();break;
    case "selectMode":S.select=!S.select;S.sel=[];render();break;
    case "card":
      if(S.select){var k=S.sel.indexOf(id);if(k>=0)S.sel.splice(k,1);else S.sel.push(id);render();}
      else openEdit(byId(id));break;
    case "editSel":
      if(S.sel.length===1){openEdit(byId(S.sel[0]));}
      else{B={items:S.sel.map(function(i){var p=byId(i);return {p:p,price:p.price,hide:p.status==="hidden"};}),confirm:false};openSheet("bulk");}
      break;
    /* add / edit sheets */
    case "pickCat":var o=A||E;readFields(o);o.cat=el.dataset.cat;drawSheet();break;
    case "rmPhoto":var i=+el.dataset.i;
      if(A){readFields(A);A.photos.splice(i,1);}
      else if(E){readFields(E);if(i<E.keep.length)E.keep.splice(i,1);else E.add.splice(i-E.keep.length,1);}
      drawSheet();break;
    case "useQueued":readFields(A);if(A.photos.length<W.MAX_PHOTOS)A.photos.push(A.queue.splice(+el.dataset.i,1)[0]);drawSheet();break;
    case "addMore":readFields(A);if(!addValid())break;commitAdd();
      A=newA(A.queue,A.saved);if(A.queue.length)A.photos.push(A.queue.shift());drawSheet();
      var b=$(".sheet .bd");if(b)b.scrollTop=0;if(!A.photos.length)$("#more").click();break;
    case "addDone":readFields(A);
      if(!A.photos.length&&!A.name.trim()){closeSheet();break;}
      if(!addValid())break;commitAdd();closeSheet();break;
    case "setStatus":readFields(E);E.status=el.dataset.s;drawSheet();break;
    case "askDel":if(E){readFields(E);E.confirm=true;}if(B){readBulk();B.confirm=true;}drawSheet();break;
    case "noDel":if(E)E.confirm=false;if(B)B.confirm=false;drawSheet();break;
    case "yesDel":
      var dels=E?[E.p]:B.items.map(function(r){return r.p;});
      for(var d=0;d<dels.length;d++){await W.db.deleteProduct(dels[d]);S.products=S.products.filter(function(x){return x!==dels[d];});}
      S.select=false;S.sel=[];closeSheet();W.toast(t("saved"));render();break;
    case "saveEdit":readFields(E);await saveEdit();break;
    case "saveBulk":readBulk();await saveBulk();break;
    /* profile */
    case "theme":readSettings();W.applyTheme(el.dataset.th);drawSheet();break;
    case "addPay":readSettings();D.payments.push({provider:"M-PESA",number:"",name:""});drawSheet();break;
    case "rmPay":readSettings();D.payments.splice(+el.dataset.i,1);drawSheet();break;
    case "saveSettings":readSettings();await saveSettings();break;
  }}catch(err){console.error(err);W.toast(t("error"));}
});
async function saveEdit(){
  if(!E.name.trim()){W.toast(t("need_name"));return;}
  if(!E.keep.length&&!E.add.length){W.toast(t("need_photo"));return;}
  var p=E.p,patch={name:E.name.trim(),category:E.cat,price:W.parseMoney(E.price),description:E.desc.trim(),status:E.status};
  var changedPhotos=E.add.length||E.keep.length!==(p.images||[]).length;
  if(changedPhotos){await W.db.setPhotos(p,E.keep,await W.prepPhotos(E.add));}
  await W.db.updateProduct(p.id,patch);Object.assign(p,patch);
  if(changedPhotos){var fresh=(await W.db.listProducts(true)).find(function(x){return x.id===p.id;});if(fresh)Object.assign(p,fresh);}
  S.select=false;S.sel=[];closeSheet();W.toast(t("saved"));render();
}
function readBulk(){document.querySelectorAll("[data-bulk]").forEach(function(el){var r=B.items[+el.dataset.i];if(el.dataset.bulk==="price")r.price=el.value;else r.hide=el.checked;});}
async function saveBulk(){
  var rows=B.items.map(function(r){var st=r.hide?"hidden":(r.p.status==="hidden"?"active":r.p.status);return {id:r.p.id,p:r.p,patch:{price:W.parseMoney(r.price),status:st}};});
  await W.db.updateMany(rows);rows.forEach(function(r){Object.assign(r.p,r.patch);});
  S.select=false;S.sel=[];closeSheet();W.toast(t("saved"));render();
}
async function saveSettings(){
  var pays=D.payments.filter(function(p){return String(p.number||"").trim();}).map(function(p){return {provider:p.provider,number:String(p.number).trim(),name:String(p.name||"").trim()};});
  var patch={whatsapp:W.waPhone(D.whatsapp)||D.whatsapp.trim(),payments:pays};
  if(pays[0]){patch.lipa=pays[0].number;patch.lipa_name=pays[0].name;patch.network=pays[0].provider;}
  var saved=await W.db.saveShop(patch);
  S.shop=Object.assign(S.shop,saved||patch);
  closeSheet();W.toast(t("saved"));render();
}
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.dataset.change==="lang"){
    readSettings();readFields(A||E);
    W.setLang(el.value);render();if(sheet)drawSheet();return;
  }
  if(el.id==="pick"){var fs=Array.from(el.files||[]);el.value="";if(fs.length)startAdd(fs);return;}
  if(el.id==="more"){
    var fs2=Array.from(el.files||[]);el.value="";if(!fs2.length)return;
    if(A){readFields(A);var room=W.MAX_PHOTOS-A.photos.length;A.photos=A.photos.concat(fs2.slice(0,room));A.queue=fs2.slice(room).concat(A.queue);}
    else if(E){readFields(E);var room2=W.MAX_PHOTOS-E.keep.length-E.add.length;E.add=E.add.concat(fs2.slice(0,room2));}
    drawSheet();
  }
});
document.addEventListener("input",function(e){if(e.target.id==="aq"){S.q=e.target.value;S.focusQ=true;render();}});
document.addEventListener("submit",async function(e){
  if(e.target.dataset.form!=="login")return;e.preventDefault();
  var em=$("#em").value.trim(),pw=$("#pw").value;S.email=em;
  var btn=e.target.querySelector("[type=submit]");btn.disabled=true;
  try{await W.db.signIn(em,pw);await afterAuth();}
  catch(err){console.error(err);W.toast(t("wrongLogin"));btn.disabled=false;}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet)closeSheet();});

/* ---------------- boot ---------------- */
async function load(){
  var r=await Promise.all([W.db.getShop(),W.db.listProducts(true),W.db.me(),W.db.ping()]);
  S.shop=r[0]||{};S.products=r[1];S.me=r[2];S.status=r[3];S.stage="ready";render();
}
async function afterAuth(){
  if(!(await W.db.isAdmin())){S.stage="denied";render();return;}
  await load();
}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,async function(){if(S.stage==="ready"&&!sheet)await load();});
(async function boot(){
  render();
  try{var s=await W.db.session();if(!s){S.stage="login";render();return;}await afterAuth();}
  catch(e){console.error(e);S.status="down";S.stage="login";render();}
})();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});}catch(e){}}
})();
</script>
</body>
</html>

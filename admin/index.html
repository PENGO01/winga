<style>
/* Boss side. Selcom-style: round icon buttons on top, icon tiles, list menus, back arrows. */
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--on-navy);padding:10px var(--gr) 10px var(--gl);padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-50px;width:130px;height:130px;border-radius:50%;background:var(--jua);opacity:.14;pointer-events:none}
header.top .mark{font-size:21px;margin-right:auto}
header.top .sunload{width:28px;height:28px}
.upn{font-family:var(--num);font-size:12px;color:var(--jua);font-weight:600;margin-left:-4px}
main{padding:0 var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:14px}
/* home */
.dash{background:var(--navy);color:var(--on-navy);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;margin-top:14px}
.dash::after{content:"";position:absolute;right:-50px;bottom:-80px;width:170px;height:170px;border-radius:50%;background:var(--jua);opacity:.14;pointer-events:none}
.dash .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.dash .big b{font-family:var(--num);font-size:44px;font-weight:600;line-height:1}
.dash .big span{color:var(--on-navy-dim);font-weight:500}
.dash .sdot{position:absolute;top:18px;right:18px;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(255,255,255,.14);padding-top:12px;position:relative;z-index:1}
.stats button{background:none;border:0;color:inherit;text-align:left;padding:0}
.stats b{display:block;font-family:var(--num);font-size:20px;font-weight:600}
.stats span{font-size:12px;color:var(--on-navy-dim)}
.stats .warn b{color:var(--jua)}
.linkrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px}
.linkrow .t{font-weight:600;font-size:14px}
.linkrow .u{font-family:var(--num);font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.preview .bar{background:var(--navy);color:var(--on-navy);padding:8px 12px;font-family:var(--display);font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.preview .bar i{width:8px;height:8px;border-radius:50%;background:var(--jua)}
.preview .pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.preview .pg img,.preview .pg span{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--sunk);display:block}
.preview .go{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);font-weight:600}
.preview .go svg{width:18px;height:18px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--dim);margin-top:2px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sunk);flex:none}
/* products */
.ph{display:flex;align-items:center;gap:10px;padding-top:14px}
.ph h1{font-size:22px;flex:1}
.tools{display:flex;align-items:center;gap:8px}
.tools .chips{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--sunk);display:block}
.card .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .pr{font-family:var(--num);font-weight:600;font-size:13.5px}
.card .tag{position:absolute;left:8px;top:8px}
.card .ck{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(18,40,60,.35);display:grid;place-items:center;color:#12283C}
.card .ck svg{width:15px;height:15px;opacity:0}
.card.sel{outline:3px solid var(--jua);outline-offset:-1px}
.card.sel .ck{background:var(--jua);border-color:var(--jua)}
.card.sel .ck svg{opacity:1}
.card.dim img{opacity:.55}
.pill svg{width:13px;height:13px}
.selbar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.selbar .in{pointer-events:auto;max-width:608px;width:100%;background:var(--navy);color:var(--on-navy);border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.selbar b{flex:1;font-weight:600;font-size:14px;font-family:var(--num)}
.selbar .hbtn:disabled{opacity:.4}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;height:68px}
nav.tabs button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--faint);height:100%}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.fab{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-30px;cursor:pointer}
.fab span.c{width:62px;height:62px;border-radius:50%;background:var(--jua);border:4px solid var(--card);box-shadow:0 6px 18px rgba(18,40,60,.22);display:grid;place-items:center;color:#12283C}
.fab span.c svg{width:26px;height:26px}
.fab span.l{font-size:11px;font-weight:600;color:var(--ink)}
.fileHidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* pages */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--sunk);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--dim);cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.full{border-style:solid}
.slot.off{opacity:.45;cursor:default}
.slot .rm{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(18,40,60,.72);color:#fff;display:grid;place-items:center}
.slot .rm svg{width:15px;height:15px}
.slot>svg{width:26px;height:26px}
.queue{display:flex;gap:6px;overflow-x:auto;align-items:center}
.queue img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;cursor:pointer;opacity:.85}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.ft2{display:flex;gap:8px}
.ft2 .btn{flex:1}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:600;font-size:13.5px;color:var(--dim)}
.tg svg{width:18px;height:18px}
.tg[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .tg[aria-pressed="true"]{background:var(--jua);border-color:var(--jua);color:#12283C}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--dim)}
.ibtn svg{width:19px;height:19px}
.ibtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] .ibtn[aria-pressed="true"]{background:var(--jua);border-color:var(--jua);color:#12283C}
.btn.red{background:var(--red);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;font-weight:600;padding:6px 4px}
.tbl th svg{width:16px;height:16px;vertical-align:middle}
.tbl td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .nm{display:flex;align-items:center;gap:8px;min-width:0}
.tbl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px;font-weight:500}
.tbl .thumb{width:36px;height:36px;border-radius:8px}
.tbl input.input{min-height:38px;padding:7px 9px;width:100%;max-width:110px}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.prof .ring{width:104px;height:104px;border-radius:50%;padding:5px;background:conic-gradient(#C98B4E,#F2C38E,#A8672E,#C98B4E)}
.prof .ring span{width:100%;height:100%;border-radius:50%;background:var(--navy);color:var(--jua);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;border:3px solid var(--paper)}
.prof .nm{font-family:var(--display);font-weight:800;font-size:20px;text-align:center}
.pay{display:grid;grid-template-columns:1fr auto;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.pay select,.pay input{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 10px;min-height:40px;outline:none;width:100%}
.pay .two{grid-column:1/-1;gap:6px}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .avs{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.step{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:600;background:var(--sunk);flex:none}
.step.done .n{background:var(--green);color:#fff}.step.done .tt{text-decoration:line-through;color:var(--dim)}
.step .tt{font-weight:600}.step .ss{font-size:12.5px;color:var(--dim)}
.delbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:6px 0}
.delbox .big{width:64px;height:64px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;position:relative}
.delbox .big svg{width:30px;height:30px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px var(--gr) 24px var(--gl);max-width:440px;margin:0 auto;position:relative}
.login .mark{font-size:34px}
.login .corner{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:var(--gr);display:flex;gap:8px}
.login .corner .hbtn{background:var(--sunk);color:var(--ink)}
.eye{border:0;background:none;color:var(--dim);display:grid;place-items:center;padding:4px}
.eye svg{width:20px;height:20px}
</style>
</head>

/* ---------------- helpers ---------------- */
function owner(){return !!S.me&&(S.me.role==="boss"||S.me.role==="super_admin");}
function initials(n){return String(n||"B").split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}
function isLive(p){return (p.status==="active")&&W.daysLeft(p)>0;}
function steps(){return [!!W.waPhone(S.shop.whatsapp),S.products.length>=3,W.ls("winga.shared")==="1"];}
function priceTxt(p){return p.price!=null?"TSh "+W.money(p.price):t("askPrice");}
function statePill(p){
  if(p.status==="hidden")return '<span class="pill ok" title="'+esc(t("hidden"))+'">'+IC.eyeOff+'</span>';
  if(p.status==="archived")return '<span class="pill soon">'+IC.archive+esc(t("archived"))+'</span>';
  if(p.status==="soldout")return '<span class="pill late">'+esc(t("soldout"))+'</span>';
  if(W.isNew(p))return '<span class="pill sun">'+esc(t("isNew"))+'</span>';
  return "";

function pAdd(){
  var sub=A.saved?'<span class="pill good">'+esc(t("add_saved",{n:A.saved}))+'</span>':"";
  var q=A.queue.length?'<div class="queue">'+A.queue.map(function(f,i){return '<img src="'+esc(purl(f))+'" alt="" data-act="useQueued" data-i="'+i+'">';}).join("")+'</div>':"";
  return hd(t("add_title"),sub)+'<div class="bd">'+slots(A.photos.map(purl))+q+fields(A)+'</div>'+
   '<div class="ft"><div class="ft2"><button class="btn ghost" data-act="addMore">'+IC.plus+esc(t("add_more"))+'</button><button class="btn primary" data-act="addDone">'+esc(t("add_done"))+'</button></div></div>';
}
function newA(queue,saved){return {queue:queue||[],photos:[],name:"",cat:S.lastCat,price:"",ask:false,desc:"",saved:saved||0};}
function startAdd(files){A=newA(files.slice(),0);if(A.queue.length)A.photos.push(A.queue.shift());stack=["add"];draw(true);}
function addValid(){
  if(!A.photos.length){W.toast(t("need_photo"));return false;}
  if(!A.name.trim()){W.toast(t("need_name"));var n=$("#f_name");if(n)n.focus();return false;}
  return true;
}
function commitAdd(){S.lastCat=A.cat;enqueue({name:A.name.trim(),category:A.cat,price:A.ask?null:W.parseMoney(A.price),description:A.desc.trim()},A.photos.slice());A.saved++;}
function enqueue(data,files){Q.jobs.push({data:data,files:files});Q.total++;render();run();}
async function run(){
  if(Q.running)return;Q.running=true;var ok=0;
  while(Q.jobs.length){
    var j=Q.jobs[0];
    try{var p=await W.db.createProduct(j.data,await W.prepPhotos(j.files));S.products.unshift(p);ok++;}
    catch(e){W.toast(t("upload_fail",{x:j.data.name}));console.error(e);}
    Q.jobs.shift();Q.done++;render();
  }
  if(ok)W.toast(t("savedN",{n:ok}));
  Q.done=0;Q.total=0;Q.running=false;render();
}

  var list=S.team?S.team.map(function(m){
    var me=S.me&&m.user_id===S.me.id;
    return '<div class="member"><span class="avs">'+esc(initials(m.name))+'</span><div class="grow"><div style="font-weight:600">'+esc(m.name)+(me?' <span class="muted small">· '+esc(t("you"))+'</span>':'')+'</div><div class="small muted">'+esc(m.email||"")+'</div></div>'+
     '<span class="pill ok">'+esc(t("role_"+m.role))+'</span>'+(m.role==="assistant"?'<button class="iconbtn" data-act="rmMember" data-id="'+esc(m.user_id)+'" aria-label="'+esc(t("del"))+'" style="color:var(--red)">'+IC.trash+'</button>':'')+'</div>';
  }).join(""):'<div style="display:grid;place-items:center;padding:12px">'+W.SUN+'</div>';
  return hd(t("team"))+'<div class="bd">'+
   '<div class="list" style="padding:4px 12px">'+list+'</div>'+
   '<div class="eyebrow" style="margin-top:6px">'+esc(t("team_add"))+'</div>'+
   '<label class="ifield">'+IC.user+'<input id="t_name" placeholder="'+esc(t("team_name"))+'" value="'+esc(T.name)+'" autocomplete="off"></label>'+
   '<label class="ifield">'+IC.mail+'<input id="t_email" type="email" inputmode="email" placeholder="'+esc(t("email"))+'" value="'+esc(T.email)+'" autocomplete="off"></label>'+
   '<label class="ifield">'+IC.lock+'<input id="t_pw" type="password" placeholder="'+esc(t("team_pw"))+'" value="'+esc(T.pw)+'" autocomplete="new-password"><button type="button" class="eye" data-act="eye" data-for="t_pw" aria-label="Show">'+IC.eye+'</button></label>'+
   '<div class="hint">'+esc(t("team_note"))+'</div>'+
   '</div><div class="ft"><button class="btn primary block" data-act="addMember">'+IC.plus+esc(t("team_add"))+'</button></div>';
}
function readTeam(){var n=$("#t_name");if(!n||!T)return;T.name=n.value;T.email=$("#t_email").value;T.pw=$("#t_pw").value;}
async function loadTeam(){try{var r=await W.db.team("list");S.team=r.team||[];}catch(e){S.team=[];W.toast(t("error"));}if(stack[stack.length-1]==="team")draw(false);}

function pSteps(){
  var st=steps(),acts=["settings","pickPhotos","shareShop"];
  return hd(t("steps_title"))+'<div class="bd" style="gap:0">'+[1,2,3].map(function(n,i){
    return '<div class="step'+(st[i]?" done":"")+'"><span class="n">'+(st[i]?"✓":n)+'</span><div class="grow"><div class="tt">'+esc(t("step"+n))+'</div><div class="ss">'+esc(t("step"+n+"s"))+'</div></div>'+
     (st[i]?'':'<button class="btn sm primary" data-act="'+acts[i]+'">'+esc(t("go"))+'</button>')+'</div>';
  }).join("")+(st.every(Boolean)?'<div class="banner" style="margin-top:10px">'+esc(t("stepsDone"))+'</div>':'')+'</div>';
}
function pCats(){
  return hd("")+'<div class="bd"><div class="catpick">'+
   '<button class="chip" data-act="setCat" data-cat="" aria-pressed="'+(!S.cat)+'">'+esc(t("all"))+'</button>'+
   W.CATS.map(function(c){var n=S.products.filter(function(p){return p.category===c;}).length;return '<button class="chip" data-act="setCat" data-cat="'+c+'" aria-pressed="'+(S.cat===c)+'">'+esc(t("cat_"+c))+' <span class="num" style="opacity:.6">'+n+'</span></button>';}).join("")+
   '</div></div>';
}

/* ---------------- actions ---------------- */
function byId(id){return S.products.find(function(p){return p.id===id;});}
function readAll(){readFields(A||E);readSettings();readTeam();if(B)readBulk();}
async function shareShop(){
  var u=W.shopUrl(),txt=t("shareText");
  if(navigator.share){try{await navigator.share({title:S.shop.name||"Niagize Kariakoo",text:txt,url:u});W.ls("winga.shared","1");}catch(_){}}
  else{W.copy(txt+" "+u,$("#shopUrl"));W.ls("winga.shared","1");}
  render();draw(false);
}
document.addEventListener("click",async function(e){
  var el=e.target.closest("[data-act],[data-tab]");if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;S.select=false;S.sel=[];render();scrollTo(0,0);return;}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="scrim"){if(e.target===el&&POP[stack[stack.length-1]])back();return;}
  try{switch(a){
    case "back":readAll();back();break;
    case "theme":readAll();W.toggleTheme();render();draw(false);break;
    case "lang":readAll();W.setLang(W.lang==="sw"?"en":"sw");render();draw(false);break;
    case "eye":var f=$("#"+el.dataset.for),show=f.type==="password";f.type=show?"text":"password";el.innerHTML=show?IC.eyeOff:IC.eye;break;
    case "signout":await W.db.signOut();closeAll();S.stage="login";render();break;
    case "resetDemo":W.db.resetDemo();closeAll();await load();break;
    case "profile":open("profile");break;
    case "settings":D={whatsapp:S.shop.whatsapp||"",payments:JSON.parse(JSON.stringify(S.shop.payments||[]))};if(!D.payments.length)D.payments.push({provider:"M-PESA",number:"",name:""});
      if(stack[stack.length-1]==="steps")stack.pop();open("settings");break;
    case "team":T={name:"",email:"",pw:""};if(stack[stack.length-1]==="steps")stack.pop();open("team");loadTeam();break;
    case "steps":open("steps");break;
    case "pickPhotos":closeAll();$("#pick").click();break;
    case "shareShop":await shareShop();break;
    case "copyLink":W.copy(W.shopUrl(),$("#shopUrl"));break;
    case "openShop":window.open(W.shopUrl(),"_blank","noopener");break;
    case "goEnding":S.tab="products";S.filter="all";render();break;
    case "goFilter":S.tab="products";S.filter=el.dataset.f;S.select=false;render();scrollTo(0,0);break;
    case "still":await W.db.refresh(id);var p=byId(id);p.refreshed_at=new Date().toISOString();p.status="active";render();break;
    case "sold":await W.db.updateProduct(id,{status:"soldout"});byId(id).status="soldout";W.toast(t("saved"));render();break;
    case "filter":S.filter=el.dataset.f;render();break;
    case "cats":open("cats");break;
    case "setCat":S.cat=el.dataset.cat;back();render();break;
    case "clearCat":S.cat="";render();break;
    case "selectMode":S.select=!S.select;S.sel=[];render();break;
    case "card":
      if(S.select){var k=S.sel.indexOf(id);if(k>=0)S.sel.splice(k,1);else S.sel.push(id);render();}
      else openEdit(byId(id));break;
    case "editSel":
      if(S.sel.length===1)openEdit(byId(S.sel[0]));
      else{B={items:S.sel.map(function(i){var p=byId(i);return {p:p,price:p.price,hide:p.status==="hidden",arch:p.status==="archived"};})};open("bulk");}
      break;
    /* add / edit */
    case "pickCat":var o=A||E;readFields(o);o.cat=el.dataset.cat;draw(false);break;
    case "rmPhoto":var i=+el.dataset.i;
      if(A){readFields(A);A.photos.splice(i,1);}
      else if(E){readFields(E);if(i<E.keep.length)E.keep.splice(i,1);else E.add.splice(i-E.keep.length,1);}
      draw(false);break;
    case "useQueued":readFields(A);if(A.photos.length<W.MAX_PHOTOS)A.photos.push(A.queue.splice(+el.dataset.i,1)[0]);draw(false);break;
    case "addMore":readFields(A);if(!addValid())break;commitAdd();
      A=newA(A.queue,A.saved);if(A.queue.length)A.photos.push(A.queue.shift());draw(false);
      var b=$(".sheet .bd");if(b)b.scrollTop=0;if(!A.photos.length)$("#more").click();break;
    case "addDone":readFields(A);
      if(!A.photos.length&&!A.name.trim()){closeAll();break;}
      if(!addValid())break;commitAdd();closeAll();break;
    case "tgHide":readFields(E);E.status=E.status==="hidden"?"active":"hidden";draw(false);break;
    case "tgSold":readFields(E);E.status=E.status==="soldout"?"active":"soldout";draw(false);break;
    case "tgArchive":readFields(E);E.status=E.status==="archived"?"active":"archived";draw(false);break;
    case "unarchive":await W.db.unarchive(id);var up=byId(id);up.status="active";up.refreshed_at=new Date().toISOString();W.toast(t("unarchived"));closeAll();render();break;
    case "saveEdit":readFields(E);await saveEdit();break;
    case "bHide":readBulk();var r1=B.items[+el.dataset.i];r1.hide=!r1.hide;if(r1.hide)r1.arch=false;draw(false);break;
    case "bArch":readBulk();var r2=B.items[+el.dataset.i];r2.arch=!r2.arch;if(r2.arch)r2.hide=false;draw(false);break;
    case "saveBulk":readBulk();await saveBulk();break;
    case "askDelOne":readFields(E);C={items:[E.p]};open("confirm");break;
    case "askDelSel":if(B)readBulk();C={items:S.sel.map(byId)};open("confirm");break;
    case "rmMember":readTeam();C={member:S.team.find(function(m){return m.user_id===id;})};open("confirm");break;
    case "yesDel":
      if(C.member){await W.db.team("remove",{user_id:C.member.user_id});S.team=S.team.filter(function(m){return m.user_id!==C.member.user_id;});W.toast(t("team_removed"));back();break;}
      for(var d=0;d<C.items.length;d++){var it=C.items[d];await W.db.deleteProduct(it);S.products=S.products.filter(function(x){return x!==it;});}
      S.select=false;S.sel=[];closeAll();W.toast(t("saved"));render();break;
    /* settings */
    case "addPay":readSettings();D.payments.push({provider:"M-PESA",number:"",name:""});draw(false);break;
    case "rmPay":readSettings();D.payments.splice(+el.dataset.i,1);draw(false);break;
    case "saveSettings":readSettings();await saveSettings();break;
    case "addMember":readTeam();await addMember();break;
  }}catch(err){console.error(err);W.toast(t(err&&err.message==="exists"?"team_exists":"error"));}
});
async function saveEdit(){
  if(!E.name.trim()){W.toast(t("need_name"));return;}
  if(!E.keep.length&&!E.add.length){W.toast(t("need_photo"));return;}
  var p=E.p,patch={name:E.name.trim(),category:E.cat,price:E.ask?null:W.parseMoney(E.price),description:E.desc.trim(),status:E.status};
  if(E.status==="active"&&p.status==="archived")patch.refreshed_at=new Date().toISOString();   // un-archiving restarts the 60 days
  var changedPhotos=E.add.length||E.keep.length!==(p.images||[]).length;
  if(changedPhotos)await W.db.setPhotos(p,E.keep,await W.prepPhotos(E.add));
  await W.db.updateProduct(p.id,patch);Object.assign(p,patch);
  if(changedPhotos){var fresh=(await W.db.listProducts(true)).find(function(x){return x.id===p.id;});if(fresh)Object.assign(p,fresh);}
  S.select=false;S.sel=[];closeAll();W.toast(t("saved"));render();
}
async function saveBulk(){
  var now=new Date().toISOString();
  var rows=B.items.map(function(r){
    var was=r.p.status,st=r.arch?"archived":r.hide?"hidden":(was==="hidden"||was==="archived"?"active":was);
    var patch={price:W.parseMoney(r.price),status:st};if(was==="archived"&&st!=="archived")patch.refreshed_at=now;
    return {id:r.p.id,p:r.p,patch:patch};
  });
  await W.db.updateMany(rows);rows.forEach(function(r){Object.assign(r.p,r.patch);});
  S.select=false;S.sel=[];closeAll();W.toast(t("saved"));render();
}
async function saveSettings(){
  var pays=D.payments.filter(function(p){return String(p.number||"").trim();}).map(function(p){return {provider:p.provider,number:String(p.number).trim(),name:String(p.name||"").trim()};});
  var patch={whatsapp:W.waPhone(D.whatsapp)||D.whatsapp.trim(),payments:pays};
  if(pays[0]){patch.lipa=pays[0].number;patch.lipa_name=pays[0].name;patch.network=pays[0].provider;}
  var saved=await W.db.saveShop(patch);S.shop=Object.assign(S.shop,saved||patch);
  back();W.toast(t("saved"));render();
}
async function addMember(){
  if(!T.name.trim()){W.toast(t("team_name"));return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(T.email.trim())){W.toast(t("email"));return;}
  if(T.pw.length<8){W.toast(t("team_pw"));return;}
  var btn=$("[data-act=addMember]");if(btn)btn.disabled=true;
  try{await W.db.team("add",{name:T.name.trim(),email:T.email.trim().toLowerCase(),password:T.pw});T={name:"",email:"",pw:""};W.toast(t("team_added"));await loadTeam();}
  finally{var b2=$("[data-act=addMember]");if(b2)b2.disabled=false;}
}
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="f_ask"){readFields(A||E);draw(false);return;}
  if(el.id==="pick"){var fs=Array.from(el.files||[]);el.value="";if(fs.length)startAdd(fs);return;}
  if(el.id==="more"){
    var fs2=Array.from(el.files||[]);el.value="";if(!fs2.length)return;
    if(A){readFields(A);var room=W.MAX_PHOTOS-A.photos.length;A.photos=A.photos.concat(fs2.slice(0,room));A.queue=fs2.slice(room).concat(A.queue);}
    else if(E){readFields(E);var room2=W.MAX_PHOTOS-E.keep.length-E.add.length;E.add=E.add.concat(fs2.slice(0,room2));}
    draw(false);
  }
});
document.addEventListener("input",function(e){if(e.target.id==="aq"){S.q=e.target.value;S.focusQ=true;render();}});
document.addEventListener("submit",async function(e){
  if(e.target.dataset.form!=="login")return;e.preventDefault();
  var em=$("#em").value.trim(),pw=$("#pw").value;S.email=em;
  var btn=e.target.querySelector("[type=submit]");btn.disabled=true;
  try{await W.db.signIn(em,pw);await afterAuth();}
  catch(err){console.error(err);W.toast(t("wrongLogin"));btn.disabled=false;}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&stack.length){readAll();back();}});

/* ---------------- boot ---------------- */
async function load(){
  var r=await Promise.all([W.db.getShop(),W.db.listProducts(true),W.db.me(),W.db.ping()]);
  S.shop=r[0]||{};S.products=r[1];S.me=r[2];S.status=r[3];S.stage="ready";W.frame(S.status==="down"?"down":S.status==="live"?"live":"pilot");render();
}
async function afterAuth(){if(!(await W.db.isAdmin())){S.stage="denied";render();return;}await load();}
var ptrProxy={get classList(){return ($("#ptr")||document.createElement("i")).classList;},set innerHTML(v){var p=$("#ptr");if(p)p.innerHTML=v;}};
W.pullToRefresh(ptrProxy,async function(){if(S.stage==="ready"&&!stack.length)await load();});
W.frame();
(async function boot(){
  render();
  try{var s=await W.db.session();if(!s){S.stage="login";render();return;}await afterAuth();}
  catch(e){console.error(e);S.status="down";W.frame("down");S.stage="login";render();}
})();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});}catch(e){}}
})();
</script>
